<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Pretendard, sans-serif">
  <defs><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#27AE60"/></marker>
  <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker></defs>
  <rect width="1600" height="900" fill="#fff"/>
  <text x="800" y="60" text-anchor="middle" font-size="36" font-weight="700" fill="#212F3D">디스크 OFFLINE 이후의 두 갈래</text>
  <rect x="60" y="300" width="400" height="260" rx="12" fill="#D6EAF8" stroke="#2471A3" stroke-width="3"/>
  <text x="260" y="350" text-anchor="middle" font-size="28" font-weight="700" fill="#2471A3">디스크 OFFLINE</text>
  <g font-size="22" fill="#212F3D"><text x="90" y="400">• MODE_STATUS OFFLINE</text><text x="90" y="440">• STATE NORMAL (제거 아님)</text><text x="90" y="480">• USED_MB 유지</text><text x="90" y="520">• REPAIR_TIMER 카운트다운</text></g>
  <path d="M460 380 L620 230" stroke="#27AE60" stroke-width="5" marker-end="url(#g)"/>
  <path d="M460 480 L620 640" stroke="#C0392B" stroke-width="5" marker-end="url(#r)"/>
  <text x="505" y="365" font-size="22" font-weight="700" fill="#27AE60">타이머 안</text>
  <text x="510" y="610" font-size="22" font-weight="700" fill="#C0392B">만료</text>
  <rect x="630" y="110" width="900" height="250" rx="12" fill="#ECF0F1" stroke="#27AE60" stroke-width="3"/>
  <text x="670" y="160" font-size="28" font-weight="700" fill="#27AE60">ONLINE → fast mirror resync</text>
  <g font-size="24" fill="#212F3D"><text x="670" y="210">• Staleness Registry 에 적힌 익스텐트만 갱신</text><text x="670" y="255">• 이 랩: 약 9초 (디스크 추가 파워 1 은 239초)</text><text x="670" y="300">• 조건: compatible.rdbms 11.1 이상</text><text x="670" y="340" fill="#5D6D7E">• 디스크 이름·헤더 그대로</text></g>
  <rect x="630" y="510" width="900" height="250" rx="12" fill="#FDEDEC" stroke="#C0392B" stroke-width="3"/>
  <text x="670" y="560" font-size="28" font-weight="700" fill="#C0392B">ASM 이 스스로 DROP DISK ... FORCE</text>
  <g font-size="24" fill="#212F3D"><text x="670" y="610">• alert.log 에 /* ASM SERVER */ 표시</text><text x="670" y="655">• 이름 _DROPPED_…, STATE FORCING, 전체 리밸런스</text><text x="670" y="700">• 헤더 MEMBER 로 남음 → 되돌리려면 ADD ... FORCE</text><text x="670" y="740" fill="#5D6D7E">• 데이터베이스는 계속 정상 (사본이 남아 있음)</text></g>
  <text x="800" y="830" text-anchor="middle" font-size="24" fill="#212F3D">disk_repair_time 기본 3.6h (실습 3m) · failgroup_repair_time 기본 24.0h</text>
  <text x="800" y="868" text-anchor="middle" font-size="22" fill="#5D6D7E">계획된 점검: 타이머가 작업 시간보다 긴지 확인 → 직접 OFFLINE → 작업 뒤 ONLINE ALL</text>
</svg>
