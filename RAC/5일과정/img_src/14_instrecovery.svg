<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Pretendard, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5D6D7E"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#fff"/>
  <text x="800" y="58" text-anchor="middle" font-size="36" font-weight="700" fill="#212F3D">racdb2 가 죽은 뒤 racdb1 의 알럿 로그 순서</text>
  <line x1="120" y1="200" x2="1500" y2="200" stroke="#5D6D7E" stroke-width="4" marker-end="url(#a)"/>
  <g font-size="22" fill="#5D6D7E" text-anchor="middle">
    <circle cx="160" cy="200" r="12" fill="#C0392B"/><text x="160" y="170">15:10:09</text>
    <circle cx="520" cy="200" r="12" fill="#B9770E"/><text x="520" y="170">15:10:14.229</text>
    <circle cx="880" cy="200" r="12" fill="#B9770E"/><text x="880" y="170">15:10:14.505</text>
    <circle cx="1240" cy="200" r="12" fill="#27AE60"/><text x="1240" y="170">15:10:15.155</text>
  </g>
  <rect x="60" y="250" width="320" height="250" rx="12" fill="#FDEDEC" stroke="#C0392B" stroke-width="3"/>
  <text x="220" y="300" text-anchor="middle" font-size="26" font-weight="700" fill="#C0392B">① 인스턴스 사망</text>
  <text x="220" y="350" text-anchor="middle" font-size="22" fill="#212F3D">rac2 의 PMON 강제 종료</text>
  <text x="220" y="390" text-anchor="middle" font-size="22" fill="#212F3D">세션 끊김</text>
  <text x="220" y="430" text-anchor="middle" font-size="22" fill="#212F3D">미완료 트랜잭션 남음</text>
  <rect x="400" y="250" width="340" height="250" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <text x="570" y="300" text-anchor="middle" font-size="26" font-weight="700" fill="#212F3D">② 재구성</text>
  <text x="570" y="350" text-anchor="middle" font-size="22" fill="#212F3D">Reconfiguration started</text>
  <text x="570" y="390" text-anchor="middle" font-size="22" fill="#C0392B">GRD frozen — 블록 전송 정지</text>
  <text x="570" y="430" text-anchor="middle" font-size="22" fill="#212F3D">dead instance detected</text>
  <text x="570" y="470" text-anchor="middle" font-size="22" fill="#5D6D7E">재구성 0.1초</text>
  <rect x="760" y="250" width="340" height="250" rx="12" fill="#D6EAF8" stroke="#2471A3" stroke-width="3"/>
  <text x="930" y="300" text-anchor="middle" font-size="26" font-weight="700" fill="#2471A3">③ 인스턴스 복구</text>
  <text x="930" y="350" text-anchor="middle" font-size="22" fill="#212F3D">SMON 이 thread 2 의</text>
  <text x="930" y="390" text-anchor="middle" font-size="22" fill="#212F3D">온라인 리두를 읽는다</text>
  <text x="930" y="430" text-anchor="middle" font-size="22" fill="#212F3D">롤포워드 → 롤백</text>
  <text x="930" y="470" text-anchor="middle" font-size="22" fill="#5D6D7E">체크포인트 이후만 적용</text>
  <rect x="1120" y="250" width="420" height="250" rx="12" fill="#E9F7EF" stroke="#27AE60" stroke-width="3"/>
  <text x="1330" y="300" text-anchor="middle" font-size="26" font-weight="700" fill="#27AE60">④ 복구 완료</text>
  <text x="1330" y="350" text-anchor="middle" font-size="22" fill="#212F3D">Completed instance recovery</text>
  <text x="1330" y="390" text-anchor="middle" font-size="22" fill="#212F3D">Redo thread 2 internally</text>
  <text x="1330" y="430" text-anchor="middle" font-size="22" fill="#212F3D">disabled (SMON)</text>
  <text x="1330" y="470" text-anchor="middle" font-size="22" fill="#5D6D7E">재구성부터 0.93초</text>
  <rect x="60" y="560" width="1480" height="270" rx="12" fill="#fff" stroke="#5D6D7E" stroke-width="2"/>
  <text x="100" y="610" font-size="26" font-weight="700" fill="#212F3D">두 시간을 구분한다 (실습 05 기록)</text>
  <g font-size="24" fill="#212F3D">
    <text x="100" y="665">• 인스턴스 복구: 1초 미만 — racdb1 세션이 잠깐 멈추는 시간. ESTIMATED_MTTR 로 미리 가늠한다</text>
    <text x="100" y="715">• 인스턴스 재기동: Clusterware 가 racdb2 를 다시 올리기까지 약 1분 — 서비스 복귀 시간</text>
    <text x="100" y="765">• racdb2 에 붙어 있던 세션의 재접속은 FAN·TAF·AC 의 몫 (13장)</text>
  </g>
