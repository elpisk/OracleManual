<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Pretendard, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#34495E"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#27AE60"/></marker></defs>
  <rect width="1600" height="900" fill="#fff"/>
  <text x="800" y="58" text-anchor="middle" font-size="36" font-weight="700" fill="#212F3D">오류 접두어가 알려 주는 계층</text>
  <rect x="80" y="110" width="680" height="150" rx="12" fill="#fff" stroke="#B9770E" stroke-width="3"/>
  <text x="110" y="160" font-size="30" font-weight="700" fill="#B9770E" font-family="JetBrains Mono, monospace">PRKO-</text>
  <text x="110" y="205" font-size="24" fill="#212F3D">srvctl 명령행 해석 — 입력을 다시 본다</text>
  <text x="110" y="240" font-size="22" fill="#5D6D7E">PRKO-2002 옵션 · PRKO-3032 인스턴스 이름</text>
  <rect x="80" y="300" width="680" height="250" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <text x="110" y="345" font-size="26" font-weight="700" fill="#212F3D">srvctl 내부 — 명령은 맞고 대상·상태가 다르다</text>
  <text x="110" y="400" font-size="24" fill="#212F3D"><tspan font-family="JetBrains Mono, monospace" font-weight="700">PRCD-</tspan>  데이터베이스 계층 (PRCD-1120)</text>
  <text x="110" y="450" font-size="24" fill="#212F3D"><tspan font-family="JetBrains Mono, monospace" font-weight="700">PRCR-</tspan>  자원 계층 (PRCR-1001, 1004)</text>
  <text x="110" y="500" font-size="24" fill="#212F3D"><tspan font-family="JetBrains Mono, monospace" font-weight="700">PRCC-</tspan>  공통 계층 (PRCC-1015)</text>
  <rect x="80" y="590" width="680" height="150" rx="12" fill="#D6EAF8" stroke="#2471A3" stroke-width="3"/>
  <text x="110" y="640" font-size="30" font-weight="700" fill="#2471A3" font-family="JetBrains Mono, monospace">CRS-</text>
  <text x="110" y="685" font-size="24" fill="#212F3D">Clusterware 자원 계층 — 자원 상태를 본다</text>
  <text x="110" y="720" font-size="22" fill="#5D6D7E">CRS-4995 · CRS-2613 · CRS-4000</text>
  <line x1="420" y1="260" x2="420" y2="296" stroke="#34495E" stroke-width="3" marker-end="url(#a)"/>
  <line x1="420" y1="550" x2="420" y2="586" stroke="#34495E" stroke-width="3" marker-end="url(#a)"/>
  <rect x="840" y="200" width="680" height="330" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <text x="870" y="255" font-size="22" fill="#212F3D" font-family="JetBrains Mono, monospace">$ srvctl status database -d nodb</text>
  <text x="870" y="320" font-size="22" fill="#C0392B" font-family="JetBrains Mono, monospace">PRCD-1120 : The resource for</text>
  <text x="870" y="352" font-size="22" fill="#C0392B" font-family="JetBrains Mono, monospace">  database nodb could not be found.</text>
  <text x="870" y="420" font-size="22" fill="#C0392B" font-family="JetBrains Mono, monospace">PRCR-1001 : Resource ora.nodb.db</text>
  <text x="870" y="452" font-size="22" fill="#C0392B" font-family="JetBrains Mono, monospace">  does not exist</text>
  <text x="840" y="590" font-size="26" fill="#212F3D"><tspan font-weight="700">위 줄</tspan>  무엇을 하려다 실패했는가</text>
  <text x="840" y="640" font-size="26" fill="#C0392B" font-weight="700">아래 줄  왜 실패했는가 → 먼저 읽는다</text>
  <text x="840" y="720" font-size="24" fill="#5D6D7E">ORA-02097 + ORA-30013 (10장) 도 같은 구조</text>
</svg>
