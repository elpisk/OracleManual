<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Pretendard, sans-serif">
  <defs>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B9770E"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#fff"/>
  <text x="800" y="58" text-anchor="middle" font-size="36" font-weight="700" fill="#212F3D">gc 경합 재현 — 같은 50 행을 두 노드가 40초 동안 갱신</text>
  <rect x="60" y="100" width="480" height="260" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <text x="300" y="145" text-anchor="middle" font-size="28" font-weight="700" fill="#212F3D">racdb1</text>
  <text x="90" y="195" font-size="22" fill="#212F3D" font-family="JetBrains Mono, monospace">update ... id 1~50</text>
  <text x="90" y="245" font-size="22" fill="#212F3D">current received +3987</text>
  <text x="90" y="285" font-size="22" fill="#212F3D">current served   +3996</text>
  <rect x="1060" y="100" width="480" height="260" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <text x="1300" y="145" text-anchor="middle" font-size="28" font-weight="700" fill="#212F3D">racdb2</text>
  <text x="1090" y="195" font-size="22" fill="#212F3D" font-family="JetBrains Mono, monospace">update ... id 1~50</text>
  <text x="1090" y="245" font-size="22" fill="#212F3D">current received +3996</text>
  <text x="1090" y="285" font-size="22" fill="#212F3D">current served   +3987</text>
  <line x1="545" y1="200" x2="1055" y2="200" stroke="#B9770E" stroke-width="5" marker-end="url(#r)"/>
  <line x1="1055" y1="270" x2="545" y2="270" stroke="#B9770E" stroke-width="5" marker-end="url(#r)"/>
  <text x="800" y="185" text-anchor="middle" font-size="22" fill="#B9770E">인터커넥트 (HAIP)</text>
  <text x="800" y="310" text-anchor="middle" font-size="22" fill="#5D6D7E">받은 수 = 상대가 보낸 수</text>
  <rect x="60" y="410" width="720" height="420" rx="12" fill="#FDEDEC" stroke="#C0392B" stroke-width="3"/>
  <text x="420" y="455" text-anchor="middle" font-size="26" font-weight="700" fill="#C0392B">① 대기 이벤트 순위가 바뀐다</text>
  <g font-size="22" fill="#212F3D">
    <text x="90" y="510">GV$SYSTEM_EVENT</text>
    <text x="90" y="555">전: gc current block 2-way 1위</text>
    <text x="90" y="600">후: gc current block busy 1위 (양 노드)</text>
    <text x="90" y="645">평균 0.19 → 0.42~0.44 센티초</text>
    <text x="90" y="690">gc buffer busy release 도 증가</text>
    <text x="90" y="760" fill="#5D6D7E">무엇이 경합하는지는 아직 모른다</text>
  </g>
  <rect x="820" y="410" width="720" height="420" rx="12" fill="#D6EAF8" stroke="#2471A3" stroke-width="3"/>
  <text x="1180" y="455" text-anchor="middle" font-size="26" font-weight="700" fill="#2471A3">② 원인 객체를 특정한다</text>
  <g font-size="22" fill="#212F3D">
    <text x="850" y="510">GV$SEGMENT_STATISTICS</text>
    <text x="850" y="555">SYS.CH20_T gc current blocks received</text>
    <text x="850" y="600">inst 1: 3786 / inst 2: 3787</text>
    <text x="850" y="645">→ 전체 증가분 거의 전부</text>
    <text x="850" y="700">GV$INSTANCE_CACHE_TRANSFER</text>
    <text x="850" y="745">data block CURRENT_BUSY 4407 · 4452</text>
    <text x="850" y="790">undo header CR_BLOCK 도 크다</text>
  </g>
</svg>
