<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Pretendard, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#34495E"/></marker></defs>
  <rect width="1600" height="900" fill="#fff"/>
  <text x="800" y="60" text-anchor="middle" font-size="36" font-weight="700" fill="#212F3D">asmcmd — ASM 이름 공간을 셸처럼</text>
  <rect x="60" y="100" width="720" height="420" rx="12" fill="#D6EAF8" stroke="#2471A3" stroke-width="3"/>
  <text x="420" y="150" text-anchor="middle" font-size="28" font-weight="700" fill="#2471A3">조회</text>
  <g font-size="21" fill="#212F3D">
    <text x="90" y="205" font-family="JetBrains Mono, monospace">ls -l · ls -ls</text><text x="400" y="205">Sys 열 · 별칭 화살표</text>
    <text x="90" y="265" font-family="JetBrains Mono, monospace">du +DATA/RACDB</text><text x="400" y="265">Used · Mirror_used</text>
    <text x="90" y="325" font-family="JetBrains Mono, monospace">lsof -G DATA</text><text x="400" y="325">열린 파일 · 인스턴스</text>
    <text x="90" y="385" font-family="JetBrains Mono, monospace">find --type ... + '*'</text><text x="400" y="385">패턴 빠뜨리면 사용법만</text>
    <text x="90" y="445" font-family="JetBrains Mono, monospace">lsdg · spget · dsget</text><text x="400" y="445">디스크그룹 · 파라미터</text>
  </g>
  <rect x="840" y="100" width="700" height="420" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <text x="1190" y="150" text-anchor="middle" font-size="28" font-weight="700" fill="#212F3D">cp — 안팎으로 복사</text>
  <rect x="880" y="185" width="270" height="90" rx="12" fill="#fff" stroke="#34495E" stroke-width="3"/>
  <text x="1015" y="238" text-anchor="middle" font-size="20" font-family="JetBrains Mono, monospace" fill="#212F3D">/tmp/copy_out.dbf</text>
  <rect x="1230" y="185" width="270" height="90" rx="12" fill="#D6EAF8" stroke="#2471A3" stroke-width="3"/>
  <text x="1365" y="238" text-anchor="middle" font-size="20" font-family="JetBrains Mono, monospace" fill="#212F3D">+TEST/...</text>
  <path d="M1150 215 L1225 215" stroke="#34495E" stroke-width="3" marker-end="url(#a)"/>
  <path d="M1230 250 L1155 250" stroke="#34495E" stroke-width="3" marker-end="url(#a)"/>
  <g font-size="22" fill="#212F3D">
    <text x="870" y="330">• 밖으로 꺼낸 파일은 grid:oinstall 소유</text>
    <text x="870" y="375">• 안으로 넣으면 +TEST/ASM/DATAFILE/…</text>
    <text x="895" y="410">에 실제 파일, 지정 경로는 별칭</text>
    <text x="870" y="455">• 디스크그룹 사이 복사도 가능</text>
  </g>
  <rect x="60" y="570" width="1480" height="280" rx="12" fill="#FDEDEC" stroke="#C0392B" stroke-width="3"/>
  <text x="100" y="620" font-size="26" font-weight="700" fill="#C0392B">cp 로 하지 않는 것</text>
  <text x="100" y="670" font-size="22" fill="#212F3D">• 데이터베이스가 열어 둔 데이터 파일의 일관된 사본 — 조각난 사본이 된다</text>
  <text x="100" y="715" font-size="22" fill="#212F3D">• 백업 · 이관은 RMAN (14장, 8장) — 병렬 처리와 검증이 있다</text>
  <text x="100" y="760" font-size="22" fill="#212F3D">• 언마운트 전에는 lsof 로 사용처를 먼저 확인한다 (4장 ORA-15027)</text>
  <text x="100" y="805" font-size="22" fill="#5D6D7E">asmcmd 는 grid 계정에서, ORACLE_SID=+ASM1 환경으로 실행한다</text>
</svg>
