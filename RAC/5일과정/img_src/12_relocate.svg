<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Pretendard, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#34495E"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker></defs>
  <rect width="1600" height="900" fill="#fff"/>
  <text x="800" y="58" text-anchor="middle" font-size="36" font-weight="700" fill="#212F3D">srvctl relocate service — 새 접속만 옮겨 간다</text>
  <text x="800" y="115" text-anchor="middle" font-size="22" fill="#2471A3" font-family="JetBrains Mono, monospace">srvctl relocate service -d racdb -s ch15_oltp -oldinst racdb1 -newinst racdb2</text>
  <rect x="560" y="160" width="480" height="90" rx="12" fill="#E9F7EF" stroke="#1E8449" stroke-width="3"/>
  <text x="800" y="215" text-anchor="middle" font-size="26" font-weight="700" fill="#1E8449">SCAN 리스너 (새 접속)</text>
  <rect x="100" y="350" width="600" height="320" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <text x="400" y="400" text-anchor="middle" font-size="30" font-weight="700" fill="#212F3D">racdb1</text>
  <rect x="140" y="430" width="520" height="90" rx="12" fill="#fff" stroke="#5D6D7E" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="400" y="485" text-anchor="middle" font-size="24" fill="#5D6D7E">ch15_oltp — 떠나감</text>
  <rect x="140" y="545" width="520" height="100" rx="12" fill="#fff" stroke="#27AE60" stroke-width="3"/>
  <text x="400" y="588" text-anchor="middle" font-size="24" font-weight="700" fill="#27AE60">기존 세션 SID 20</text>
  <text x="400" y="625" text-anchor="middle" font-size="22" fill="#212F3D">끊기지 않고 작업을 마침</text>
  <rect x="900" y="350" width="600" height="320" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <text x="1200" y="400" text-anchor="middle" font-size="30" font-weight="700" fill="#212F3D">racdb2</text>
  <rect x="940" y="430" width="520" height="90" rx="12" fill="#fff" stroke="#C0392B" stroke-width="3"/>
  <text x="1200" y="485" text-anchor="middle" font-size="24" font-weight="700" fill="#C0392B">ch15_oltp — 도착</text>
  <rect x="940" y="545" width="520" height="100" rx="12" fill="#fff" stroke="#27AE60" stroke-width="3"/>
  <text x="1200" y="588" text-anchor="middle" font-size="24" font-weight="700" fill="#27AE60">새 접속</text>
  <text x="1200" y="625" text-anchor="middle" font-size="22" fill="#212F3D">SCAN 으로 10번 모두 racdb2</text>
  <line x1="660" y1="475" x2="935" y2="475" stroke="#C0392B" stroke-width="4" marker-end="url(#r)"/>
  <text x="800" y="460" text-anchor="middle" font-size="22" fill="#C0392B" font-weight="700">이름표 이동</text>
  <line x1="940" y1="250" x2="1100" y2="345" stroke="#1E8449" stroke-width="4" marker-end="url(#g)"/>
  <line x1="660" y1="250" x2="500" y2="345" stroke="#5D6D7E" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="470" y="300" text-anchor="end" font-size="22" fill="#5D6D7E">새 접속 없음</text>
  <rect x="100" y="720" width="1400" height="130" rx="12" fill="#fff" stroke="#34495E" stroke-width="3"/>
  <text x="130" y="768" font-size="24" fill="#212F3D"><tspan font-weight="700">정의는 그대로</tspan> — config 의 Preferred 는 racdb1, 재기동하면 원위치</text>
  <text x="130" y="815" font-size="24" fill="#212F3D"><tspan font-weight="700">영구 변경</tspan> — srvctl modify service … -modifyconfig -preferred racdb2</text>
</svg>
