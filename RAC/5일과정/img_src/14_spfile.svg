<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Pretendard, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5D6D7E"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#fff"/>
  <text x="800" y="58" text-anchor="middle" font-size="36" font-weight="700" fill="#212F3D">restore spfile to 는 CRS 등록 정보를 바꾼다</text>
  <rect x="60" y="110" width="700" height="140" rx="12" fill="#fff" stroke="#5D6D7E" stroke-width="3"/>
  <text x="410" y="160" text-anchor="middle" font-size="26" font-weight="700" fill="#212F3D">RMAN 검증 목적의 복원</text>
  <text x="410" y="210" text-anchor="middle" font-size="22" fill="#212F3D" font-family="JetBrains Mono, monospace">restore spfile to '/tmp/...' from autobackup</text>
  <rect x="840" y="110" width="700" height="140" rx="12" fill="#D6EAF8" stroke="#2471A3" stroke-width="3"/>
  <text x="1190" y="160" text-anchor="middle" font-size="26" font-weight="700" fill="#2471A3">+FRA 자동 백업</text>
  <text x="1190" y="210" text-anchor="middle" font-size="22" fill="#212F3D">racdb1. · racdb2. 항목이 그대로 들어 있다</text>
  <line x1="835" y1="180" x2="765" y2="180" stroke="#5D6D7E" stroke-width="4" marker-end="url(#g)"/>
  <rect x="60" y="330" width="700" height="230" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <text x="410" y="380" text-anchor="middle" font-size="26" font-weight="700" fill="#212F3D">실행 중인 인스턴스</text>
  <text x="410" y="430" text-anchor="middle" font-size="22" fill="#212F3D">기동 때 읽은 SPFILE 을 계속 쓴다</text>
  <text x="410" y="475" text-anchor="middle" font-size="22" fill="#212F3D" font-family="JetBrains Mono, monospace">gv$parameter spfile = +DATA/...</text>
  <text x="410" y="525" text-anchor="middle" font-size="24" font-weight="700" fill="#27AE60">그날은 아무 이상 없음</text>
  <rect x="840" y="330" width="700" height="230" rx="12" fill="#FDEDEC" stroke="#C0392B" stroke-width="3"/>
  <text x="1190" y="380" text-anchor="middle" font-size="26" font-weight="700" fill="#C0392B">CRS 에 등록된 SPFILE 경로</text>
  <text x="1190" y="430" text-anchor="middle" font-size="22" fill="#5D6D7E" font-family="JetBrains Mono, monospace">전: +DATA/RACDB/PARAMETERFILE/...</text>
  <text x="1190" y="475" text-anchor="middle" font-size="22" fill="#C0392B" font-family="JetBrains Mono, monospace">후: /tmp/spfile_ch17_test.ora</text>
  <text x="1190" y="525" text-anchor="middle" font-size="22" fill="#212F3D">srvctl config database 로 보인다</text>
  <path d="M410 250 L410 325" stroke="#5D6D7E" stroke-width="4" marker-end="url(#g)"/>
  <path d="M600 250 L1000 325" stroke="#C0392B" stroke-width="4" marker-end="url(#a)"/>
  <rect x="840" y="620" width="700" height="210" rx="12" fill="#fff" stroke="#C0392B" stroke-width="3" stroke-dasharray="10 6"/>
  <text x="1190" y="670" text-anchor="middle" font-size="26" font-weight="700" fill="#C0392B">몇 주 뒤 srvctl start database</text>
  <text x="1190" y="720" text-anchor="middle" font-size="22" fill="#212F3D">임시 파일을 지웠다면</text>
  <text x="1190" y="760" text-anchor="middle" font-size="22" fill="#212F3D">SPFILE 없이 기동을 시도한다</text>
  <line x1="1190" y1="560" x2="1190" y2="615" stroke="#C0392B" stroke-width="4" marker-end="url(#a)"/>
  <rect x="60" y="620" width="700" height="210" rx="12" fill="#E9F7EF" stroke="#27AE60" stroke-width="3"/>
  <text x="410" y="670" text-anchor="middle" font-size="26" font-weight="700" fill="#27AE60">조치</text>
  <text x="100" y="720" font-size="22" fill="#212F3D">• 복원 전에 원래 경로를 기록한다</text>
  <text x="100" y="760" font-size="22" fill="#212F3D">• 끝나면 srvctl modify database -spfile</text>
  <text x="100" y="800" font-size="22" fill="#212F3D">• 존재 확인만이면 list backup of spfile</text>
</svg>
