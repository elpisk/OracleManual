<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Pretendard, sans-serif">
  <defs><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#34495E"/></marker></defs>
  <rect width="1600" height="900" fill="#fff"/>
  <text x="800" y="60" text-anchor="middle" font-size="36" font-weight="700" fill="#212F3D">파일 23 의 위치를 네 번 바꾸며 본 rac2 의 결과</text>
  <g font-size="26" text-anchor="middle">
    <rect x="60" y="140" width="320" height="300" rx="12" fill="#FDEDEC" stroke="#C0392B" stroke-width="3"/>
    <text x="220" y="195" font-weight="700" fill="#212F3D">① 로컬 FS</text>
    <text x="220" y="240" font-size="18" fill="#212F3D" font-family="JetBrains Mono, monospace">ts_mig01.dbf</text>
    <text x="220" y="310" font-size="22" fill="#212F3D">rac1 20000행</text>
    <text x="220" y="360" font-size="24" font-weight="700" fill="#C0392B">rac2 ORA-01157</text>
    <rect x="440" y="140" width="320" height="300" rx="12" fill="#D6EAF8" stroke="#2471A3" stroke-width="3"/>
    <text x="600" y="195" font-weight="700" fill="#212F3D">② +DATA</text>
    <text x="600" y="240" font-size="18" fill="#212F3D" font-family="JetBrains Mono, monospace">ts_mig.279.…</text>
    <text x="600" y="310" font-size="22" fill="#212F3D">rac1 20000행</text>
    <text x="600" y="360" font-size="24" font-weight="700" fill="#27AE60">rac2 20000행</text>
    <rect x="820" y="140" width="320" height="300" rx="12" fill="#D6EAF8" stroke="#2471A3" stroke-width="3"/>
    <text x="980" y="195" font-weight="700" fill="#212F3D">③ +FRA</text>
    <text x="980" y="240" font-size="18" fill="#212F3D" font-family="JetBrains Mono, monospace">ts_mig.262.…</text>
    <text x="980" y="310" font-size="22" fill="#212F3D">rac1 20000행</text>
    <text x="980" y="360" font-size="24" font-weight="700" fill="#27AE60">rac2 20000행</text>
    <rect x="1200" y="140" width="340" height="300" rx="12" fill="#FDEDEC" stroke="#C0392B" stroke-width="3"/>
    <text x="1370" y="195" font-weight="700" fill="#212F3D">④ 로컬 FS 되돌림</text>
    <text x="1370" y="240" font-size="18" fill="#212F3D" font-family="JetBrains Mono, monospace">ts_mig_back.dbf</text>
    <text x="1370" y="310" font-size="22" fill="#212F3D">rac1 20000행</text>
    <text x="1370" y="360" font-size="24" font-weight="700" fill="#C0392B">rac2 ORA-01157</text>
  </g>
  <path d="M380 290 L435 290" stroke="#34495E" stroke-width="3" marker-end="url(#g)"/>
  <path d="M760 290 L815 290" stroke="#34495E" stroke-width="3" marker-end="url(#g)"/>
  <path d="M1140 290 L1195 290" stroke="#34495E" stroke-width="3" marker-end="url(#g)"/>
  <g font-size="20" fill="#5D6D7E" text-anchor="middle"><text x="408" y="470">ORA-19602</text><text x="788" y="470">RMAN-06572 · ORA-01113</text><text x="1168" y="470">RECOVER 0초</text></g>
  <rect x="60" y="520" width="1480" height="150" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <text x="800" y="580" text-anchor="middle" font-size="30" font-weight="700" fill="#212F3D">결과를 가르는 것은 디스크그룹 종류가 아니라 공유 여부</text>
  <text x="800" y="630" text-anchor="middle" font-size="24" fill="#5D6D7E">+DATA → +FRA 이동은 RAC 관점에서 차이가 없다</text>
  <rect x="60" y="710" width="1480" height="140" rx="12" fill="#fff" stroke="#5D6D7E" stroke-width="2"/>
  <text x="100" y="760" font-size="24" fill="#212F3D">• 되돌리기는 절차상 가능하지만 RAC 에서는 선택지가 아니다 (NFS · ACFS 같은 공유 FS 는 예외)</text>
  <text x="100" y="805" font-size="24" fill="#212F3D">• 정리: DROP TABLESPACE 는 현재 파일만 지운다 → 나머지 사본은 RMAN DELETE COPY</text>
</svg>
