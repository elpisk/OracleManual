<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Pretendard, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker></defs>
  <rect width="1600" height="900" fill="#fff"/>
  <text x="800" y="58" text-anchor="middle" font-size="36" font-weight="700" fill="#212F3D">진단은 아래 계층부터 — 1~16장을 한 줄로</text>
  <g font-size="22" fill="#212F3D">
    <rect x="60" y="100" width="1480" height="105" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
    <text x="90" y="145" font-size="26" font-weight="700">① Clusterware</text>
    <text x="90" y="185" fill="#5D6D7E">2 · 3 · 11장</text>
    <text x="420" y="145" font-family="JetBrains Mono, monospace">crsctl check cluster -all · crsctl stat res -t (-init)</text>
    <text x="420" y="185">스택 online, TARGET·STATE 불일치, OCR·보팅 파일</text>
    <rect x="60" y="225" width="1480" height="105" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
    <text x="90" y="270" font-size="26" font-weight="700">② 노드 멤버십</text>
    <text x="90" y="310" fill="#5D6D7E">2 · 3 · 15 · 17장</text>
    <text x="420" y="270" font-family="JetBrains Mono, monospace">olsnodes -n -s -t · oifcfg getif · HAIP -init</text>
    <text x="420" y="310">노드 Active, 인터커넥트·HAIP, 보팅 파일 과반, 인벤토리 노드 목록</text>
    <rect x="60" y="350" width="1480" height="105" rx="12" fill="#D6EAF8" stroke="#2471A3" stroke-width="3"/>
    <text x="90" y="395" font-size="26" font-weight="700" fill="#2471A3">③ 디스크그룹</text>
    <text x="90" y="435" fill="#5D6D7E">4 ~ 8 · 10장</text>
    <text x="420" y="395" font-family="JetBrains Mono, monospace">asmcmd lsdg · V$ASM_DISKGROUP · V$ASM_OPERATION</text>
    <text x="420" y="435">MOUNTED, 여유 공간·Usable, 리밸런스, 오프라인 디스크</text>
    <rect x="60" y="475" width="1480" height="105" rx="12" fill="#fff" stroke="#34495E" stroke-width="3"/>
    <text x="90" y="520" font-size="26" font-weight="700">④ 인스턴스</text>
    <text x="90" y="560" fill="#5D6D7E">1 · 9 · 10 · 14 · 16장</text>
    <text x="420" y="520" font-family="JetBrains Mono, monospace">srvctl status database -v · gv$instance · v$thread</text>
    <text x="420" y="560">Open 수, sid.parameter, 스레드·UNDO, 아카이브, 인스턴스 이름</text>
    <rect x="60" y="600" width="1480" height="105" rx="12" fill="#E9F7EF" stroke="#1E8449" stroke-width="3"/>
    <text x="90" y="645" font-size="26" font-weight="700" fill="#1E8449">⑤ 서비스 · 리스너</text>
    <text x="90" y="685" fill="#5D6D7E">1 · 12 · 13장</text>
    <text x="420" y="645" font-family="JetBrains Mono, monospace">srvctl status service · lsnrctl services · onsctl ping</text>
    <text x="420" y="685">서비스 배치, SCAN·VIP, ORA-12514/12541, FAN·TAF·AC</text>
    <rect x="60" y="725" width="1480" height="105" rx="12" fill="#FDEDEC" stroke="#C0392B" stroke-width="3"/>
    <text x="90" y="770" font-size="26" font-weight="700" fill="#C0392B">⑥ SQL</text>
    <text x="90" y="810" fill="#5D6D7E">1 · 17장</text>
    <text x="420" y="770" font-family="JetBrains Mono, monospace">gv$system_event · gv$segment_statistics</text>
    <text x="420" y="810">gc 대기(2-way·busy), 원인 세그먼트, 서비스 분리로 경합 해소</text>
  </g>
</svg>
