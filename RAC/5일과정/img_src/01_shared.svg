<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Pretendard, sans-serif">
  <rect width="1600" height="900" fill="#fff"/>
  <text x="800" y="60" text-anchor="middle" font-size="36" font-weight="700" fill="#212F3D">하나의 데이터베이스, 두 개의 인스턴스</text>
  <rect x="100" y="110" width="620" height="360" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <text x="410" y="160" text-anchor="middle" font-size="30" font-weight="700" fill="#212F3D">인스턴스 racdb1 (rac1)</text>
  <g font-size="24" fill="#212F3D"><text x="150" y="220">• SGA · 버퍼 캐시</text><text x="150" y="265">• SMON · PMON · LGWR · LMS</text><text x="150" y="310">• 사용 중인 리두: thread 1</text><text x="150" y="355">• 사용 중인 UNDO: UNDOTBS1</text><text x="150" y="400">• instance_number = 1</text></g>
  <rect x="880" y="110" width="620" height="360" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <text x="1190" y="160" text-anchor="middle" font-size="30" font-weight="700" fill="#212F3D">인스턴스 racdb2 (rac2)</text>
  <g font-size="24" fill="#212F3D"><text x="930" y="220">• SGA · 버퍼 캐시</text><text x="930" y="265">• SMON · PMON · LGWR · LMS</text><text x="930" y="310">• 사용 중인 리두: thread 2</text><text x="930" y="355">• 사용 중인 UNDO: UNDOTBS2</text><text x="930" y="400">• instance_number = 2</text></g>
  <line x1="720" y1="290" x2="880" y2="290" stroke="#B9770E" stroke-width="6"/>
  <text x="800" y="275" text-anchor="middle" font-size="22" fill="#B9770E" font-weight="700">Cache Fusion</text>
  <line x1="410" y1="470" x2="410" y2="540" stroke="#2471A3" stroke-width="4"/>
  <line x1="1190" y1="470" x2="1190" y2="540" stroke="#2471A3" stroke-width="4"/>
  <rect x="100" y="540" width="1400" height="300" rx="12" fill="#D6EAF8" stroke="#2471A3" stroke-width="3"/>
  <text x="800" y="590" text-anchor="middle" font-size="30" font-weight="700" fill="#2471A3">데이터베이스 racdb — +DATA 에 한 벌</text>
  <g font-size="24" fill="#212F3D">
    <text x="150" y="650">• 데이터 파일 · 데이터 사전</text><text x="150" y="695">• 컨트롤 파일</text><text x="150" y="740">• SPFILE (*. 와 racdb1. 접두어)</text><text x="150" y="785">• 암호 파일 · TEMP</text>
    <text x="830" y="650">• 리두 thread 1 · thread 2</text><text x="830" y="695">• UNDOTBS1 · UNDOTBS2</text>
  </g>
  <rect x="810" y="715" width="660" height="100" rx="10" fill="#fff" stroke="#C0392B" stroke-width="2"/>
  <text x="1140" y="757" text-anchor="middle" font-size="22" fill="#C0392B" font-weight="700">평소에는 자기 것만 쓰지만 파일은 공유</text>
  <text x="1140" y="792" text-anchor="middle" font-size="22" fill="#212F3D">남은 인스턴스가 죽은 쪽 리두로 복구한다</text>
</svg>
