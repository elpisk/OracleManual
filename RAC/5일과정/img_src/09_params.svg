<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Pretendard, sans-serif">
  <rect width="1600" height="900" fill="#fff"/>
  <text x="800" y="60" text-anchor="middle" font-size="36" font-weight="700" fill="#212F3D">파라미터 세 분류와 sid= 지정</text>
  <rect x="60" y="100" width="700" height="460" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <text x="410" y="145" text-anchor="middle" font-size="28" font-weight="700" fill="#212F3D">반드시 같아야</text>
  <rect x="90" y="170" width="640" height="150" rx="12" fill="#fff" stroke="#27AE60" stroke-width="3"/>
  <text x="120" y="210" font-size="23" font-weight="700" fill="#27AE60">Oracle 이 막는다 — ORA-32016</text>
  <text x="120" y="250" font-size="21" fill="#212F3D" font-family="JetBrains Mono, monospace">db_name · db_block_size</text>
  <text x="120" y="290" font-size="21" fill="#5D6D7E">생성 때 확정, 변경 자체가 불가</text>
  <rect x="90" y="340" width="640" height="200" rx="12" fill="#FDEDEC" stroke="#C0392B" stroke-width="3"/>
  <text x="120" y="380" font-size="23" font-weight="700" fill="#C0392B">막지 않는다 — System altered.</text>
  <text x="120" y="420" font-size="21" fill="#212F3D" font-family="JetBrains Mono, monospace">cluster_database · control_files</text>
  <text x="120" y="460" font-size="21" fill="#212F3D">다음 기동에서 racdb1 실패</text>
  <text x="120" y="500" font-size="21" fill="#5D6D7E">정당한 용도가 있어 도구가 판단 못 함</text>
  <rect x="820" y="100" width="720" height="210" rx="12" fill="#D6EAF8" stroke="#2471A3" stroke-width="3"/>
  <text x="1180" y="145" text-anchor="middle" font-size="28" font-weight="700" fill="#2471A3">반드시 달라야</text>
  <text x="850" y="195" font-size="21" fill="#212F3D" font-family="JetBrains Mono, monospace">instance_number · thread</text>
  <text x="850" y="230" font-size="21" fill="#212F3D" font-family="JetBrains Mono, monospace">undo_tablespace</text>
  <text x="850" y="275" font-size="22" fill="#5D6D7E">DBCA 가 인스턴스별로 넣는다 (3개씩)</text>
  <rect x="820" y="340" width="720" height="220" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <text x="1180" y="385" text-anchor="middle" font-size="28" font-weight="700" fill="#212F3D">같은 것이 권장</text>
  <text x="850" y="435" font-size="21" fill="#212F3D" font-family="JetBrains Mono, monospace">sga_target · processes · open_cursors</text>
  <text x="850" y="480" font-size="22" fill="#212F3D">sid 지정은 통과, 정상 용법</text>
  <text x="850" y="520" font-size="22" fill="#5D6D7E">접속 노드에 따라 동작이 달라진다</text>
  <rect x="60" y="600" width="1480" height="250" rx="12" fill="#fff" stroke="#5D6D7E" stroke-width="2"/>
  <text x="100" y="650" font-size="26" font-weight="700" fill="#212F3D">기준선과 되돌리기</text>
  <text x="100" y="700" font-size="22" fill="#212F3D" font-family="JetBrains Mono, monospace">V$SPPARAMETER (isspecified) : *  24 / racdb1  3 / racdb2  3</text>
  <text x="100" y="750" font-size="22" fill="#212F3D" font-family="JetBrains Mono, monospace">alter system reset cluster_database sid='racdb1' scope=spfile;</text>
  <text x="100" y="800" font-size="23" fill="#5D6D7E">RESET 은 항목을 지운다 → * 값이 다시 적용된다. 실습은 모두 scope=spfile</text>
</svg>
