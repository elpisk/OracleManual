<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Pretendard, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#34495E"/></marker>
  <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker></defs>
  <rect width="1600" height="900" fill="#fff"/>
  <text x="800" y="60" text-anchor="middle" font-size="36" font-weight="700" fill="#212F3D">두 가지 백업 — 누가 어디에 남기는가</text>
  <rect x="60" y="110" width="420" height="200" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <text x="270" y="160" text-anchor="middle" font-size="28" font-weight="700" fill="#212F3D">rac1 (root)</text>
  <text x="90" y="210" font-size="20" fill="#212F3D" font-family="JetBrains Mono, monospace">ocrconfig -manualbackup</text>
  <text x="90" y="260" font-size="20" fill="#212F3D" font-family="JetBrains Mono, monospace">ocrconfig -export</text>
  <rect x="590" y="110" width="420" height="200" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <text x="800" y="160" text-anchor="middle" font-size="28" font-weight="700" fill="#212F3D">rac2</text>
  <text x="800" y="210" text-anchor="middle" font-size="22" fill="#212F3D">OCR 마스터 노드</text>
  <text x="800" y="255" text-anchor="middle" font-size="22" fill="#212F3D">물리 백업을 실제로 수행</text>
  <path d="M480 190 L585 190" stroke="#34495E" stroke-width="3" marker-end="url(#a)"/>
  <text x="532" y="176" text-anchor="middle" font-size="20" fill="#5D6D7E">요청</text>
  <rect x="1120" y="110" width="420" height="200" rx="12" fill="#D6EAF8" stroke="#2471A3" stroke-width="3"/>
  <text x="1330" y="160" text-anchor="middle" font-size="28" font-weight="700" fill="#2471A3">+CRS/OCRBACKUP</text>
  <text x="1330" y="210" text-anchor="middle" font-size="22" fill="#212F3D">backup_날짜_시각.ocr</text>
  <text x="1330" y="255" text-anchor="middle" font-size="22" fill="#212F3D">MIRROR · 수백 MB</text>
  <path d="M1010 210 L1115 210" stroke="#34495E" stroke-width="3" marker-end="url(#a)"/>
  <rect x="60" y="380" width="420" height="160" rx="12" fill="#fff" stroke="#34495E" stroke-width="3"/>
  <text x="270" y="430" text-anchor="middle" font-size="26" font-weight="700" fill="#212F3D">/root/ocr_ch5.dmp</text>
  <text x="270" y="475" text-anchor="middle" font-size="22" fill="#212F3D">export 결과 · 수백 KB</text>
  <text x="270" y="512" text-anchor="middle" font-size="22" fill="#212F3D">클러스터 밖으로 복사</text>
  <path d="M270 310 L270 375" stroke="#34495E" stroke-width="3" marker-end="url(#a)"/>
  <rect x="590" y="380" width="950" height="160" rx="12" fill="#FDEDEC" stroke="#C0392B" stroke-width="3"/>
  <text x="620" y="430" font-size="24" font-weight="700" fill="#C0392B">-backuploc /u01/app/grid/ocrbackup → PROT-42</text>
  <text x="620" y="475" font-size="22" fill="#212F3D">노드 로컬 디스크는 그 노드와 함께 사라진다</text>
  <text x="620" y="512" font-size="22" fill="#212F3D">물리 백업 위치는 ASM 또는 공유 파일 시스템만</text>
  <rect x="60" y="600" width="1480" height="250" rx="12" fill="#fff" stroke="#5D6D7E" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="100" y="650" font-size="26" font-weight="700" fill="#212F3D">자동 백업과 OLR</text>
  <text x="100" y="700" font-size="22" fill="#212F3D">• OCR 자동 백업: crsd 연속 가동 4시간마다 · crsd 재시작 때 타이머 초기화</text>
  <text x="100" y="745" font-size="22" fill="#212F3D">• 설치 직후 -showbackup → PROT-24(자동 없음) · PROT-25(수동 없음)</text>
  <text x="100" y="790" font-size="22" fill="#212F3D">• OLR 백업: 설치·구성 변경 시점, crsdata/노드/olr 아래, 그 노드에서만 보인다</text>
  <text x="100" y="830" font-size="22" fill="#5D6D7E">되살리기: -restore (물리) · -import (논리) · -local -restore (OLR)</text>
</svg>
