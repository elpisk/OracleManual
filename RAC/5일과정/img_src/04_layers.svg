<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Pretendard, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#34495E"/></marker></defs>
  <rect width="1600" height="900" fill="#fff"/>
  <text x="800" y="60" text-anchor="middle" font-size="36" font-weight="700" fill="#212F3D">디스크그룹 TEST — 두 계층의 상태</text>
  <text x="430" y="120" text-anchor="middle" font-size="28" font-weight="700" fill="#C0392B">SQL 로 마운트</text>
  <text x="1170" y="120" text-anchor="middle" font-size="28" font-weight="700" fill="#27AE60">srvctl start diskgroup</text>
  <rect x="60" y="150" width="740" height="250" rx="12" fill="#D6EAF8" stroke="#2471A3" stroke-width="3"/>
  <text x="90" y="200" font-size="26" font-weight="700" fill="#2471A3">ASM 계층 (V$ASM_DISKGROUP)</text>
  <text x="90" y="250" font-size="22" fill="#212F3D">rac1: create → MOUNTED</text>
  <text x="90" y="295" font-size="22" fill="#212F3D">rac2: DISMOUNTED → alter diskgroup TEST mount</text>
  <text x="90" y="340" font-size="22" fill="#212F3D">두 노드 MOUNTED</text>
  <rect x="60" y="440" width="740" height="250" rx="12" fill="#FDEDEC" stroke="#C0392B" stroke-width="3"/>
  <text x="90" y="490" font-size="26" font-weight="700" fill="#C0392B">Clusterware 계층 (ora.TEST.dg)</text>
  <text x="90" y="540" font-size="22" fill="#212F3D">자원은 자동 생성, TARGET · STATE OFFLINE</text>
  <text x="90" y="585" font-size="22" fill="#212F3D">srvctl status: Disk Group TEST is not running</text>
  <text x="90" y="630" font-size="22" fill="#C0392B" font-weight="700">재기동 때 올라오지 않는다</text>
  <rect x="840" y="150" width="700" height="250" rx="12" fill="#D6EAF8" stroke="#2471A3" stroke-width="3"/>
  <text x="870" y="200" font-size="26" font-weight="700" fill="#2471A3">ASM 계층</text>
  <text x="870" y="250" font-size="22" fill="#212F3D">에이전트가 두 노드에서 마운트</text>
  <text x="870" y="295" font-size="22" fill="#212F3D">rac1 MOUNTED · rac2 MOUNTED</text>
  <rect x="840" y="440" width="700" height="250" rx="12" fill="#ECF0F1" stroke="#27AE60" stroke-width="3"/>
  <text x="870" y="490" font-size="26" font-weight="700" fill="#27AE60">Clusterware 계층</text>
  <text x="870" y="540" font-size="22" fill="#212F3D">TARGET · STATE ONLINE (rac1, rac2)</text>
  <text x="870" y="585" font-size="22" fill="#212F3D">3번 행 OFFLINE: asmgroup 카디널리티 3</text>
  <text x="870" y="630" font-size="22" fill="#212F3D">Disk Group TEST is running on rac1,rac2</text>
  <path d="M1190 440 L1190 405" stroke="#34495E" stroke-width="3" marker-end="url(#a)"/>
  <rect x="60" y="730" width="1480" height="120" rx="12" fill="#fff" stroke="#5D6D7E" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="100" y="780" font-size="24" fill="#212F3D">생성 · 삭제는 Clusterware 로 전파되고, 마운트 · 언마운트는 전파되지 않는다</text>
  <text x="100" y="822" font-size="22" fill="#5D6D7E">없는 이름: PRCA-1000 (ASM) + PRCR-1001 (Clusterware)</text>
</svg>
