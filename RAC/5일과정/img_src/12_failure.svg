<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Pretendard, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#34495E"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker></defs>
  <rect width="1600" height="900" fill="#fff"/>
  <text x="800" y="58" text-anchor="middle" font-size="36" font-weight="700" fill="#212F3D">같은 서비스, 다른 운명</text>
  <rect x="80" y="100" width="680" height="80" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <text x="420" y="152" text-anchor="middle" font-size="28" font-weight="700" fill="#212F3D">계획된 정지 (-force)</text>
  <rect x="840" y="100" width="680" height="80" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <text x="1180" y="152" text-anchor="middle" font-size="28" font-weight="700" fill="#212F3D">실제 장애 (PMON 강제 종료)</text>
  <rect x="80" y="220" width="680" height="100" rx="12" fill="#fff" stroke="#34495E" stroke-width="3"/>
  <text x="110" y="263" font-size="22" fill="#2471A3" font-family="JetBrains Mono, monospace">srvctl stop instance … -force</text>
  <text x="110" y="300" font-size="22" fill="#212F3D">정상 정지 → 서비스 TARGET 도 OFFLINE</text>
  <rect x="80" y="360" width="680" height="100" rx="12" fill="#fff" stroke="#C0392B" stroke-width="3"/>
  <text x="110" y="403" font-size="24" font-weight="700" fill="#C0392B">ch15_oltp is not running</text>
  <text x="110" y="440" font-size="22" fill="#212F3D">가용 인스턴스가 있어도 옮겨 가지 않음</text>
  <rect x="80" y="500" width="680" height="100" rx="12" fill="#fff" stroke="#C0392B" stroke-width="3"/>
  <text x="110" y="543" font-size="24" font-weight="700" fill="#C0392B">새 접속 ORA-12514</text>
  <text x="110" y="580" font-size="22" fill="#212F3D">rac2 는 살아 있는데 받을 서비스가 없음</text>
  <rect x="840" y="220" width="680" height="100" rx="12" fill="#fff" stroke="#34495E" stroke-width="3"/>
  <text x="870" y="263" font-size="22" fill="#2471A3" font-family="JetBrains Mono, monospace">pkill -9 -f ora_pmon_racdb1</text>
  <text x="870" y="300" font-size="22" fill="#212F3D">비정상 종료 → TARGET ONLINE 유지</text>
  <rect x="840" y="360" width="680" height="100" rx="12" fill="#fff" stroke="#27AE60" stroke-width="3"/>
  <text x="870" y="403" font-size="24" font-weight="700" fill="#27AE60">10초 안에 racdb2 로 이동</text>
  <text x="870" y="440" font-size="22" fill="#212F3D">가용 인스턴스 지정의 효과</text>
  <rect x="840" y="500" width="680" height="100" rx="12" fill="#fff" stroke="#B9770E" stroke-width="3"/>
  <text x="870" y="543" font-size="24" font-weight="700" fill="#B9770E">racdb1 47초 뒤 복구</text>
  <text x="870" y="580" font-size="22" fill="#212F3D">서비스는 racdb2 에 남음, 복귀는 관리자가</text>
  <line x1="420" y1="320" x2="420" y2="356" stroke="#34495E" stroke-width="3" marker-end="url(#a)"/>
  <line x1="420" y1="460" x2="420" y2="496" stroke="#34495E" stroke-width="3" marker-end="url(#a)"/>
  <line x1="1180" y1="320" x2="1180" y2="356" stroke="#34495E" stroke-width="3" marker-end="url(#a)"/>
  <line x1="1180" y1="460" x2="1180" y2="496" stroke="#34495E" stroke-width="3" marker-end="url(#a)"/>
  <rect x="80" y="660" width="1440" height="190" rx="12" fill="#E9F7EF" stroke="#1E8449" stroke-width="3"/>
  <text x="110" y="710" font-size="26" font-weight="700" fill="#1E8449">올바른 계획 정지 순서</text>
  <text x="110" y="760" font-size="24" fill="#212F3D">① relocate service 로 서비스를 먼저 옮김  ② 기존 세션이 빠질 시간  ③ stop instance (force 불필요)</text>
  <text x="110" y="810" font-size="24" fill="#212F3D">④ 작업 후 start instance  ⑤ relocate service 로 선호 인스턴스에 되돌림</text>
</svg>
