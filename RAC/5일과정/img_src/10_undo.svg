  <text x="880" y="682" text-anchor="middle" font-size="26" font-weight="700" fill="#C0392B">UNDOTBS9 — 존재하지 않음</text>
  <text x="880" y="722" text-anchor="middle" font-size="24" fill="#C0392B">ORA-30012</text>
  <text x="120" y="810" font-size="24" fill="#212F3D"><tspan font-weight="700">같게 둔다</tspan>  undo_management=AUTO, undo_retention=900</text>
  <text x="120" y="855" font-size="24" fill="#212F3D"><tspan font-weight="700">다르게 둔다</tspan>  undo_tablespace (SPFILE 의 sid 접두어 항목)</text>
