  <text x="330" y="150" text-anchor="middle" font-size="30" font-weight="700" fill="#212F3D">racdb1</text>
  <text x="330" y="192" text-anchor="middle" font-size="22" fill="#5D6D7E" font-family="JetBrains Mono, monospace">undo_tablespace=UNDOTBS1</text>
  <rect x="1060" y="100" width="420" height="120" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <text x="1270" y="150" text-anchor="middle" font-size="30" font-weight="700" fill="#212F3D">racdb2</text>
  <text x="1270" y="192" text-anchor="middle" font-size="22" fill="#5D6D7E" font-family="JetBrains Mono, monospace">undo_tablespace=UNDOTBS2</text>
  <rect x="120" y="420" width="420" height="150" rx="12" fill="#D6EAF8" stroke="#2471A3" stroke-width="3"/>
  <text x="330" y="475" text-anchor="middle" font-size="28" font-weight="700" fill="#2471A3">UNDOTBS1</text>
  <text x="330" y="520" text-anchor="middle" font-size="22" fill="#212F3D">롤백 세그먼트 10개</text>
  <rect x="1060" y="420" width="420" height="150" rx="12" fill="#D6EAF8" stroke="#2471A3" stroke-width="3"/>
  <text x="1270" y="475" text-anchor="middle" font-size="28" font-weight="700" fill="#2471A3">UNDOTBS2</text>
  <text x="1270" y="520" text-anchor="middle" font-size="22" fill="#212F3D">롤백 세그먼트 10개</text>
  <line x1="330" y1="220" x2="330" y2="415" stroke="#34495E" stroke-width="4" marker-end="url(#a)"/>
  <line x1="1270" y1="220" x2="1270" y2="415" stroke="#34495E" stroke-width="4" marker-end="url(#a)"/>
  <line x1="540" y1="200" x2="1055" y2="440" stroke="#C0392B" stroke-width="3" stroke-dasharray="10 6" marker-end="url(#r)"/>
  <text x="820" y="280" text-anchor="middle" font-size="24" font-weight="700" fill="#C0392B">ORA-30013 사용 중</text>
  <line x1="520" y1="220" x2="640" y2="630" stroke="#C0392B" stroke-width="3" stroke-dasharray="10 6" marker-end="url(#r)"/>
