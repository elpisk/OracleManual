<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Pretendard, sans-serif">
  <rect width="1600" height="900" fill="#fff"/>
  <text x="800" y="60" text-anchor="middle" font-size="36" font-weight="700" fill="#212F3D">srvctl config database -d racdb — 줄마다 뜻이 있다</text>
  <rect x="60" y="100" width="760" height="760" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <g font-size="21" fill="#212F3D" font-family="JetBrains Mono, monospace">
    <text x="90" y="150">Database unique name: racdb</text>
    <text x="90" y="200">Oracle home: …/19.3.0/dbhome_rac</text>
    <text x="90" y="250">Spfile: +DATA/RACDB/PARAMETERFILE/…</text>
    <text x="90" y="295">Password file: +DATA/RACDB/PASSWORD/…</text>
    <text x="90" y="355">Start options: open</text>
    <text x="90" y="395">Stop options: immediate</text>
    <text x="90" y="455">Management policy: AUTOMATIC</text>
    <text x="90" y="515">Disk Groups: DATA,FRA</text>
    <text x="90" y="575">Type: RAC</text>
    <text x="90" y="635">Database instances: racdb1,racdb2</text>
    <text x="90" y="675">Configured nodes: rac1,rac2</text>
    <text x="90" y="735">Database is administrator managed</text>
  </g>
  <text x="440" y="820" text-anchor="middle" font-size="22" fill="#5D6D7E">Clusterware(OCR)에 저장 — DB 가 내려가 있어도 남는다</text>
  <g font-size="23">
    <rect x="880" y="225" width="660" height="85" rx="12" fill="#D6EAF8" stroke="#2471A3" stroke-width="3"/>
    <text x="910" y="262" fill="#2471A3" font-weight="700">파일 위치</text><text x="910" y="295" font-size="21" fill="#212F3D">인스턴스를 띄우는 주체가 Clusterware 라서 여기 기록 (8장)</text>
    <rect x="880" y="330" width="660" height="85" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
    <text x="910" y="367" fill="#212F3D" font-weight="700">옵션 없는 srvctl 의 기본 동작</text><text x="910" y="400" font-size="21" fill="#212F3D">stop database = shutdown immediate</text>
    <rect x="880" y="430" width="660" height="70" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
    <text x="910" y="475" font-size="22" fill="#212F3D"><tspan font-weight="700">부팅 때 자동 기동</tspan> (MANUAL 이면 사람이 올림)</text>
    <rect x="880" y="490" width="0" height="0"/>
    <rect x="880" y="515" width="660" height="70" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
    <text x="910" y="560" font-size="22" fill="#212F3D"><tspan font-weight="700">시작 의존성</tspan> — 마운트되어야 인스턴스가 뜬다</text>
    <rect x="880" y="605" width="660" height="150" rx="12" fill="#fff" stroke="#C0392B" stroke-width="3"/>
    <text x="910" y="645" fill="#C0392B" font-weight="700">고정 배치 (관리자 관리형)</text>
    <text x="910" y="685" font-size="22" fill="#212F3D">racdb1 → rac1 · racdb2 → rac2</text>
    <text x="910" y="725" font-size="21" fill="#5D6D7E">노드를 추가하면 인스턴스도 직접 추가 (15장)</text>
  </g>
  <g stroke="#5D6D7E" stroke-width="2" stroke-dasharray="6 5">
    <line x1="700" y1="270" x2="875" y2="268"/><line x1="560" y1="375" x2="875" y2="372"/><line x1="560" y1="450" x2="875" y2="465"/><line x1="460" y1="510" x2="875" y2="550"/><line x1="660" y1="655" x2="875" y2="670"/>
  </g>
</svg>
