<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Pretendard, sans-serif">
  <rect width="1600" height="900" fill="#fff"/>
  <text x="800" y="58" text-anchor="middle" font-size="36" font-weight="700" fill="#212F3D">racdb2 가 죽은 20초 뒤 — 점검 스크립트의 계층별 흔적</text>
  <g font-size="23" fill="#212F3D">
    <rect x="60" y="100" width="420" height="100" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
    <text x="270" y="160" text-anchor="middle" font-weight="700">1 클러스터 (11장)</text>
    <rect x="520" y="100" width="1020" height="100" rx="12" fill="#FEF5E7" stroke="#B9770E" stroke-width="3"/>
    <text x="550" y="140">[WARN] 불일치 목록에 ora.racdb.db 추가</text>
    <text x="550" y="178" fill="#5D6D7E" font-size="22">TARGET ONLINE · STATE OFFLINE 칸이 생겼다</text>
    <rect x="60" y="220" width="420" height="100" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
    <text x="270" y="280" text-anchor="middle" font-weight="700">2 알림 · 3 서비스</text>
    <rect x="520" y="220" width="1020" height="100" rx="12" fill="#fff" stroke="#5D6D7E" stroke-width="2"/>
    <text x="550" y="280">[ OK ] ONS 응답 — 이 계층에는 흔적이 없다</text>
    <rect x="60" y="340" width="420" height="100" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
    <text x="270" y="400" text-anchor="middle" font-weight="700">4 인스턴스 (9장)</text>
    <rect x="520" y="340" width="1020" height="100" rx="12" fill="#FDEDEC" stroke="#C0392B" stroke-width="3"/>
    <text x="550" y="400" fill="#C0392B" font-weight="700">[FAIL] Open 인스턴스 1 개 — 스크립트가 잡은 유일한 FAIL</text>
    <rect x="60" y="460" width="420" height="100" rx="12" fill="#D6EAF8" stroke="#2471A3" stroke-width="3"/>
    <text x="270" y="520" text-anchor="middle" font-weight="700">5 스토리지 (10장)</text>
    <rect x="520" y="460" width="1020" height="100" rx="12" fill="#fff" stroke="#C0392B" stroke-width="2" stroke-dasharray="10 6"/>
    <text x="550" y="500">thread 2 current 행이 조용히 사라짐</text>
    <text x="550" y="538" fill="#5D6D7E" font-size="22">group by 결과에서 빠져 FAIL 로 잡히지 않는다</text>
    <rect x="60" y="580" width="420" height="100" rx="12" fill="#D6EAF8" stroke="#2471A3" stroke-width="3"/>
    <text x="270" y="640" text-anchor="middle" font-weight="700">6 백업 (14장)</text>
    <rect x="520" y="580" width="1020" height="100" rx="12" fill="#fff" stroke="#C0392B" stroke-width="2" stroke-dasharray="10 6"/>
    <text x="550" y="620">inst 2 dest1 행이 사라짐</text>
    <text x="550" y="658" fill="#5D6D7E" font-size="22">이 계층만 보면 아카이브 설정 문제로 오진한다</text>
  </g>
  <rect x="60" y="710" width="1480" height="140" rx="12" fill="#E9F7EF" stroke="#27AE60" stroke-width="3"/>
  <g font-size="23" fill="#212F3D">
    <text x="100" y="755">• 약 100초 뒤 CRS 가 racdb2 를 자동 재기동 → 실패 0 건</text>
    <text x="100" y="795">• 한 시간 안에 두 번이면 RESTART_ATTEMPTS=2 소진 → CRS-2771, 사람이 srvctl 로 올린다</text>
    <text x="100" y="835" fill="#5D6D7E">• 원칙: "있어야 할 것의 목록"(V$THREAD, GV$INSTANCE)을 기준으로 조회한다</text>
  </g>
</svg>
