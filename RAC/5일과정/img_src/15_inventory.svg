<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Pretendard, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker></defs>
  <rect width="1600" height="900" fill="#fff"/>
  <text x="800" y="58" text-anchor="middle" font-size="36" font-weight="700" fill="#212F3D">홈 하나를 지우는 세 박자 — 인벤토리 노드 목록</text>
  <g font-size="22" fill="#212F3D">
    <rect x="60" y="120" width="460" height="330" rx="12" fill="#FDEDEC" stroke="#C0392B" stroke-width="3"/>
    <text x="290" y="170" text-anchor="middle" font-size="28" font-weight="700" fill="#C0392B">① 지울 노드(rac2)</text>
    <text x="290" y="225" text-anchor="middle" font-family="JetBrains Mono, monospace">-updateNodeList</text>
    <text x="290" y="260" text-anchor="middle" font-family="JetBrains Mono, monospace">"CLUSTER_NODES={rac2}"</text>
    <text x="290" y="295" text-anchor="middle" font-family="JetBrains Mono, monospace">-local</text>
    <text x="290" y="355" text-anchor="middle">자기 인벤토리만 고친다</text>
    <text x="290" y="395" text-anchor="middle" fill="#5D6D7E">목록: rac2</text>
    <rect x="570" y="120" width="460" height="330" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
    <text x="800" y="170" text-anchor="middle" font-size="28" font-weight="700">② deinstall (rac2)</text>
    <text x="800" y="225" text-anchor="middle" font-family="JetBrains Mono, monospace">deinstall -local</text>
    <text x="800" y="260" text-anchor="middle" font-family="JetBrains Mono, monospace">-checkonly → -silent</text>
    <text x="800" y="320" text-anchor="middle">"will be performed are:rac2"</text>
    <text x="800" y="355" text-anchor="middle">에 rac1 이 보이면 멈춘다</text>
    <text x="800" y="395" text-anchor="middle" fill="#5D6D7E">응답 파일로 범위 확인</text>
    <rect x="1080" y="120" width="460" height="330" rx="12" fill="#E9F7EF" stroke="#27AE60" stroke-width="3"/>
    <text x="1310" y="170" text-anchor="middle" font-size="28" font-weight="700" fill="#27AE60">③ 남는 노드(rac1)</text>
    <text x="1310" y="225" text-anchor="middle" font-family="JetBrains Mono, monospace">-updateNodeList</text>
    <text x="1310" y="260" text-anchor="middle" font-family="JetBrains Mono, monospace">"CLUSTER_NODES={rac1}"</text>
    <text x="1310" y="295" text-anchor="middle" fill="#C0392B" font-weight="700">-local 없이</text>
    <text x="1310" y="355" text-anchor="middle">남은 노드를 선언한다</text>
    <text x="1310" y="395" text-anchor="middle" fill="#5D6D7E">목록: rac1</text>
  </g>
  <g stroke="#C0392B" stroke-width="4"><line x1="520" y1="285" x2="565" y2="285" marker-end="url(#a)"/><line x1="1030" y1="285" x2="1075" y2="285" marker-end="url(#a)"/></g>
  <rect x="60" y="510" width="1480" height="320" rx="12" fill="#fff" stroke="#5D6D7E" stroke-width="2"/>
  <text x="100" y="560" font-size="26" font-weight="700" fill="#212F3D">지키는 규칙</text>
  <g font-size="24" fill="#212F3D">
    <text x="100" y="615">• 홈 소유자로 실행한다 — 그리드 홈은 grid, DB 홈은 oracle</text>
    <text x="100" y="665">• CRS=TRUE 는 그리드 홈에만 붙인다</text>
    <text x="100" y="715">• ① 에서 -local 을 빼면 rac1 의 목록까지 rac2 하나로 바뀐다</text>
    <text x="100" y="765">• 단계마다 두 노드의 inventory.xml 을 직접 연다 — 성공 메시지로 판단하지 않는다</text>
  </g>
</svg>
