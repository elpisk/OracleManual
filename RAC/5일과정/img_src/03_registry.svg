<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Pretendard, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#34495E"/></marker></defs>
  <rect width="1600" height="900" fill="#fff"/>
  <text x="800" y="60" text-anchor="middle" font-size="36" font-weight="700" fill="#212F3D">OCR 과 OLR — 어디에 있고 누가 읽는가</text>
  <rect x="60" y="100" width="680" height="440" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <text x="400" y="145" text-anchor="middle" font-size="28" font-weight="700" fill="#212F3D">rac1 로컬 디스크</text>
  <rect x="100" y="175" width="600" height="120" rx="12" fill="#fff" stroke="#34495E" stroke-width="3"/>
  <text x="130" y="220" font-size="24" font-weight="700" fill="#212F3D">부트스트랩 파일 /etc/oracle/</text>
  <text x="130" y="262" font-size="21" fill="#212F3D" font-family="JetBrains Mono, monospace">ocr.loc · olr.loc</text>
  <rect x="100" y="330" width="600" height="180" rx="12" fill="#D6EAF8" stroke="#2471A3" stroke-width="3"/>
  <text x="130" y="375" font-size="26" font-weight="700" fill="#2471A3">OLR — 노드마다 1벌</text>
  <text x="130" y="415" font-size="20" fill="#212F3D" font-family="JetBrains Mono, monospace">crsdata/rac1/olr/rac1_19.olr</text>
  <text x="130" y="455" font-size="22" fill="#212F3D">읽는 주체 ohasd · ocrcheck -local</text>
  <text x="130" y="490" font-size="22" fill="#212F3D">백업: 설치·구성 변경 시점, 노드 로컬</text>
  <rect x="860" y="100" width="680" height="440" rx="12" fill="#D6EAF8" stroke="#2471A3" stroke-width="3"/>
  <text x="1200" y="145" text-anchor="middle" font-size="28" font-weight="700" fill="#2471A3">공유 디스크그룹 +CRS (Normal)</text>
  <rect x="900" y="175" width="600" height="180" rx="12" fill="#fff" stroke="#2471A3" stroke-width="3"/>
  <text x="930" y="220" font-size="26" font-weight="700" fill="#2471A3">OCR — 클러스터 1벌</text>
  <text x="930" y="260" font-size="20" fill="#212F3D" font-family="JetBrains Mono, monospace">+CRS/rac-cluster/OCRFILE/</text>
  <text x="930" y="300" font-size="22" fill="#212F3D">읽는 주체 crsd · ocrcheck</text>
  <text x="930" y="335" font-size="22" fill="#212F3D">ID 665666554 (두 노드 같음)</text>
  <rect x="900" y="380" width="600" height="130" rx="12" fill="#fff" stroke="#2471A3" stroke-width="3"/>
  <text x="930" y="425" font-size="24" font-weight="700" fill="#2471A3">OCRBACKUP · Voting File</text>
  <text x="930" y="465" font-size="22" fill="#212F3D">백업은 ASM 파일, Voting File 은 디스크에 직접</text>
  <path d="M700 235 L895 235" stroke="#34495E" stroke-width="3" marker-end="url(#a)"/>
  <text x="798" y="222" text-anchor="middle" font-size="22" fill="#5D6D7E">위치</text>
  <rect x="60" y="590" width="1480" height="260" rx="12" fill="#fff" stroke="#5D6D7E" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="100" y="640" font-size="26" font-weight="700" fill="#212F3D">부팅 순서가 위치를 정했다</text>
  <text x="100" y="690" font-size="22" fill="#212F3D">1. ohasd 는 로컬 OLR 만으로 일어선다 — ASM 을 어떻게 띄울지가 여기 있다</text>
  <text x="100" y="735" font-size="22" fill="#212F3D">2. ocssd 는 디스크 헤더 정보로 Voting File 을 직접 읽어 멤버십을 정한다</text>
  <text x="100" y="780" font-size="22" fill="#212F3D">3. ASM 이 +CRS 를 마운트하면 crsd 가 OCR 을 읽고 운영 자원을 올린다</text>
  <text x="100" y="825" font-size="22" fill="#5D6D7E">조회는 grid 도 되지만 변경(백업 · export · add · delete)은 root 만 — PROT-20</text>
</svg>
