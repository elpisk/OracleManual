<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Pretendard, sans-serif">
  <rect width="1600" height="900" fill="#fff"/>
  <text x="800" y="60" text-anchor="middle" font-size="36" font-weight="700" fill="#212F3D">자주 쓰는 다섯 뷰 — 뷰보다 질문에서 출발한다</text>
  <g font-size="22" fill="#5D6D7E" font-weight="700"><text x="120" y="120">뷰 (한 행의 단위)</text><text x="760" y="120">답하는 질문</text><text x="1260" y="120">asmcmd</text></g>
  <g>
    <rect x="100" y="140" width="1400" height="105" rx="12" fill="#D6EAF8" stroke="#2471A3" stroke-width="3"/>
    <text x="130" y="188" font-size="26" font-weight="700" fill="#2471A3" font-family="JetBrains Mono, monospace">V$ASM_DISKGROUP</text><text x="130" y="225" font-size="22" fill="#212F3D">디스크그룹 1개</text>
    <text x="760" y="203" font-size="25" fill="#212F3D">공간이 얼마나 남았나, 마운트됐나</text><text x="1260" y="203" font-size="24" fill="#212F3D" font-family="JetBrains Mono, monospace">lsdg</text>
    <rect x="100" y="260" width="1400" height="105" rx="12" fill="#D6EAF8" stroke="#2471A3" stroke-width="3"/>
    <text x="130" y="308" font-size="26" font-weight="700" fill="#2471A3" font-family="JetBrains Mono, monospace">V$ASM_DISK</text><text x="130" y="345" font-size="22" fill="#212F3D">디스크 1장</text>
    <text x="760" y="323" font-size="25" fill="#212F3D">어떤 디스크가 어디에, 헤더 상태는</text><text x="1260" y="323" font-size="24" fill="#212F3D" font-family="JetBrains Mono, monospace">lsdsk -k</text>
    <rect x="100" y="380" width="1400" height="105" rx="12" fill="#D6EAF8" stroke="#2471A3" stroke-width="3"/>
    <text x="130" y="428" font-size="26" font-weight="700" fill="#2471A3" font-family="JetBrains Mono, monospace">V$ASM_FILE</text><text x="130" y="465" font-size="22" fill="#212F3D">ASM 파일 1개</text>
    <text x="760" y="443" font-size="25" fill="#212F3D">무엇이 얼마나 들어 있나</text><text x="1260" y="443" font-size="24" fill="#212F3D" font-family="JetBrains Mono, monospace">ls · du</text>
    <rect x="100" y="500" width="1400" height="105" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
    <text x="130" y="548" font-size="26" font-weight="700" fill="#34495E" font-family="JetBrains Mono, monospace">V$ASM_CLIENT</text><text x="130" y="585" font-size="22" fill="#212F3D">클라이언트 1개 · 인스턴스마다 다름</text>
    <text x="760" y="563" font-size="25" fill="#212F3D">누가 이 ASM 을 쓰고 있나 (GV$ 로)</text><text x="1260" y="563" font-size="24" fill="#212F3D" font-family="JetBrains Mono, monospace">lsct</text>
    <rect x="100" y="620" width="1400" height="105" rx="12" fill="#FDEDEC" stroke="#C0392B" stroke-width="3"/>
    <text x="130" y="668" font-size="26" font-weight="700" fill="#C0392B" font-family="JetBrains Mono, monospace">V$ASM_OPERATION</text><text x="130" y="705" font-size="22" fill="#212F3D">진행 중 작업 1개</text>
    <text x="760" y="683" font-size="25" fill="#212F3D">지금 무슨 작업이 도나 (0행 = 없음)</text><text x="1260" y="683" font-size="24" fill="#212F3D" font-family="JetBrains Mono, monospace">lsdg Rebal</text>
  </g>
  <text x="100" y="790" font-size="24" fill="#212F3D">보조: V$ASM_ATTRIBUTE (속성) · V$ASM_TEMPLATE (템플릿) · V$ASM_ALIAS (별칭·디렉터리)</text>
  <text x="100" y="835" font-size="23" fill="#5D6D7E">AUDIT · SPARSE · FILEGROUP · VOLUME 계열은 해당 기능을 써야 행이 생긴다 — 이 랩에서는 0행</text>
</svg>
