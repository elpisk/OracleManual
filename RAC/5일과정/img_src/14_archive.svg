<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Pretendard, sans-serif">
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2471A3"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#fff"/>
  <text x="800" y="58" text-anchor="middle" font-size="36" font-weight="700" fill="#212F3D">아카이브는 모든 노드가 읽는 곳에 둔다</text>
  <!-- left panel -->
  <text x="400" y="120" text-anchor="middle" font-size="28" font-weight="700" fill="#27AE60">공유 +FRA — 정상 구성</text>
  <rect x="60" y="150" width="280" height="130" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <text x="200" y="200" text-anchor="middle" font-size="28" font-weight="700" fill="#212F3D">rac1</text>
  <text x="200" y="245" text-anchor="middle" font-size="24" fill="#5D6D7E">racdb1 · thread 1</text>
  <rect x="460" y="150" width="280" height="130" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <text x="600" y="200" text-anchor="middle" font-size="28" font-weight="700" fill="#212F3D">rac2</text>
  <text x="600" y="245" text-anchor="middle" font-size="24" fill="#5D6D7E">racdb2 · thread 2</text>
  <rect x="60" y="400" width="680" height="230" rx="12" fill="#D6EAF8" stroke="#2471A3" stroke-width="3"/>
  <text x="400" y="450" text-anchor="middle" font-size="28" font-weight="700" fill="#2471A3">+FRA/RACDB/ARCHIVELOG</text>
  <g font-size="22" fill="#212F3D" font-family="JetBrains Mono, monospace">
    <text x="110" y="505">thread_1_seq_18.265...</text>
    <text x="110" y="545">thread_1_seq_19.264...</text>
    <text x="420" y="505">thread_2_seq_13.261...</text>
    <text x="420" y="545">thread_2_seq_14.262...</text>
  </g>
  <text x="400" y="600" text-anchor="middle" font-size="22" fill="#5D6D7E">%t 로 스레드를 구분한다</text>
  <line x1="200" y1="280" x2="200" y2="395" stroke="#2471A3" stroke-width="4" marker-end="url(#g)"/>
  <line x1="600" y1="280" x2="600" y2="395" stroke="#2471A3" stroke-width="4" marker-end="url(#g)"/>
  <text x="400" y="345" text-anchor="middle" font-size="22" fill="#2471A3">각자 자기 스레드를 쓴다</text>
  <rect x="60" y="680" width="680" height="150" rx="12" fill="#fff" stroke="#27AE60" stroke-width="3"/>
  <text x="400" y="730" text-anchor="middle" font-size="24" fill="#212F3D">어느 노드에서 백업·복구해도</text>
  <text x="400" y="775" text-anchor="middle" font-size="24" fill="#212F3D">두 스레드의 아카이브가 모두 보인다</text>
  <!-- divider -->
  <line x1="800" y1="100" x2="800" y2="850" stroke="#5D6D7E" stroke-width="2" stroke-dasharray="8 8"/>
  <!-- right panel -->
  <text x="1200" y="120" text-anchor="middle" font-size="28" font-weight="700" fill="#C0392B">rac1 로컬 경로 — 잘못된 구성</text>
  <rect x="860" y="150" width="320" height="300" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <text x="1020" y="200" text-anchor="middle" font-size="28" font-weight="700" fill="#212F3D">rac1</text>
  <text x="1020" y="240" text-anchor="middle" font-size="24" fill="#5D6D7E">racdb1 · thread 1</text>
  <rect x="885" y="290" width="270" height="130" rx="10" fill="#FDEDEC" stroke="#C0392B" stroke-width="3"/>
  <text x="1020" y="335" text-anchor="middle" font-size="22" fill="#212F3D">로컬 디스크</text>
  <text x="1020" y="370" text-anchor="middle" font-size="22" fill="#212F3D" font-family="JetBrains Mono, monospace">arch_local/</text>
  <text x="1020" y="403" text-anchor="middle" font-size="22" fill="#212F3D" font-family="JetBrains Mono, monospace">1_23_...dbf</text>
  <rect x="1240" y="150" width="300" height="300" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <text x="1390" y="200" text-anchor="middle" font-size="28" font-weight="700" fill="#212F3D">rac2</text>
  <text x="1390" y="240" text-anchor="middle" font-size="24" fill="#5D6D7E">RMAN 백업 실행</text>
  <text x="1390" y="300" text-anchor="middle" font-size="22" fill="#C0392B" font-family="JetBrains Mono, monospace">crosscheck</text>
  <text x="1390" y="335" text-anchor="middle" font-size="22" fill="#C0392B" font-family="JetBrains Mono, monospace">validation</text>
  <text x="1390" y="370" text-anchor="middle" font-size="22" fill="#C0392B" font-family="JetBrains Mono, monospace">failed × 3</text>
  <path d="M1240 360 L1160 360" stroke="#C0392B" stroke-width="4" stroke-dasharray="10 6" marker-end="url(#r)"/>
  <rect x="860" y="500" width="680" height="330" rx="12" fill="#fff" stroke="#C0392B" stroke-width="3"/>
  <text x="1200" y="550" text-anchor="middle" font-size="26" font-weight="700" fill="#C0392B">컨트롤 파일에는 기록, rac2 에는 파일 없음</text>
  <g font-size="24" fill="#212F3D">
    <text x="900" y="610">• 백업을 rac1 에서만 돌려야 한다</text>
    <text x="900" y="660">• rac1 이 죽으면 그 아카이브를 못 읽는다</text>
    <text x="900" y="710">• 복구 때 모든 스레드가 한곳에 없다</text>
    <text x="900" y="760">• 그 구간 이후로는 복구할 수 없다</text>
  </g>
