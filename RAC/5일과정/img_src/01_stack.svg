<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Pretendard, sans-serif">
  <rect width="1600" height="900" fill="#fff"/>
  <text x="800" y="60" text-anchor="middle" font-size="36" font-weight="700" fill="#212F3D">노드 하나의 소프트웨어 스택 — 세 개의 층</text>
  <g font-size="22" fill="#5D6D7E" font-weight="700">
    <text x="520" y="120" text-anchor="middle">계층</text><text x="1010" y="120" text-anchor="middle">홈 · 계정</text><text x="1360" y="120" text-anchor="middle">주 명령</text>
  </g>
  <rect x="120" y="145" width="1380" height="200" rx="12" fill="#FDEDEC" stroke="#C0392B" stroke-width="3"/>
  <text x="160" y="205" font-size="32" font-weight="700" fill="#C0392B">RAC 데이터베이스</text>
  <text x="160" y="250" font-size="22" fill="#212F3D">인스턴스 racdb1 · 트랜잭션 · Cache Fusion</text>
  <text x="160" y="290" font-size="22" fill="#212F3D">서비스와 세션</text>
  <text x="790" y="215" font-size="21" fill="#212F3D" font-family="JetBrains Mono, monospace">/u01/app/oracle/product/</text>
  <text x="790" y="248" font-size="21" fill="#212F3D" font-family="JetBrains Mono, monospace">  19.3.0/dbhome_rac</text>
  <text x="790" y="295" font-size="22" fill="#5D6D7E">계정 oracle</text>
  <text x="1238" y="230" font-size="20" fill="#212F3D" font-family="JetBrains Mono, monospace">srvctl</text>
  <text x="1238" y="270" font-size="20" fill="#212F3D" font-family="JetBrains Mono, monospace">sqlplus / as sysdba</text>
  <rect x="120" y="365" width="1380" height="200" rx="12" fill="#D6EAF8" stroke="#2471A3" stroke-width="3"/>
  <text x="160" y="425" font-size="32" font-weight="700" fill="#2471A3">Oracle ASM</text>
  <text x="160" y="470" font-size="22" fill="#212F3D">+ASM1 · 디스크그룹 CRS · DATA · FRA</text>
  <text x="160" y="510" font-size="22" fill="#212F3D">파일 분산과 미러링</text>
  <rect x="120" y="585" width="1380" height="200" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <text x="160" y="645" font-size="32" font-weight="700" fill="#34495E">Oracle Clusterware</text>
  <text x="160" y="690" font-size="22" fill="#212F3D">멤버십 · 하트비트 · 자원 기동과 감시</text>
  <text x="160" y="730" font-size="22" fill="#212F3D">OCR · 보팅 파일 · VIP · SCAN</text>
  <rect x="760" y="380" width="460" height="390" rx="12" fill="#fff" stroke="#5D6D7E" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="990" y="440" text-anchor="middle" font-size="26" font-weight="700" fill="#212F3D">Grid Infrastructure 홈</text>
  <text x="990" y="500" text-anchor="middle" font-size="21" fill="#212F3D" font-family="JetBrains Mono, monospace">/u01/app/19.3.0/grid</text>
  <text x="990" y="545" text-anchor="middle" font-size="22" fill="#5D6D7E">ORACLE_BASE /u01/app/grid</text>
  <text x="990" y="590" text-anchor="middle" font-size="22" fill="#5D6D7E">계정 grid</text>
  <text x="990" y="650" text-anchor="middle" font-size="21" fill="#5D6D7E">ASM 과 Clusterware 가</text>
  <text x="990" y="684" text-anchor="middle" font-size="21" fill="#5D6D7E">같은 홈을 쓴다</text>
  <text x="1238" y="450" font-size="20" fill="#212F3D" font-family="JetBrains Mono, monospace">asmcmd</text>
  <text x="1238" y="490" font-size="20" fill="#212F3D" font-family="JetBrains Mono, monospace">sqlplus / as sysasm</text>
  <text x="1238" y="670" font-size="20" fill="#212F3D" font-family="JetBrains Mono, monospace">crsctl  (root)</text>
  <text x="1238" y="710" font-size="20" fill="#212F3D" font-family="JetBrains Mono, monospace">olsnodes · oifcfg</text>
  <text x="800" y="840" text-anchor="middle" font-size="24" fill="#5D6D7E">아래 층이 서야 위 층이 선다 — 기동은 아래에서 위로, 진단도 아래에서 위로</text>
</svg>
