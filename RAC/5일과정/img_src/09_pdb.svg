<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Pretendard, sans-serif">
  <defs><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker></defs>
  <rect width="1600" height="900" fill="#fff"/>
  <text x="800" y="60" text-anchor="middle" font-size="36" font-weight="700" fill="#212F3D">PDB 열림 상태는 인스턴스마다 따로</text>
  <rect x="620" y="100" width="360" height="90" rx="12" fill="#ECF0F1" stroke="#1E8449" stroke-width="3"/>
  <text x="800" y="140" text-anchor="middle" font-size="26" font-weight="700" fill="#1E8449">클라이언트 → rac-scan</text>
  <text x="800" y="175" text-anchor="middle" font-size="20" fill="#5D6D7E">어느 노드로 갈지 모른다</text>
  <path d="M700 190 L420 255" stroke="#1E8449" stroke-width="3" marker-end="url(#g)"/>
  <path d="M900 190 L1180 255" stroke="#1E8449" stroke-width="3" marker-end="url(#g)"/>
  <rect x="80" y="260" width="660" height="330" rx="12" fill="#FDEDEC" stroke="#C0392B" stroke-width="3"/>
  <text x="410" y="305" text-anchor="middle" font-size="28" font-weight="700" fill="#212F3D">racdb1 (INST_ID 1)</text>
  <text x="410" y="355" text-anchor="middle" font-size="26" font-weight="700" fill="#C0392B">RACPDB1 MOUNTED</text>
  <g font-size="22" fill="#212F3D"><text x="115" y="415">• set container 는 성공</text><text x="115" y="460">• 조회 → ORA-01219</text><text x="115" y="505">• DML → ORA-01109</text><text x="115" y="550" fill="#5D6D7E">• 고정 뷰(GV$PDBS)는 조회 가능</text></g>
  <rect x="860" y="260" width="660" height="330" rx="12" fill="#ECF0F1" stroke="#27AE60" stroke-width="3"/>
  <text x="1190" y="305" text-anchor="middle" font-size="28" font-weight="700" fill="#212F3D">racdb2 (INST_ID 2)</text>
  <text x="1190" y="355" text-anchor="middle" font-size="26" font-weight="700" fill="#27AE60">RACPDB1 READ WRITE</text>
  <g font-size="22" fill="#212F3D"><text x="895" y="415">• 같은 SQL 이 정상</text><text x="895" y="460">• 증상은 간헐적 — 재시도하면</text><text x="921" y="495">이쪽으로 붙어 성공하기도</text></g>
  <rect x="80" y="630" width="1440" height="230" rx="12" fill="#fff" stroke="#2471A3" stroke-width="3"/>
  <text x="120" y="675" font-size="26" font-weight="700" fill="#2471A3">명령에 INSTANCES 를 붙인다</text>
  <g font-size="21" fill="#212F3D" font-family="JetBrains Mono, monospace"><text x="120" y="720">alter pluggable database racpdb1 close;        -- 실행한 인스턴스만</text><text x="120" y="760">alter pluggable database racpdb1 open  instances=all;</text><text x="120" y="800">alter pluggable database racpdb1 save state instances=all;</text></g>
  <text x="120" y="842" font-size="21" fill="#5D6D7E">저장 상태도 인스턴스별 — DBA_PDB_SAVED_STATES 에 racdb1 · racdb2 두 행</text>
</svg>
