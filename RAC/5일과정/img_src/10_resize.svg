<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Pretendard, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#34495E"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#fff"/>
  <text x="800" y="58" text-anchor="middle" font-size="36" font-weight="700" fill="#212F3D">리두 크기를 바꾸는 순서</text>
  <rect x="60" y="95" width="820" height="115" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <text x="90" y="140" font-size="26" font-weight="700" fill="#212F3D">① 새 크기 그룹을 스레드마다 먼저 추가</text>
  <text x="90" y="185" font-size="22" fill="#2471A3" font-family="JetBrains Mono, monospace">add logfile thread 1 group 11 (…) size 500M</text>
  <rect x="60" y="240" width="820" height="115" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <text x="90" y="285" font-size="26" font-weight="700" fill="#212F3D">② 그 스레드의 인스턴스에서 로그 스위치</text>
  <text x="90" y="330" font-size="22" fill="#2471A3" font-family="JetBrains Mono, monospace">alter system switch logfile;</text>
  <rect x="60" y="385" width="820" height="115" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <text x="90" y="430" font-size="26" font-weight="700" fill="#212F3D">③ 체크포인트 후 INACTIVE 확인</text>
  <text x="90" y="475" font-size="22" fill="#2471A3" font-family="JetBrains Mono, monospace">alter system checkpoint;  select … from v$log;</text>
  <rect x="60" y="530" width="820" height="115" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <text x="90" y="575" font-size="26" font-weight="700" fill="#212F3D">④ 옛 그룹 삭제 (스레드마다 2개 이상 남김)</text>
  <text x="90" y="620" font-size="22" fill="#2471A3" font-family="JetBrains Mono, monospace">alter database drop logfile group 1;</text>
  <line x1="470" y1="210" x2="470" y2="236" stroke="#34495E" stroke-width="3" marker-end="url(#a)"/>
  <line x1="470" y1="355" x2="470" y2="381" stroke="#34495E" stroke-width="3" marker-end="url(#a)"/>
  <line x1="470" y1="500" x2="470" y2="526" stroke="#34495E" stroke-width="3" marker-end="url(#a)"/>
  <text x="1230" y="125" text-anchor="middle" font-size="26" font-weight="700" fill="#212F3D">그룹 상태 변화</text>
  <rect x="1050" y="150" width="360" height="80" rx="12" fill="#fff" stroke="#C0392B" stroke-width="3"/>
  <text x="1230" y="200" text-anchor="middle" font-size="26" font-weight="700" fill="#C0392B">CURRENT</text>
  <rect x="1050" y="320" width="360" height="80" rx="12" fill="#fff" stroke="#B9770E" stroke-width="3"/>
  <text x="1230" y="370" text-anchor="middle" font-size="26" font-weight="700" fill="#B9770E">ACTIVE</text>
  <rect x="1050" y="490" width="360" height="80" rx="12" fill="#fff" stroke="#27AE60" stroke-width="3"/>
  <text x="1230" y="540" text-anchor="middle" font-size="26" font-weight="700" fill="#27AE60">INACTIVE → drop 가능</text>
  <line x1="1230" y1="230" x2="1230" y2="316" stroke="#34495E" stroke-width="3" marker-end="url(#a)"/>
  <text x="1250" y="282" font-size="22" fill="#5D6D7E">switch logfile</text>
  <line x1="1230" y1="400" x2="1230" y2="486" stroke="#34495E" stroke-width="3" marker-end="url(#a)"/>
  <text x="1250" y="452" font-size="22" fill="#5D6D7E">checkpoint</text>
  <rect x="60" y="690" width="1480" height="170" rx="12" fill="#fff" stroke="#C0392B" stroke-width="3"/>
  <text x="90" y="738" font-size="26" font-weight="700" fill="#C0392B">스위치는 그 스레드를 쓰는 인스턴스에서</text>
  <text x="90" y="785" font-size="24" fill="#212F3D">thread 1 → rac1 의 racdb1,  thread 2 → rac2 의 racdb2. racdb2 에서 스위치해도 thread 1 CURRENT 는 그대로</text>
  <text x="90" y="830" font-size="24" fill="#212F3D">CURRENT 를 지우면 ORA-01623, 옛 그룹을 먼저 지워 2개 미만이 되면 거부</text>
</svg>
