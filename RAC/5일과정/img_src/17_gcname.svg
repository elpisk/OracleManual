<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Pretendard, sans-serif">
  <rect width="1600" height="900" fill="#fff"/>
  <text x="800" y="58" text-anchor="middle" font-size="36" font-weight="700" fill="#212F3D">gc 대기 이벤트 이름은 세 부분으로 읽는다</text>
  <text x="800" y="160" text-anchor="middle" font-size="44" fill="#212F3D" font-family="JetBrains Mono, monospace">gc  current  block  busy</text>
  <g stroke-width="3" fill="none">
    <path d="M520 180 L520 215 L360 215 L360 250" stroke="#2471A3"/>
    <path d="M770 180 L770 250" stroke="#B9770E"/>
    <path d="M1000 180 L1000 215 L1200 215 L1200 250" stroke="#C0392B"/>
  </g>
  <rect x="60" y="255" width="460" height="250" rx="12" fill="#D6EAF8" stroke="#2471A3" stroke-width="3"/>
  <text x="290" y="300" text-anchor="middle" font-size="26" font-weight="700" fill="#2471A3">블록 종류</text>
  <text x="90" y="355" font-size="22" fill="#212F3D">cr — 읽기 일관성 사본</text>
  <text x="90" y="400" font-size="22" fill="#212F3D">current — 수정용 현재 블록</text>
  <rect x="570" y="255" width="460" height="250" rx="12" fill="#FEF5E7" stroke="#B9770E" stroke-width="3"/>
  <text x="800" y="300" text-anchor="middle" font-size="26" font-weight="700" fill="#B9770E">동작</text>
  <text x="600" y="355" font-size="22" fill="#212F3D">block — 블록 자체를 받음</text>
  <text x="600" y="400" font-size="22" fill="#212F3D">grant — 권한만 받음 (디스크에서 읽음)</text>
  <text x="600" y="445" font-size="22" fill="#212F3D">multi block — 여러 블록</text>
  <rect x="1080" y="255" width="460" height="250" rx="12" fill="#FDEDEC" stroke="#C0392B" stroke-width="3"/>
  <text x="1310" y="300" text-anchor="middle" font-size="26" font-weight="700" fill="#C0392B">결과</text>
  <text x="1110" y="355" font-size="22" fill="#212F3D">2-way — 보유 노드와 바로 끝남</text>
  <text x="1110" y="400" font-size="22" fill="#212F3D">3-way — 마스터를 한 번 더 거침</text>
  <text x="1110" y="445" font-size="22" fill="#C0392B">busy — 상대가 쓰는 중, 경합</text>
  <text x="1110" y="490" font-size="22" fill="#212F3D">congested — 보내는 쪽 과부하</text>
  <rect x="60" y="560" width="1480" height="280" rx="12" fill="#fff" stroke="#5D6D7E" stroke-width="2"/>
  <text x="100" y="610" font-size="26" font-weight="700" fill="#212F3D">읽는 순서</text>
  <g font-size="23" fill="#212F3D">
    <text x="100" y="660">• WAIT_CLASS = 'Cluster' 로 RAC 특유 대기만 걸러 본다</text>
    <text x="100" y="705">• 2-way 위주: 블록이 많이 오갈 뿐 — 인터커넥트 대역폭·지연을 본다</text>
    <text x="100" y="750">• busy 위주: 같은 블록을 두 노드가 다툰다 — 애플리케이션·서비스 배치 문제</text>
    <text x="100" y="795">• 2노드 클러스터에서는 3-way 가 나오지 않는다</text>
  </g>
</svg>
