<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Pretendard, sans-serif">
  <rect width="1600" height="900" fill="#fff"/>
  <text x="800" y="60" text-anchor="middle" font-size="36" font-weight="700" fill="#212F3D">OMF 이름의 다섯 조각</text>
  <g font-family="JetBrains Mono, monospace" font-size="28" text-anchor="middle">
    <rect x="40" y="130" width="160" height="80" rx="12" fill="#D6EAF8" stroke="#2471A3" stroke-width="3"/><text x="120" y="182" fill="#212F3D">+DATA</text>
    <rect x="220" y="130" width="160" height="80" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/><text x="300" y="182" fill="#212F3D">RACDB</text>
    <rect x="400" y="130" width="440" height="80" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/><text x="620" y="182" fill="#212F3D" font-size="22">5A569448ED6C2E8D…</text>
    <rect x="860" y="130" width="200" height="80" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/><text x="960" y="182" fill="#212F3D">DATAFILE</text>
    <rect x="1080" y="130" width="480" height="80" rx="12" fill="#FDEDEC" stroke="#C0392B" stroke-width="3"/><text x="1320" y="182" fill="#C0392B">system.274.1242762677</text>
  </g>
  <g font-size="22" fill="#212F3D" text-anchor="middle">
    <text x="120" y="255" font-weight="700">디스크그룹</text>
    <text x="300" y="255" font-weight="700">DB_UNIQUE_NAME</text>
    <text x="620" y="255" font-weight="700">PDB GUID (RACPDB1)</text>
    <text x="620" y="290" fill="#5D6D7E">CDB$ROOT 파일은 없음</text>
    <text x="960" y="255" font-weight="700">파일 종류</text>
    <text x="960" y="290" fill="#5D6D7E">ASM 이 만든 디렉터리</text>
    <text x="1320" y="255" font-weight="700">태그 . 파일번호 . incarnation</text>
  </g>
  <rect x="1080" y="330" width="480" height="300" rx="12" fill="#fff" stroke="#C0392B" stroke-width="3"/>
  <g font-size="22" fill="#212F3D">
    <text x="1105" y="380" font-weight="700">system — 태그</text>
    <text x="1105" y="415" fill="#5D6D7E">보통 테이블스페이스 이름</text>
    <text x="1105" y="470" font-weight="700">274 — ASM 파일 번호</text>
    <text x="1105" y="505" fill="#5D6D7E">V$ASM_FILE.FILE_NUMBER</text>
    <text x="1105" y="560" font-weight="700">1242762677 — incarnation</text>
    <text x="1105" y="595" fill="#5D6D7E">번호 재사용 시 옛 파일과 구분</text>
  </g>
  <rect x="40" y="330" width="1000" height="300" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <text x="70" y="380" font-size="26" font-weight="700" fill="#212F3D">같은 데이터베이스의 다른 파일들</text>
  <g font-family="JetBrains Mono, monospace" font-size="20" fill="#212F3D">
    <text x="70" y="430">+DATA/RACDB/DATAFILE/system.257.1242761643</text>
    <text x="70" y="470">+DATA/RACDB/CONTROLFILE/current.261.1242761745</text>
    <text x="70" y="510">+FRA/RACDB/CONTROLFILE/current.256.1242761745</text>
    <text x="70" y="550">+DATA/RACDB/ONLINELOG/group_1.262.1242761749</text>
  </g>
  <text x="70" y="600" font-size="22" fill="#5D6D7E">CDB 전체 파일은 GUID 조각이 없고, 파일 번호는 디스크그룹마다 따로 매긴다</text>
  <rect x="40" y="680" width="1520" height="170" rx="12" fill="#FDEDEC" stroke="#C0392B" stroke-width="3"/>
  <text x="80" y="730" font-size="26" font-weight="700" fill="#C0392B">한 자리만 틀려도 ORA-01516 — 파일은 있는데 없다고 한다</text>
  <text x="80" y="780" font-size="22" fill="#212F3D">users.260.1242761683 을 …684 로 적으면 nonexistent data file</text>
  <text x="80" y="820" font-size="22" fill="#212F3D">V$DATAFILE 에서 복사하거나 파일 번호로 지정한다: alter database datafile 7 offline</text>
</svg>
