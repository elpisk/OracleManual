<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Pretendard, sans-serif">
  <defs><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#34495E"/></marker></defs>
  <rect width="1600" height="900" fill="#fff"/>
  <text x="800" y="60" text-anchor="middle" font-size="36" font-weight="700" fill="#212F3D">ASM 을 보는 두 창 — 같은 곳을 읽는다</text>
  <rect x="80" y="120" width="560" height="260" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <text x="360" y="170" text-anchor="middle" font-size="30" font-weight="700" fill="#212F3D">SQL 창</text>
  <text x="360" y="215" text-anchor="middle" font-size="22" fill="#212F3D" font-family="JetBrains Mono, monospace">sqlplus / as sysasm</text>
  <g font-size="23" fill="#212F3D"><text x="115" y="265">• 조건·계산·조인을 걸 수 있다</text><text x="115" y="305">• GV$ 로 두 노드를 한 번에</text><text x="115" y="345">• 감시 스크립트는 이쪽</text></g>
  <rect x="960" y="120" width="560" height="260" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <text x="1240" y="170" text-anchor="middle" font-size="30" font-weight="700" fill="#212F3D">asmcmd 창</text>
  <text x="1240" y="215" text-anchor="middle" font-size="22" fill="#212F3D" font-family="JetBrains Mono, monospace">ASMCMD&gt; lsdg · ls · du</text>
  <g font-size="23" fill="#212F3D"><text x="995" y="265">• 익숙한 셸 명령으로 한눈에</text><text x="995" y="305">• 경로처럼 파일을 둘러본다</text><text x="995" y="345">• 접속한 인스턴스 하나만</text></g>
  <path d="M360 380 L620 500" stroke="#34495E" stroke-width="3" marker-end="url(#g)"/>
  <path d="M1240 380 L980 500" stroke="#34495E" stroke-width="3" marker-end="url(#g)"/>
  <text x="800" y="450" text-anchor="middle" font-size="22" fill="#5D6D7E">bequeath 접속 · OS 인증 (OSASM = asmadmin)</text>
  <rect x="380" y="510" width="840" height="290" rx="12" fill="#D6EAF8" stroke="#2471A3" stroke-width="3"/>
  <text x="800" y="560" text-anchor="middle" font-size="30" font-weight="700" fill="#2471A3">ASM 인스턴스 +ASM1 (Grid 홈)</text>
  <text x="800" y="605" text-anchor="middle" font-size="23" fill="#212F3D">SGA · 백그라운드 프로세스 · SQL 파서는 있다</text>
  <text x="800" y="645" text-anchor="middle" font-size="23" fill="#C0392B">데이터 딕셔너리 없음 → DBA_ 뷰 없음</text>
  <rect x="470" y="675" width="660" height="95" rx="12" fill="#fff" stroke="#2471A3" stroke-width="2"/>
  <text x="800" y="715" text-anchor="middle" font-size="24" font-weight="700" fill="#212F3D">V$ASM_* 뷰 50개 (ACFS 17개 포함)</text>
  <text x="800" y="752" text-anchor="middle" font-size="22" fill="#5D6D7E">asmcmd lsdg = V$ASM_DISKGROUP 조회 결과</text>
  <text x="800" y="850" text-anchor="middle" font-size="23" fill="#5D6D7E">사람이 한 번 볼 것은 asmcmd, 조건을 걸거나 자동화할 것은 SQL</text>
</svg>
