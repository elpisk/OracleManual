<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Pretendard, sans-serif">
  <rect width="1600" height="900" fill="#fff"/>
  <text x="800" y="60" text-anchor="middle" font-size="36" font-weight="700" fill="#212F3D">설치가 남긴 주소 — 누가 올리는가</text>
  <rect x="60" y="110" width="700" height="420" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <text x="410" y="155" text-anchor="middle" font-size="30" font-weight="700" fill="#212F3D">rac1</text>
  <text x="90" y="210" font-size="24" font-weight="700" fill="#1E8449">ens33 · public</text>
  <g font-family="JetBrains Mono, monospace" font-size="21" fill="#212F3D">
    <text x="110" y="255">172.16.225.101  공용 IP</text>
    <text x="110" y="295">172.16.225.111  rac1-vip</text>
    <text x="110" y="335">172.16.225.120  rac-scan</text>
    <text x="110" y="430">172.16.119.101  rac1-priv</text>
    <text x="110" y="470">169.254.x.x     HAIP</text>
  </g>
  <text x="90" y="385" font-size="24" font-weight="700" fill="#B9770E">ens160 · cluster_interconnect,asm</text>
  <rect x="840" y="110" width="700" height="420" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <text x="1190" y="155" text-anchor="middle" font-size="30" font-weight="700" fill="#212F3D">rac2</text>
  <text x="870" y="210" font-size="24" font-weight="700" fill="#1E8449">ens33 · public</text>
  <g font-family="JetBrains Mono, monospace" font-size="21" fill="#212F3D">
    <text x="890" y="255">172.16.225.102  공용 IP</text>
    <text x="890" y="295">172.16.225.112  rac2-vip</text>
    <text x="890" y="335" fill="#5D6D7E">(SCAN VIP 는 한 노드에만)</text>
    <text x="890" y="430">172.16.119.102  rac2-priv</text>
    <text x="890" y="470">169.254.x.x     HAIP</text>
  </g>
  <text x="870" y="385" font-size="24" font-weight="700" fill="#B9770E">ens160 · cluster_interconnect,asm</text>
  <rect x="60" y="570" width="700" height="280" rx="12" fill="#fff" stroke="#34495E" stroke-width="3"/>
  <text x="90" y="615" font-size="26" font-weight="700" fill="#212F3D">올리는 주체</text>
  <g font-size="22" fill="#212F3D">
    <text x="90" y="665">• OS: 공용 IP, 사설 IP (ifcfg)</text>
    <text x="90" y="710">• Clusterware: VIP, SCAN VIP, HAIP</text>
    <text x="90" y="755">• 설치 전 VIP · SCAN 주소는 비어 있어야 한다</text>
    <text x="90" y="800">• 용도 확인은 oifcfg getif</text>
  </g>
  <rect x="840" y="570" width="700" height="280" rx="12" fill="#fff" stroke="#1E8449" stroke-width="3"/>
  <text x="870" y="615" font-size="26" font-weight="700" fill="#1E8449">이름 해석 — dnsmasq</text>
  <g font-size="22" fill="#212F3D">
    <text x="870" y="665">• /etc/hosts 에 이름 7개 (공용·VIP·사설·SCAN)</text>
    <text x="870" y="710">• dnsmasq 가 hosts 를 DNS 로 서비스</text>
    <text x="870" y="755">• resolv.conf → nameserver 127.0.0.1</text>
    <text x="870" y="800">• rac-scan → IP 1개 (PRVG-11368 경고)</text>
  </g>
</svg>
