<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Pretendard, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5D6D7E"/></marker></defs>
  <rect width="1600" height="900" fill="#fff"/>
  <text x="800" y="58" text-anchor="middle" font-size="36" font-weight="700" fill="#212F3D">관리자 관리형 RAC 를 RAC One Node 로 — 두 조건</text>
  <g font-size="22" fill="#212F3D">
    <rect x="60" y="110" width="440" height="160" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
    <text x="280" y="160" text-anchor="middle" font-size="26" font-weight="700">출발: Type RAC</text>
    <text x="280" y="205" text-anchor="middle">racdb1, racdb2</text>
    <text x="280" y="240" text-anchor="middle" fill="#5D6D7E">srvctl 서비스 없음</text>
    <rect x="580" y="110" width="440" height="160" rx="12" fill="#FDEDEC" stroke="#C0392B" stroke-width="3"/>
    <text x="800" y="160" text-anchor="middle" font-size="26" font-weight="700" fill="#C0392B">PRCD-1214</text>
    <text x="800" y="205" text-anchor="middle">인스턴스가 둘 이상</text>
    <text x="800" y="240" text-anchor="middle" fill="#5D6D7E">무엇을 남길지 관리자가 고른다</text>
    <rect x="1100" y="110" width="440" height="160" rx="12" fill="#fff" stroke="#34495E" stroke-width="3"/>
    <text x="1320" y="160" text-anchor="middle" font-size="26" font-weight="700">조치 ①</text>
    <text x="1320" y="205" text-anchor="middle" font-family="JetBrains Mono, monospace">srvctl stop instance</text>
    <text x="1320" y="240" text-anchor="middle" font-family="JetBrains Mono, monospace">srvctl remove instance</text>
    <rect x="1100" y="350" width="440" height="160" rx="12" fill="#FDEDEC" stroke="#C0392B" stroke-width="3"/>
    <text x="1320" y="400" text-anchor="middle" font-size="26" font-weight="700" fill="#C0392B">PRCD-1242</text>
    <text x="1320" y="445" text-anchor="middle">서비스가 없다</text>
    <text x="1320" y="480" text-anchor="middle" fill="#5D6D7E">재배치는 서비스를 옮기는 일</text>
    <rect x="580" y="350" width="440" height="160" rx="12" fill="#fff" stroke="#34495E" stroke-width="3"/>
    <text x="800" y="400" text-anchor="middle" font-size="26" font-weight="700">조치 ②</text>
    <text x="800" y="445" text-anchor="middle" font-family="JetBrains Mono, monospace">srvctl add service</text>
    <text x="800" y="480" text-anchor="middle" font-family="JetBrains Mono, monospace">-service ronsvc</text>
    <rect x="60" y="350" width="440" height="160" rx="12" fill="#E9F7EF" stroke="#27AE60" stroke-width="3"/>
    <text x="280" y="400" text-anchor="middle" font-size="26" font-weight="700" fill="#27AE60">변환 성공</text>
    <text x="280" y="445" text-anchor="middle" font-family="JetBrains Mono, monospace">-dbtype RACONENODE</text>
    <text x="280" y="480" text-anchor="middle" font-family="JetBrains Mono, monospace">-instance racdb -timeout 30</text>
  </g>
  <g stroke="#5D6D7E" stroke-width="3">
    <line x1="500" y1="190" x2="575" y2="190" marker-end="url(#a)"/>
    <line x1="1020" y1="190" x2="1095" y2="190" marker-end="url(#a)"/>
    <line x1="1320" y1="270" x2="1320" y2="345" marker-end="url(#a)"/>
    <line x1="1100" y1="430" x2="1025" y2="430" marker-end="url(#a)"/>
    <line x1="580" y1="430" x2="505" y2="430" marker-end="url(#a)"/>
  </g>
  <rect x="60" y="580" width="1480" height="260" rx="12" fill="#fff" stroke="#2471A3" stroke-width="3"/>
  <text x="100" y="630" font-size="26" font-weight="700" fill="#2471A3">remove instance 와 dbca -deleteInstance 는 다르다</text>
  <g font-size="24" fill="#212F3D">
    <text x="100" y="685">• srvctl remove instance: CRS 등록만 해제. thread 2 · UNDOTBS2 는 남는다</text>
    <text x="100" y="735">• dbca -deleteInstance: 스레드·리두·UNDO 까지 지운다 (15장)</text>
    <text x="100" y="785">• 남겨 둔 thread 2 · UNDOTBS2 를 재배치된 racdb_2 가 쓴다</text>
  </g>
</svg>
