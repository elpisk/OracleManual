<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Pretendard, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#34495E"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#27AE60"/></marker></defs>
  <rect width="1600" height="900" fill="#fff"/>
  <text x="800" y="58" text-anchor="middle" font-size="36" font-weight="700" fill="#212F3D">Application Continuity 의 재생</text>
  <rect x="40" y="110" width="420" height="140" rx="12" fill="#fff" stroke="#5D6D7E" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="250" y="160" text-anchor="middle" font-size="26" font-weight="700" fill="#212F3D">애플리케이션 + 재생 드라이버</text>
  <text x="250" y="200" text-anchor="middle" font-size="22" fill="#212F3D">요청 안의 호출을 기록</text>
  <rect x="580" y="110" width="400" height="140" rx="12" fill="#fff" stroke="#C0392B" stroke-width="3" stroke-dasharray="10 6"/>
  <text x="780" y="160" text-anchor="middle" font-size="26" font-weight="700" fill="#C0392B">racdb1 — 요청 도중 장애</text>
  <text x="780" y="200" text-anchor="middle" font-size="22" fill="#212F3D">커밋 응답을 못 받음</text>
  <line x1="460" y1="180" x2="575" y2="180" stroke="#34495E" stroke-width="3" marker-end="url(#a)"/>
  <rect x="1100" y="110" width="460" height="140" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <text x="1330" y="160" text-anchor="middle" font-size="26" font-weight="700" fill="#212F3D">racdb2 에 재접속</text>
  <text x="1330" y="200" text-anchor="middle" font-size="22" fill="#212F3D">FAN · 오류로 감지, 세션 상태 복원</text>
  <line x1="980" y1="180" x2="1095" y2="180" stroke="#34495E" stroke-width="3" marker-end="url(#a)"/>
  <rect x="1000" y="320" width="560" height="140" rx="12" fill="#D6EAF8" stroke="#2471A3" stroke-width="3"/>
  <text x="1280" y="370" text-anchor="middle" font-size="26" font-weight="700" fill="#2471A3">Transaction Guard</text>
  <text x="1280" y="410" text-anchor="middle" font-size="22" fill="#212F3D" font-family="JetBrains Mono, monospace">GET_LTXID_OUTCOME(LTXID)</text>
  <line x1="1330" y1="250" x2="1330" y2="315" stroke="#34495E" stroke-width="3" marker-end="url(#a)"/>
  <rect x="1000" y="540" width="560" height="120" rx="12" fill="#fff" stroke="#27AE60" stroke-width="3"/>
  <text x="1280" y="590" text-anchor="middle" font-size="24" font-weight="700" fill="#27AE60">커밋됨 → 재생하지 않음</text>
  <text x="1280" y="628" text-anchor="middle" font-size="22" fill="#212F3D">결과만 돌려준다 (중복 방지)</text>
  <rect x="380" y="540" width="560" height="120" rx="12" fill="#fff" stroke="#B9770E" stroke-width="3"/>
  <text x="660" y="590" text-anchor="middle" font-size="24" font-weight="700" fill="#B9770E">커밋 안 됨 → 기록한 호출 재생</text>
  <text x="660" y="628" text-anchor="middle" font-size="22" fill="#212F3D">replay_init_time 안일 때만</text>
  <line x1="1280" y1="460" x2="1280" y2="535" stroke="#27AE60" stroke-width="3" marker-end="url(#g)"/>
  <line x1="1050" y1="460" x2="800" y2="535" stroke="#B9770E" stroke-width="3" marker-end="url(#a)"/>
  <rect x="40" y="320" width="560" height="140" rx="12" fill="#fff" stroke="#C0392B" stroke-width="3"/>
  <text x="320" y="368" text-anchor="middle" font-size="24" font-weight="700" fill="#C0392B">결과가 처음과 다르면 중단</text>
  <text x="320" y="408" text-anchor="middle" font-size="22" fill="#212F3D">원래 오류를 애플리케이션에 돌려줌</text>
  <line x1="560" y1="540" x2="420" y2="465" stroke="#C0392B" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#r)"/>
  <rect x="40" y="720" width="1520" height="140" rx="12" fill="#fff" stroke="#34495E" stroke-width="3"/>
  <text x="70" y="768" font-size="24" fill="#212F3D"><tspan font-weight="700">AC</tspan>  -failovertype TRANSACTION -commit_outcome TRUE  (없으면 PRCD-1259)</text>
  <text x="70" y="818" font-size="24" fill="#212F3D"><tspan font-weight="700">TAC</tspan>  -failovertype AUTO -failover_restore AUTO -commit_outcome TRUE  (19c 클라이언트)</text>
</svg>
