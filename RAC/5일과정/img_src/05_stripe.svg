<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Pretendard, sans-serif">
  <rect width="1600" height="900" fill="#fff"/>
  <text x="800" y="60" text-anchor="middle" font-size="36" font-weight="700" fill="#212F3D">COARSE 와 FINE — 파일을 디스크에 흩는 단위</text>
  <rect x="60" y="100" width="700" height="560" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <text x="410" y="150" text-anchor="middle" font-size="30" font-weight="700" fill="#212F3D">COARSE — AU 단위</text>
  <text x="410" y="190" text-anchor="middle" font-size="22" fill="#5D6D7E">데이터 파일 system.257 · +DATA AU 1MB</text>
  <g font-size="22" fill="#212F3D" text-anchor="middle">
    <rect x="100" y="220" width="190" height="300" rx="12" fill="#D6EAF8" stroke="#2471A3" stroke-width="3"/><text x="195" y="255">data1</text>
    <rect x="315" y="220" width="190" height="300" rx="12" fill="#D6EAF8" stroke="#2471A3" stroke-width="3"/><text x="410" y="255">data2</text>
    <rect x="530" y="220" width="190" height="300" rx="12" fill="#D6EAF8" stroke="#2471A3" stroke-width="3"/><text x="625" y="255">data3</text>
    <rect x="120" y="280" width="150" height="90" fill="#fff" stroke="#34495E" stroke-width="2"/><text x="195" y="333">AU 0</text>
    <rect x="335" y="280" width="150" height="90" fill="#fff" stroke="#34495E" stroke-width="2"/><text x="410" y="333">AU 1</text>
    <rect x="550" y="280" width="150" height="90" fill="#fff" stroke="#34495E" stroke-width="2"/><text x="625" y="333">AU 2</text>
    <rect x="120" y="400" width="150" height="90" fill="#fff" stroke="#34495E" stroke-width="2"/><text x="195" y="453">AU 3</text>
    <rect x="335" y="400" width="150" height="90" fill="#fff" stroke="#34495E" stroke-width="2"/><text x="410" y="453">AU 4</text>
    <rect x="550" y="400" width="150" height="90" fill="#fff" stroke="#34495E" stroke-width="2"/><text x="625" y="453">AU 5</text>
  </g>
  <text x="90" y="575" font-size="22" fill="#212F3D">큰 순차 I/O 에 유리, 메타데이터가 적다</text>
  <text x="90" y="615" font-size="22" fill="#212F3D">데이터 파일 · 리두 · 아카이브 · 백업셋</text>
  <rect x="840" y="100" width="700" height="560" rx="12" fill="#FDEDEC" stroke="#C0392B" stroke-width="3"/>
  <text x="1190" y="150" text-anchor="middle" font-size="30" font-weight="700" fill="#C0392B">FINE — 128KB 단위</text>
  <text x="1190" y="190" text-anchor="middle" font-size="22" fill="#5D6D7E">컨트롤 파일 Current.261</text>
  <g font-size="22" fill="#212F3D" text-anchor="middle">
    <rect x="880" y="220" width="190" height="300" rx="12" fill="#D6EAF8" stroke="#2471A3" stroke-width="3"/><text x="975" y="255">data1</text>
    <rect x="1095" y="220" width="190" height="300" rx="12" fill="#D6EAF8" stroke="#2471A3" stroke-width="3"/><text x="1190" y="255">data2</text>
    <rect x="1310" y="220" width="190" height="300" rx="12" fill="#D6EAF8" stroke="#2471A3" stroke-width="3"/><text x="1405" y="255">data3</text>
  </g>
  <g fill="#fff" stroke="#C0392B" stroke-width="2">
    <rect x="900" y="280" width="150" height="40"/><rect x="900" y="330" width="150" height="40"/><rect x="900" y="380" width="150" height="40"/><rect x="900" y="430" width="150" height="40"/>
    <rect x="1115" y="280" width="150" height="40"/><rect x="1115" y="330" width="150" height="40"/><rect x="1115" y="380" width="150" height="40"/><rect x="1115" y="430" width="150" height="40"/>
    <rect x="1330" y="280" width="150" height="40"/><rect x="1330" y="330" width="150" height="40"/><rect x="1330" y="380" width="150" height="40"/><rect x="1330" y="430" width="150" height="40"/>
  </g>
  <text x="870" y="575" font-size="22" fill="#212F3D">작고 갱신이 잦고 여러 인스턴스가 동시 접근</text>
  <text x="870" y="615" font-size="22" fill="#212F3D">한 디스크로 부하가 몰리지 않게 잘게 퍼뜨린다</text>
  <rect x="60" y="700" width="1480" height="150" rx="12" fill="#fff" stroke="#5D6D7E" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="100" y="750" font-size="24" fill="#212F3D">어느 쪽인지는 파일 종류별 템플릿이 정한다 — 시스템 템플릿 22개 중 CONTROLFILE 만 FINE</text>
  <text x="100" y="800" font-size="22" fill="#5D6D7E">확인: V$ASM_FILE.STRIPED · asmcmd ls -l 의 Striped 열</text>
</svg>
