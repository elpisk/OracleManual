<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Pretendard, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#34495E"/></marker></defs>
  <rect width="1600" height="900" fill="#fff"/>
  <text x="800" y="60" text-anchor="middle" font-size="36" font-weight="700" fill="#212F3D">기동 순서 — alert.log 로 따라간다</text>
  <g font-size="22" fill="#212F3D" text-anchor="middle">
    <rect x="60" y="120" width="260" height="150" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
    <text x="190" y="165" font-size="26" font-weight="700">① ohasd</text><text x="190" y="205">systemd 가 기동</text><text x="190" y="242" fill="#C0392B">CRS-2112 OLR</text>
    <rect x="370" y="120" width="260" height="150" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
    <text x="500" y="165" font-size="26" font-weight="700">② 감시자·에이전트</text><text x="500" y="205">cssdagent</text><text x="500" y="242">cssdmonitor</text>
    <rect x="680" y="120" width="260" height="150" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
    <text x="810" y="165" font-size="26" font-weight="700">③ 통신 기반</text><text x="810" y="205">mdnsd · evmd</text><text x="810" y="242">gpnpd · gipcd</text>
    <rect x="990" y="120" width="260" height="150" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
    <text x="1120" y="165" font-size="26" font-weight="700">④ ocssd</text><text x="1120" y="205">보팅 파일 · 하트비트</text><text x="1120" y="242" fill="#C0392B">CRS-1601 멤버십</text>
    <rect x="1300" y="120" width="240" height="150" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
    <text x="1420" y="165" font-size="26" font-weight="700">⑤ octssd</text><text x="1420" y="205">시간 동기</text><text x="1420" y="242" fill="#C0392B">CRS-2401</text>
  </g>
  <path d="M320 195 L365 195" stroke="#34495E" stroke-width="3" marker-end="url(#a)"/>
  <path d="M630 195 L675 195" stroke="#34495E" stroke-width="3" marker-end="url(#a)"/>
  <path d="M940 195 L985 195" stroke="#34495E" stroke-width="3" marker-end="url(#a)"/>
  <path d="M1250 195 L1295 195" stroke="#34495E" stroke-width="3" marker-end="url(#a)"/>
  <path d="M1420 270 L1420 330 L1300 330" stroke="#34495E" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <g font-size="22" fill="#212F3D" text-anchor="middle">
    <rect x="990" y="300" width="300" height="160" rx="12" fill="#FDEDEC" stroke="#C0392B" stroke-width="3"/>
    <text x="1140" y="345" font-size="26" font-weight="700" fill="#C0392B">⑥ CRS-5019</text><text x="1140" y="385">OCR 이 있는 +CRS 가</text><text x="1140" y="420">아직 마운트 전 (정상)</text>
    <rect x="620" y="300" width="320" height="160" rx="12" fill="#D6EAF8" stroke="#2471A3" stroke-width="3"/>
    <text x="780" y="345" font-size="26" font-weight="700" fill="#2471A3">⑦ ASM 인스턴스</text><text x="780" y="385">+ASM1 기동</text><text x="780" y="420">+CRS 마운트 → OCR</text>
    <rect x="250" y="300" width="320" height="160" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
    <text x="410" y="345" font-size="26" font-weight="700">⑧ crsd</text><text x="410" y="385" fill="#C0392B">CRS-1012 OCR 서비스</text><text x="410" y="420" fill="#C0392B">CRS-1201 기동 완료</text>
  </g>
  <path d="M990 380 L945 380" stroke="#34495E" stroke-width="3" marker-end="url(#a)"/>
  <path d="M620 380 L575 380" stroke="#34495E" stroke-width="3" marker-end="url(#a)"/>
  <path d="M410 460 L410 540" stroke="#34495E" stroke-width="3" marker-end="url(#a)"/>
  <rect x="60" y="545" width="1480" height="130" rx="12" fill="#fff" stroke="#34495E" stroke-width="3"/>
  <text x="100" y="595" font-size="26" font-weight="700" fill="#212F3D">⑨ 운영 자원 기동 (crsd → 에이전트)</text>
  <text x="100" y="640" font-size="22" fill="#212F3D">네트워크 · VIP · 리스너 · SCAN → 디스크그룹 DATA · FRA → racdb 인스턴스 → 서비스</text>
  <rect x="60" y="710" width="1480" height="140" rx="12" fill="#fff" stroke="#5D6D7E" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="100" y="760" font-size="24" fill="#212F3D">정지는 역순: 위층 자원 → crsd → storage · asm → haip → cssd 를 마지막에</text>
  <text x="100" y="810" font-size="22" fill="#5D6D7E">순서는 사람이 정하지 않는다. 자원마다 정의된 의존 관계에서 Clusterware 가 도출한다</text>
</svg>
