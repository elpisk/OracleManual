<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Pretendard, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#34495E"/></marker>
  <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker></defs>
  <rect width="1600" height="900" fill="#fff"/>
  <text x="800" y="60" text-anchor="middle" font-size="36" font-weight="700" fill="#212F3D">HEADER_STATUS 의 변화 — /dev/asmdisk/test1</text>
  <g font-size="22" fill="#212F3D" text-anchor="middle">
    <rect x="60" y="130" width="400" height="260" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
    <text x="260" y="185" font-size="30" font-weight="700" fill="#27AE60">CANDIDATE</text>
    <text x="260" y="235">NAME 없음 · CLOSED</text><text x="260" y="275">GROUP_NUMBER 0</text><text x="260" y="315">TOTAL_MB 0 · OS_MB 4096</text>
    <rect x="600" y="130" width="400" height="260" rx="12" fill="#D6EAF8" stroke="#2471A3" stroke-width="3"/>
    <text x="800" y="185" font-size="30" font-weight="700" fill="#2471A3">MEMBER</text>
    <text x="800" y="235">NAME TEST_0000 · CACHED</text><text x="800" y="275">GROUP_NUMBER 4</text><text x="800" y="315">TOTAL_MB 4096</text>
    <rect x="1140" y="130" width="400" height="260" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
    <text x="1340" y="185" font-size="30" font-weight="700" fill="#27AE60">FORMER</text>
    <text x="1340" y="235">NAME 없음 · CLOSED</text><text x="1340" y="275">전에 쓰인 적 있음</text><text x="1340" y="315">그대로 다시 사용 가능</text>
  </g>
  <path d="M460 230 L595 230" stroke="#34495E" stroke-width="3" marker-end="url(#a)"/>
  <text x="528" y="215" text-anchor="middle" font-size="20" fill="#5D6D7E">create</text>
  <path d="M1000 230 L1135 230" stroke="#34495E" stroke-width="3" marker-end="url(#a)"/>
  <text x="1068" y="215" text-anchor="middle" font-size="20" fill="#5D6D7E">drop</text>
  <path d="M1340 390 L1340 440 L260 440 L260 395" stroke="#34495E" stroke-width="3" fill="none" stroke-dasharray="8 6" marker-end="url(#a)"/>
  <text x="800" y="475" text-anchor="middle" font-size="22" fill="#5D6D7E">FORMER 도 CANDIDATE 처럼 FORCE 없이 새 디스크그룹에 넣는다</text>
  <rect x="60" y="530" width="700" height="320" rx="12" fill="#FDEDEC" stroke="#C0392B" stroke-width="3"/>
  <text x="90" y="580" font-size="26" font-weight="700" fill="#C0392B">MEMBER 를 다른 곳에 쓰면</text>
  <text x="90" y="630" font-size="22" fill="#212F3D">create … disk '/dev/asmdisk/data1'</text>
  <text x="90" y="675" font-size="22" fill="#212F3D">→ ORA-15018 + ORA-15029</text>
  <text x="90" y="720" font-size="22" fill="#212F3D">FORCE 는 헤더를 덮어써 +DATA 를 파괴</text>
  <text x="90" y="765" font-size="22" fill="#212F3D">GROUP_NUMBER 로 소속부터 확인한다</text>
  <rect x="840" y="530" width="700" height="320" rx="12" fill="#fff" stroke="#34495E" stroke-width="3"/>
  <text x="870" y="580" font-size="26" font-weight="700" fill="#212F3D">그 밖의 값</text>
  <text x="870" y="630" font-size="22" fill="#212F3D">PROVISIONED: 관리자가 ASM 용으로 표시</text>
  <text x="870" y="675" font-size="22" fill="#212F3D">FOREIGN: 다른 제품이 사용 중 — 불가</text>
  <text x="870" y="720" font-size="22" fill="#212F3D">두 노드에서 같은 경로 · 같은 개수인지</text>
  <text x="870" y="765" font-size="22" fill="#212F3D">+ASM1 과 +ASM2 에서 각각 조회한다</text>
</svg>
