<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Pretendard, sans-serif">
  <defs><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#34495E"/></marker></defs>
  <rect width="1600" height="900" fill="#fff"/>
  <text x="800" y="60" text-anchor="middle" font-size="36" font-weight="700" fill="#212F3D">위치 정보는 어디에 기록되어 있는가</text>
  <rect x="60" y="110" width="440" height="190" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <text x="280" y="155" text-anchor="middle" font-size="27" font-weight="700" fill="#212F3D">Clusterware 자원</text>
  <text x="280" y="195" text-anchor="middle" font-size="20" fill="#212F3D" font-family="JetBrains Mono, monospace">ora.racdb.db</text>
  <text x="280" y="235" text-anchor="middle" font-size="21" fill="#212F3D">srvctl config database</text>
  <text x="280" y="270" text-anchor="middle" font-size="21" fill="#5D6D7E">Spfile: 다음 기동에 쓸 값</text>
  <rect x="60" y="340" width="440" height="190" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <text x="280" y="385" text-anchor="middle" font-size="27" font-weight="700" fill="#212F3D">실행 중 인스턴스</text>
  <text x="280" y="430" text-anchor="middle" font-size="21" fill="#212F3D">show parameter spfile</text>
  <text x="280" y="470" text-anchor="middle" font-size="21" fill="#5D6D7E">지금 읽고 있는 파일</text>
  <rect x="600" y="210" width="420" height="220" rx="12" fill="#D6EAF8" stroke="#2471A3" stroke-width="3"/>
  <text x="810" y="255" text-anchor="middle" font-size="27" font-weight="700" fill="#2471A3">SPFILE</text>
  <text x="810" y="295" text-anchor="middle" font-size="18" fill="#212F3D" font-family="JetBrains Mono, monospace">+DATA/RACDB/PARAMETERFILE/</text>
  <text x="810" y="320" text-anchor="middle" font-size="18" fill="#212F3D" font-family="JetBrains Mono, monospace">spfile.272.1242762487</text>
  <text x="810" y="370" text-anchor="middle" font-size="22" fill="#212F3D">*.control_files = …</text>
  <text x="810" y="405" text-anchor="middle" font-size="20" fill="#C0392B">실행 중 변경 불가 (ORA-02095)</text>
  <rect x="1120" y="210" width="420" height="220" rx="12" fill="#D6EAF8" stroke="#2471A3" stroke-width="3"/>
  <text x="1330" y="255" text-anchor="middle" font-size="27" font-weight="700" fill="#2471A3">컨트롤 파일 2벌</text>
  <text x="1330" y="300" text-anchor="middle" font-size="22" fill="#212F3D">+DATA · +FRA</text>
  <text x="1330" y="350" text-anchor="middle" font-size="22" fill="#212F3D">데이터 파일 경로 기록</text>
  <text x="1330" y="390" text-anchor="middle" font-size="20" fill="#27AE60">SWITCH 로 바꿀 수 있다</text>
  <path d="M500 205 L595 270" stroke="#34495E" stroke-width="3" marker-end="url(#g)"/>
  <path d="M500 435 L595 370" stroke="#34495E" stroke-width="3" marker-end="url(#g)"/>
  <path d="M1020 320 L1115 320" stroke="#34495E" stroke-width="3" marker-end="url(#g)"/>
  <rect x="60" y="580" width="720" height="270" rx="12" fill="#fff" stroke="#2471A3" stroke-width="3"/>
  <text x="95" y="625" font-size="26" font-weight="700" fill="#2471A3">SPFILE 이동</text>
  <g font-size="22" fill="#212F3D"><text x="95" y="670">1. CREATE PFILE FROM SPFILE</text><text x="95" y="710">2. CREATE SPFILE='+FRA/…' FROM PFILE</text><text x="95" y="750" fill="#C0392B" font-weight="700">3. srvctl modify database -spfile  ← 자주 빠짐</text><text x="95" y="790">4. srvctl config 로 확인 → 재기동</text></g>
  <rect x="820" y="580" width="720" height="270" rx="12" fill="#fff" stroke="#2471A3" stroke-width="3"/>
  <text x="855" y="625" font-size="26" font-weight="700" fill="#2471A3">컨트롤 파일 이동</text>
  <g font-size="22" fill="#212F3D"><text x="855" y="670">1. control_files 새 값 scope=spfile</text><text x="855" y="710">2. 전체 정지 → NOMOUNT</text><text x="855" y="750">3. RMAN RESTORE CONTROLFILE FROM 기존 사본</text><text x="855" y="790">4. MOUNT → OPEN</text><text x="855" y="828" fill="#5D6D7E">RAC 는 모든 인스턴스를 함께 내린다</text></g>
</svg>
