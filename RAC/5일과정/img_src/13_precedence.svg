<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Pretendard, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#34495E"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#27AE60"/></marker></defs>
  <rect width="1600" height="900" fill="#fff"/>
  <text x="800" y="58" text-anchor="middle" font-size="36" font-weight="700" fill="#212F3D">페일오버 유형은 어디서 정해지는가</text>
  <text x="680" y="140" text-anchor="middle" font-size="26" font-weight="700" fill="#212F3D">클라이언트 FAILOVER_MODE 없음</text>
  <text x="1220" y="140" text-anchor="middle" font-size="26" font-weight="700" fill="#212F3D">클라이언트 TYPE=SELECT</text>
  <text x="60" y="270" font-size="26" font-weight="700" fill="#212F3D">서버 TRANSACTION</text>
  <text x="60" y="308" font-size="22" fill="#5D6D7E">ch16_ac</text>
  <text x="60" y="540" font-size="26" font-weight="700" fill="#212F3D">서버 설정 없음</text>
  <text x="60" y="578" font-size="22" fill="#5D6D7E">ch16_lb</text>
  <rect x="420" y="170" width="520" height="220" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <text x="680" y="260" text-anchor="middle" font-size="32" font-weight="700" fill="#212F3D">TRANSACTIONAL</text>
  <text x="680" y="310" text-anchor="middle" font-size="22" fill="#5D6D7E">EZConnect 에도 서버 값 적용</text>
  <rect x="960" y="170" width="520" height="220" rx="12" fill="#fff" stroke="#C0392B" stroke-width="5"/>
  <text x="1220" y="250" text-anchor="middle" font-size="32" font-weight="700" fill="#C0392B">TRANSACTIONAL</text>
  <text x="1220" y="300" text-anchor="middle" font-size="24" font-weight="700" fill="#C0392B">서버가 이긴다</text>
  <text x="1220" y="340" text-anchor="middle" font-size="22" fill="#5D6D7E">요청한 SELECT 는 무시됨</text>
  <rect x="420" y="440" width="520" height="220" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <text x="680" y="530" text-anchor="middle" font-size="32" font-weight="700" fill="#5D6D7E">NONE</text>
  <text x="680" y="580" text-anchor="middle" font-size="22" fill="#5D6D7E">페일오버 없음</text>
  <rect x="960" y="440" width="520" height="220" rx="12" fill="#ECF0F1" stroke="#B9770E" stroke-width="3"/>
  <text x="1220" y="530" text-anchor="middle" font-size="32" font-weight="700" fill="#B9770E">SELECT</text>
  <text x="1220" y="580" text-anchor="middle" font-size="22" fill="#5D6D7E">클라이언트 값 적용 (TAF)</text>
  <rect x="60" y="710" width="1420" height="150" rx="12" fill="#fff" stroke="#34495E" stroke-width="3"/>
  <text x="90" y="760" font-size="24" fill="#212F3D">확인 위치: <tspan font-family="JetBrains Mono, monospace">V$SESSION.FAILOVER_TYPE · FAILOVER_METHOD · FAILED_OVER</tspan></text>
  <text x="90" y="810" font-size="24" fill="#212F3D">서비스의 TRANSACTION 은 V$SESSION 에 TRANSACTIONAL 로, METHOD 는 네 칸 중 세 칸이 BASIC</text>
