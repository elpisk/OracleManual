<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Pretendard, sans-serif">
  <defs><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker></defs>
  <rect width="1600" height="900" fill="#fff"/>
  <text x="800" y="60" text-anchor="middle" font-size="36" font-weight="700" fill="#212F3D">rac2 의 인스턴스가 빠지면</text>
  <rect x="80" y="120" width="620" height="380" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <text x="390" y="170" text-anchor="middle" font-size="30" font-weight="700" fill="#212F3D">rac1 — racdb1 계속 서비스</text>
  <g font-size="24" fill="#212F3D"><text x="120" y="230">• 자기 세션의 트랜잭션은 그대로</text><text x="120" y="275">• SMON 이 thread 2 리두를 읽어</text><text x="146" y="310">인스턴스 복구</text><text x="120" y="355">• 복구 동안 잠긴 블록만 잠시 대기</text><text x="120" y="400">• 서비스가 racdb1 로 옮겨 온다 (12장)</text></g>
  <rect x="900" y="120" width="620" height="380" rx="12" fill="#FDEDEC" stroke="#C0392B" stroke-width="3" stroke-dasharray="10 6"/>
  <text x="1210" y="170" text-anchor="middle" font-size="30" font-weight="700" fill="#C0392B">rac2 — racdb2 정지</text>
  <g font-size="24" fill="#212F3D"><text x="940" y="230">• 붙어 있던 세션은 끊긴다</text><text x="940" y="275">• 커밋 전 트랜잭션은 롤백</text><text x="940" y="320">• 노드가 죽으면 rac2-vip 가 rac1 로</text><text x="966" y="355">옮겨 가 접속 시도를 즉시 거절</text><text x="940" y="400">• Clusterware 는 계속 동작 (인스턴스만 정지)</text></g>
  <path d="M900 300 L700 300" stroke="#C0392B" stroke-width="5" marker-end="url(#r)"/>
  <text x="800" y="285" text-anchor="middle" font-size="22" fill="#C0392B" font-weight="700">thread 2</text>
  <rect x="80" y="560" width="1440" height="270" rx="12" fill="#fff" stroke="#5D6D7E" stroke-width="2"/>
  <text x="120" y="610" font-size="26" font-weight="700" fill="#212F3D">클라이언트에서 보이는 것</text>
  <g font-size="24" fill="#212F3D"><text x="120" y="660">• rac-scan 으로 새로 접속하면 racdb1 로 연결된다</text><text x="120" y="705">• rac2-vip 로 직접 접속하면 ORA-12514 등으로 실패 — VIP 로 접속 문자열을 고정하지 않는다</text><text x="120" y="750">• 끊긴 세션을 자동으로 이어 주는 것은 TAF · AC 의 몫 (13장)</text><text x="120" y="795">• 다시 기동하면 racdb2 가 클러스터에 합류하고 서비스는 수동으로 되돌린다</text></g>
</svg>
