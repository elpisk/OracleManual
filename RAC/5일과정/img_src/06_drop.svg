<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Pretendard, sans-serif">
  <defs><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#34495E"/></marker></defs>
  <rect width="1600" height="900" fill="#fff"/>
  <text x="800" y="60" text-anchor="middle" font-size="36" font-weight="700" fill="#212F3D">정상 제거와 FORCE 제거 — 디스크 헤더에 남는 것</text>
  <text x="100" y="135" font-size="30" font-weight="700" fill="#27AE60">정상 제거  DROP DISK d_c</text>
  <rect x="100" y="160" width="420" height="200" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <text x="310" y="205" text-anchor="middle" font-size="26" font-weight="700" fill="#212F3D">명령 직후</text>
  <g font-size="22" fill="#212F3D" font-family="JetBrains Mono, monospace"><text x="135" y="250">NAME   D_C</text><text x="135" y="285">HEADER MEMBER</text><text x="135" y="320">STATE  DROPPING</text></g>
  <path d="M520 260 L635 260" stroke="#34495E" stroke-width="3" marker-end="url(#g)"/>
  <text x="578" y="240" text-anchor="middle" font-size="22" fill="#5D6D7E">데이터 이동</text>
  <rect x="640" y="160" width="420" height="200" rx="12" fill="#ECF0F1" stroke="#27AE60" stroke-width="3"/>
  <text x="850" y="205" text-anchor="middle" font-size="26" font-weight="700" fill="#212F3D">리밸런스 완료</text>
  <g font-size="22" fill="#212F3D" font-family="JetBrains Mono, monospace"><text x="675" y="250">NAME   (비어 있음)</text><text x="675" y="285">HEADER FORMER</text><text x="675" y="320">GROUP  0 · CLOSED</text></g>
  <rect x="1120" y="160" width="400" height="200" rx="12" fill="#fff" stroke="#27AE60" stroke-width="3"/>
  <text x="1320" y="225" text-anchor="middle" font-size="26" font-weight="700" fill="#27AE60">그대로 재사용</text>
  <text x="1320" y="275" text-anchor="middle" font-size="22" fill="#212F3D">물리 회수도 이 뒤에</text>
  <text x="1320" y="315" text-anchor="middle" font-size="22" fill="#5D6D7E">DROPPING 중엔 뽑지 않는다</text>
  <text x="100" y="455" font-size="30" font-weight="700" fill="#C0392B">FORCE 제거  DROP DISK d_c FORCE</text>
  <rect x="100" y="480" width="420" height="200" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <text x="310" y="525" text-anchor="middle" font-size="26" font-weight="700" fill="#212F3D">명령 직후</text>
  <g font-size="21" fill="#212F3D" font-family="JetBrains Mono, monospace"><text x="125" y="570">NAME _DROPPED_0002_TESTN</text><text x="125" y="605">PATH (비어 있음)</text><text x="125" y="640">목록에 남아 데이터 이동</text></g>
  <path d="M520 580 L635 580" stroke="#34495E" stroke-width="3" marker-end="url(#g)"/>
  <rect x="640" y="480" width="420" height="200" rx="12" fill="#FDEDEC" stroke="#C0392B" stroke-width="3"/>
  <text x="850" y="525" text-anchor="middle" font-size="26" font-weight="700" fill="#212F3D">리밸런스 완료</text>
  <g font-size="22" fill="#212F3D" font-family="JetBrains Mono, monospace"><text x="675" y="570">HEADER MEMBER  ← 정리 안 됨</text><text x="675" y="605">GROUP  0</text><text x="675" y="640">TOTAL_MB 0</text></g>
  <rect x="1120" y="480" width="400" height="200" rx="12" fill="#fff" stroke="#C0392B" stroke-width="3"/>
  <text x="1320" y="535" text-anchor="middle" font-size="24" font-weight="700" fill="#C0392B">다시 ADD 하면</text>
  <text x="1320" y="580" text-anchor="middle" font-size="24" font-weight="700" fill="#C0392B">ORA-15033</text>
  <text x="1320" y="630" text-anchor="middle" font-size="22" fill="#212F3D">ADD ... FORCE 로</text>
  <text x="1320" y="662" text-anchor="middle" font-size="22" fill="#212F3D">헤더를 덮어써야 들어감</text>
  <rect x="100" y="730" width="1420" height="120" rx="12" fill="#fff" stroke="#5D6D7E" stroke-width="2"/>
  <text x="140" y="778" font-size="24" fill="#212F3D">• 장애 그룹 3개 → 2개가 되는 제거는 ORA-59327 로 거절. 디스크를 먼저 추가한다</text>
  <text x="140" y="820" font-size="24" fill="#212F3D">• 막혔을 때 FORCE 부터 붙이지 않는다 — 헤더의 흔적이 다음 작업을 또 막는다</text>
</svg>
