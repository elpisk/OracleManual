<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Pretendard, sans-serif">
  <rect width="1600" height="900" fill="#fff"/>
  <text x="800" y="60" text-anchor="middle" font-size="36" font-weight="700" fill="#212F3D">인스턴스마다 따로 가지는 세 가지</text>
  <rect x="80" y="100" width="640" height="300" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <text x="400" y="150" text-anchor="middle" font-size="30" font-weight="700" fill="#212F3D">rac1 — racdb1</text>
  <g font-size="22" fill="#212F3D" font-family="JetBrains Mono, monospace"><text x="120" y="210">racdb1.instance_number = 1</text><text x="120" y="260">racdb1.thread          = 1</text><text x="120" y="310">racdb1.undo_tablespace = UNDOTBS1</text></g>
  <text x="400" y="365" text-anchor="middle" font-size="22" fill="#5D6D7E">ORACLE_SID=racdb1 → instance_name</text>
  <rect x="880" y="100" width="640" height="300" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <text x="1200" y="150" text-anchor="middle" font-size="30" font-weight="700" fill="#212F3D">rac2 — racdb2</text>
  <g font-size="22" fill="#212F3D" font-family="JetBrains Mono, monospace"><text x="920" y="210">racdb2.instance_number = 2</text><text x="920" y="260">racdb2.thread          = 2</text><text x="920" y="310">racdb2.undo_tablespace = UNDOTBS2</text></g>
  <text x="1200" y="365" text-anchor="middle" font-size="22" fill="#5D6D7E">ORACLE_SID=racdb2 → instance_name</text>
  <rect x="80" y="450" width="1440" height="300" rx="12" fill="#D6EAF8" stroke="#2471A3" stroke-width="3"/>
  <text x="800" y="495" text-anchor="middle" font-size="28" font-weight="700" fill="#2471A3">공유 디스크그룹 +DATA · +FRA (파일은 모두 여기)</text>
  <g font-size="24" text-anchor="middle">
    <rect x="120" y="520" width="320" height="200" rx="12" fill="#fff" stroke="#2471A3" stroke-width="2"/>
    <text x="280" y="565" font-weight="700" fill="#212F3D">thread 1</text><text x="280" y="610" font-size="22" fill="#212F3D">리두 그룹 1 · 2</text><text x="280" y="650" font-size="21" fill="#5D6D7E">멤버 +DATA · +FRA</text>
    <rect x="470" y="520" width="300" height="200" rx="12" fill="#fff" stroke="#2471A3" stroke-width="2"/>
    <text x="620" y="565" font-weight="700" fill="#212F3D">UNDOTBS1</text><text x="620" y="610" font-size="22" fill="#5D6D7E">racdb1 전용</text>
    <rect x="830" y="520" width="300" height="200" rx="12" fill="#fff" stroke="#2471A3" stroke-width="2"/>
    <text x="980" y="565" font-weight="700" fill="#212F3D">UNDOTBS2</text><text x="980" y="610" font-size="22" fill="#5D6D7E">racdb2 전용</text>
    <rect x="1160" y="520" width="320" height="200" rx="12" fill="#fff" stroke="#2471A3" stroke-width="2"/>
    <text x="1320" y="565" font-weight="700" fill="#212F3D">thread 2</text><text x="1320" y="610" font-size="22" fill="#212F3D">리두 그룹 3 · 4</text><text x="1320" y="650" font-size="21" fill="#5D6D7E">멤버 +DATA · +FRA</text>
  </g>
  <g stroke="#34495E" stroke-width="3"><line x1="280" y1="400" x2="280" y2="450"/><line x1="620" y1="400" x2="620" y2="450"/><line x1="980" y1="400" x2="980" y2="450"/><line x1="1320" y1="400" x2="1320" y2="450"/></g>
  <text x="800" y="800" text-anchor="middle" font-size="24" fill="#212F3D">셋 다 반드시 달라야 한다 — 같으면 리두·UNDO 를 두고 두 인스턴스가 충돌</text>
  <text x="800" y="845" text-anchor="middle" font-size="22" fill="#5D6D7E">파일이 공유돼 있어 한쪽이 죽으면 다른 쪽이 그 스레드와 UNDO 로 인스턴스 복구</text>
</svg>
