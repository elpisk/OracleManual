<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Pretendard, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#34495E"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#27AE60"/></marker></defs>
  <rect width="1600" height="900" fill="#fff"/>
  <text x="800" y="58" text-anchor="middle" font-size="36" font-weight="700" fill="#212F3D">srvctl 과 crsctl 의 경계</text>
  <rect x="80" y="100" width="560" height="270" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <text x="360" y="150" text-anchor="middle" font-size="32" font-weight="700" fill="#212F3D" font-family="JetBrains Mono, monospace">srvctl</text>
  <text x="360" y="192" text-anchor="middle" font-size="22" fill="#5D6D7E">oracle · grid 계정</text>
  <text x="110" y="245" font-size="24" fill="#212F3D">database · instance · service</text>
  <text x="110" y="285" font-size="24" fill="#212F3D">listener · scan · asm · nodeapps</text>
  <text x="110" y="325" font-size="24" fill="#212F3D">DB 정지 절차를 안다</text>
  <rect x="960" y="100" width="560" height="270" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <text x="1240" y="150" text-anchor="middle" font-size="32" font-weight="700" fill="#212F3D" font-family="JetBrains Mono, monospace">crsctl</text>
  <text x="1240" y="192" text-anchor="middle" font-size="22" fill="#5D6D7E">grid 계정 · 스택 기동은 root</text>
  <text x="990" y="245" font-size="24" fill="#212F3D">스택: crs · cluster · css · has</text>
  <text x="990" y="285" font-size="24" fill="#212F3D">자원 정의(-p), -init 목록</text>
  <text x="990" y="325" font-size="24" fill="#212F3D">사용자 자원 등록·삭제</text>
  <rect x="80" y="580" width="680" height="220" rx="12" fill="#D6EAF8" stroke="#2471A3" stroke-width="3"/>
  <text x="420" y="630" text-anchor="middle" font-size="28" font-weight="700" fill="#2471A3">Oracle 자원 (ora.*)</text>
  <text x="420" y="680" text-anchor="middle" font-size="22" fill="#212F3D" font-family="JetBrains Mono, monospace">ora.racdb.db · ora.LISTENER.lsnr</text>
  <text x="420" y="720" text-anchor="middle" font-size="22" fill="#212F3D" font-family="JetBrains Mono, monospace">ora.racdb.&lt;svc&gt;.svc · ora.scan1.vip</text>
  <rect x="840" y="580" width="680" height="220" rx="12" fill="#D6EAF8" stroke="#2471A3" stroke-width="3"/>
  <text x="1180" y="630" text-anchor="middle" font-size="28" font-weight="700" fill="#2471A3">사용자 자원</text>
  <text x="1180" y="680" text-anchor="middle" font-size="22" fill="#212F3D" font-family="JetBrains Mono, monospace">ch14.app (cluster_resource)</text>
  <text x="1180" y="725" text-anchor="middle" font-size="22" fill="#C0392B">srvctl 의 대상 목록에 없음</text>
  <line x1="300" y1="370" x2="300" y2="574" stroke="#27AE60" stroke-width="4" marker-end="url(#g)"/>
  <text x="320" y="470" font-size="24" fill="#27AE60" font-weight="700">기동 · 정지 · 조회</text>
  <line x1="1060" y1="370" x2="640" y2="574" stroke="#C0392B" stroke-width="4" stroke-dasharray="10 6" marker-end="url(#r)"/>
  <text x="890" y="500" font-size="24" fill="#C0392B" font-weight="700">조회만 허용</text>
  <text x="890" y="535" font-size="24" fill="#C0392B" font-weight="700">기동·정지는 CRS-4995</text>
  <line x1="1400" y1="370" x2="1400" y2="574" stroke="#27AE60" stroke-width="4" marker-end="url(#g)"/>
  <text x="1385" y="430" text-anchor="end" font-size="24" fill="#27AE60" font-weight="700">등록 · 기동 · 정지</text>
  <text x="800" y="860" text-anchor="middle" font-size="24" fill="#5D6D7E">자원 정의는 OCR 에 있다 — crsctl 은 읽을 수 있지만 DB 정지 절차는 srvctl 만 안다</text>
</svg>
