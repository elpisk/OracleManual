<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Pretendard, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#fff"/>
  <text x="800" y="58" text-anchor="middle" font-size="36" font-weight="700" fill="#212F3D">데이터 파일 하나의 미디어 복구 — 데이터베이스는 열린 채로</text>
  <g font-size="24" fill="#212F3D">
    <rect x="40" y="120" width="280" height="250" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
    <text x="180" y="170" text-anchor="middle" font-size="26" font-weight="700">① 오프라인</text>
    <text x="180" y="225" text-anchor="middle" font-size="22" font-family="JetBrains Mono, monospace">datafile 27</text>
    <text x="180" y="260" text-anchor="middle" font-size="22" font-family="JetBrains Mono, monospace">offline</text>
    <text x="180" y="320" text-anchor="middle" font-size="22" fill="#5D6D7E">STATUS RECOVER</text>
    <rect x="350" y="120" width="280" height="250" rx="12" fill="#FDEDEC" stroke="#C0392B" stroke-width="3"/>
    <text x="490" y="170" text-anchor="middle" font-size="26" font-weight="700" fill="#C0392B">② 파일 손실</text>
    <text x="490" y="225" text-anchor="middle" font-size="22">ASM 에서 삭제</text>
    <text x="490" y="280" text-anchor="middle" font-size="22" fill="#C0392B" font-family="JetBrains Mono, monospace">ORA-00376</text>
    <text x="490" y="315" text-anchor="middle" font-size="22" fill="#C0392B" font-family="JetBrains Mono, monospace">ORA-01110</text>
    <rect x="660" y="120" width="280" height="250" rx="12" fill="#D6EAF8" stroke="#2471A3" stroke-width="3"/>
    <text x="800" y="170" text-anchor="middle" font-size="26" font-weight="700" fill="#2471A3">③ restore</text>
    <text x="800" y="225" text-anchor="middle" font-size="22">+FRA 백업셋에서</text>
    <text x="800" y="260" text-anchor="middle" font-size="22">+DATA 로 복원</text>
    <text x="800" y="320" text-anchor="middle" font-size="22" fill="#5D6D7E">ASM 이름이 새로 붙음</text>
    <rect x="970" y="120" width="280" height="250" rx="12" fill="#D6EAF8" stroke="#2471A3" stroke-width="3"/>
    <text x="1110" y="170" text-anchor="middle" font-size="26" font-weight="700" fill="#2471A3">④ recover</text>
    <text x="1110" y="225" text-anchor="middle" font-size="22">thread 1 과 2 의</text>
    <text x="1110" y="260" text-anchor="middle" font-size="22">아카이브·리두 적용</text>
    <text x="1110" y="320" text-anchor="middle" font-size="22" fill="#5D6D7E">백업 이후 변경 반영</text>
    <rect x="1280" y="120" width="280" height="250" rx="12" fill="#E9F7EF" stroke="#27AE60" stroke-width="3"/>
    <text x="1420" y="170" text-anchor="middle" font-size="26" font-weight="700" fill="#27AE60">⑤ 온라인</text>
    <text x="1420" y="225" text-anchor="middle" font-size="22" font-family="JetBrains Mono, monospace">datafile 27</text>
    <text x="1420" y="260" text-anchor="middle" font-size="22" font-family="JetBrains Mono, monospace">online</text>
    <text x="1420" y="320" text-anchor="middle" font-size="22" fill="#5D6D7E">두 노드에서 조회</text>
  </g>
  <g stroke="#C0392B" stroke-width="4">
    <line x1="320" y1="245" x2="347" y2="245" marker-end="url(#a)"/>
    <line x1="630" y1="245" x2="657" y2="245" marker-end="url(#a)"/>
    <line x1="940" y1="245" x2="967" y2="245" marker-end="url(#a)"/>
    <line x1="1250" y1="245" x2="1277" y2="245" marker-end="url(#a)"/>
  </g>
  <rect x="40" y="430" width="740" height="400" rx="12" fill="#fff" stroke="#34495E" stroke-width="3"/>
  <text x="410" y="480" text-anchor="middle" font-size="28" font-weight="700" fill="#212F3D">인스턴스 복구</text>
  <g font-size="24" fill="#212F3D">
    <text x="80" y="540">• 원인: 인스턴스 사망 (파일은 멀쩡함)</text>
    <text x="80" y="590">• 수행: 살아 있는 인스턴스의 SMON, 자동</text>
    <text x="80" y="640">• 읽는 것: 죽은 스레드의 온라인 리두</text>
    <text x="80" y="690">• 백업: 필요 없음</text>
    <text x="80" y="740">• 시간: 마지막 체크포인트 이후 양</text>
  </g>
  <rect x="820" y="430" width="740" height="400" rx="12" fill="#fff" stroke="#2471A3" stroke-width="3"/>
  <text x="1190" y="480" text-anchor="middle" font-size="28" font-weight="700" fill="#2471A3">미디어 복구</text>
  <g font-size="24" fill="#212F3D">
    <text x="860" y="540">• 원인: 파일 손상·삭제</text>
    <text x="860" y="590">• 수행: DBA 가 RMAN 으로, 수동</text>
    <text x="860" y="640">• 읽는 것: 백업 + 모든 스레드의 아카이브</text>
    <text x="860" y="690">• 백업: 반드시 필요</text>
    <text x="860" y="740">• 시간: 백업 이후 리두 양과 복원 속도</text>
  </g>
</svg>
