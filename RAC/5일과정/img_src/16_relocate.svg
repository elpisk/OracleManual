<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Pretendard, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5D6D7E"/></marker></defs>
  <rect width="1600" height="900" fill="#fff"/>
  <text x="800" y="58" text-anchor="middle" font-size="36" font-weight="700" fill="#212F3D">온라인 재배치 — racdb1(rac1) → racdb_2(rac2)</text>
  <text x="70" y="140" font-size="26" font-weight="700" fill="#212F3D">rac1</text>
  <text x="70" y="300" font-size="26" font-weight="700" fill="#212F3D">rac2</text>
  <rect x="160" y="105" width="1080" height="60" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <text x="180" y="145" font-size="22" fill="#212F3D">racdb1 Open</text>
  <rect x="820" y="105" width="420" height="60" rx="12" fill="#FDEDEC" stroke="#C0392B" stroke-width="3"/>
  <text x="1030" y="145" text-anchor="middle" font-size="22" fill="#C0392B">transactional local 정지</text>
  <rect x="420" y="265" width="1100" height="60" rx="12" fill="#E9F7EF" stroke="#27AE60" stroke-width="3"/>
  <text x="1500" y="305" text-anchor="end" font-size="22" fill="#212F3D">racdb_2 기동 → Open → RACPDB1 READ WRITE</text>
  <rect x="160" y="185" width="610" height="60" rx="12" fill="#D6EAF8" stroke="#2471A3" stroke-width="3"/>
  <text x="465" y="225" text-anchor="middle" font-size="22" fill="#2471A3">서비스 ronsvc (racdb1)</text>
  <rect x="790" y="345" width="730" height="60" rx="12" fill="#D6EAF8" stroke="#2471A3" stroke-width="3"/>
  <text x="1155" y="385" text-anchor="middle" font-size="22" fill="#2471A3">서비스 ronsvc (racdb_2)</text>
  <line x1="780" y1="245" x2="840" y2="340" stroke="#2471A3" stroke-width="4" marker-end="url(#a)"/>
  <rect x="420" y="420" width="400" height="44" rx="10" fill="#fff" stroke="#C0392B" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="620" y="450" text-anchor="middle" font-size="22" fill="#C0392B">두 인스턴스가 함께 Open</text>
  <g font-size="22" fill="#212F3D">
    <text x="80" y="530" font-size="26" font-weight="700">relocate -verbose 출력 순서</text>
    <text x="80" y="580">1. Added target node rac2 — 후보에 없던 노드를 추가</text>
    <text x="80" y="620">2. Configuration updated to two instances</text>
    <text x="80" y="660">3. Instance racdb_2 started — 새 인스턴스가 먼저 완전히 열린다</text>
    <text x="80" y="700">4. Services relocated — 그다음에 서비스 이동</text>
    <text x="80" y="740">5. Waiting for up to 30 minutes for instance racdb1 to stop</text>
    <text x="80" y="780">6. Instance racdb1 stopped</text>
    <text x="80" y="820">7. Configuration updated to one instance</text>
  </g>
  <rect x="1060" y="500" width="460" height="330" rx="12" fill="#fff" stroke="#5D6D7E" stroke-width="2"/>
  <text x="1290" y="545" text-anchor="middle" font-size="24" font-weight="700" fill="#212F3D">실습 03 기록</text>
  <g font-size="22" fill="#212F3D">
    <text x="1090" y="595">전체: 99.5초</text>
    <text x="1090" y="640">새 인스턴스 기동~PDB: 23초</text>
    <text x="1090" y="685">옛 인스턴스 정지: 62초</text>
    <text x="1090" y="730" fill="#5D6D7E">정지 대기 상한 = -timeout</text>
    <text x="1090" y="770" fill="#5D6D7E">_shutdown_completion_</text>
    <text x="1090" y="805" fill="#5D6D7E">timeout_mins=30</text>
  </g>
</svg>
