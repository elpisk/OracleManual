<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Pretendard, sans-serif">
  <defs><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker></defs>
  <rect width="1600" height="900" fill="#fff"/>
  <text x="800" y="60" text-anchor="middle" font-size="36" font-weight="700" fill="#212F3D">ASMCMD-8102 — 계층을 내려가며 원인을 좁힌다</text>
  <rect x="80" y="110" width="900" height="150" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <text x="115" y="155" font-size="26" font-weight="700" fill="#212F3D">① asmcmd lsdg  (oracle 계정, Grid 홈, +ASM1)</text>
  <text x="115" y="200" font-size="21" fill="#212F3D" font-family="JetBrains Mono, monospace">Connected to an idle instance.</text>
  <text x="115" y="235" font-size="21" fill="#C0392B" font-family="JetBrains Mono, monospace">ASMCMD-8102: no connection to Oracle ASM</text>
  <path d="M530 260 L530 300" stroke="#C0392B" stroke-width="4" marker-end="url(#r)"/>
  <rect x="80" y="305" width="900" height="130" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <text x="115" y="350" font-size="26" font-weight="700" fill="#212F3D">② 같은 계정으로 sqlplus / as sysasm</text>
  <text x="115" y="400" font-size="21" fill="#C0392B" font-family="JetBrains Mono, monospace">ORA-01017: invalid username/password</text>
  <path d="M530 435 L530 475" stroke="#C0392B" stroke-width="4" marker-end="url(#r)"/>
  <rect x="80" y="480" width="900" height="170" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <text x="115" y="525" font-size="26" font-weight="700" fill="#212F3D">③ OS 인증 → OSASM 그룹과 소속 대조</text>
  <text x="115" y="572" font-size="21" fill="#212F3D" font-family="JetBrains Mono, monospace">osdbagrp -a  →  asmadmin</text>
  <text x="115" y="612" font-size="21" fill="#212F3D" font-family="JetBrains Mono, monospace">id -nG oracle → ... asmdba (asmadmin 없음)</text>
  <path d="M530 650 L530 690" stroke="#C0392B" stroke-width="4" marker-end="url(#r)"/>
  <rect x="80" y="695" width="900" height="120" rx="12" fill="#FDEDEC" stroke="#C0392B" stroke-width="3"/>
  <text x="115" y="745" font-size="26" font-weight="700" fill="#C0392B">원인 확정: oracle 은 OSASM 그룹이 아니다</text>
  <text x="115" y="785" font-size="22" fill="#212F3D">ASM 은 정상. 재기동하면 안 된다 → grid 로 전환</text>
  <rect x="1040" y="110" width="480" height="705" rx="12" fill="#fff" stroke="#5D6D7E" stroke-width="2"/>
  <text x="1280" y="160" text-anchor="middle" font-size="28" font-weight="700" fill="#212F3D">계정별 결과</text>
  <rect x="1075" y="190" width="410" height="150" rx="12" fill="#ECF0F1" stroke="#27AE60" stroke-width="3"/>
  <text x="1105" y="235" font-size="26" font-weight="700" fill="#27AE60">grid — 성공</text>
  <text x="1105" y="275" font-size="22" fill="#212F3D">asmadmin 구성원</text>
  <text x="1105" y="310" font-size="22" fill="#5D6D7E">ASM 관리 작업의 정석</text>
  <rect x="1075" y="370" width="410" height="150" rx="12" fill="#ECF0F1" stroke="#C0392B" stroke-width="3"/>
  <text x="1105" y="415" font-size="26" font-weight="700" fill="#C0392B">oracle — 거부</text>
  <text x="1105" y="455" font-size="22" fill="#212F3D">asmdba 만 (파일 사용 권한)</text>
  <text x="1105" y="490" font-size="22" fill="#5D6D7E">racdb 의 +DATA 사용은 정상</text>
  <rect x="1075" y="550" width="410" height="230" rx="12" fill="#ECF0F1" stroke="#B9770E" stroke-width="3"/>
  <text x="1105" y="595" font-size="26" font-weight="700" fill="#B9770E">root — 성공</text>
  <text x="1105" y="635" font-size="22" fill="#212F3D">bin/oracle 에 setuid</text>
  <text x="1105" y="670" font-size="20" fill="#212F3D" font-family="JetBrains Mono, monospace">-rwsr-s--x grid oinstall</text>
  <text x="1105" y="710" font-size="22" fill="#5D6D7E">된다 ≠ 해도 된다</text>
  <text x="1105" y="745" font-size="22" fill="#5D6D7E">감사 기록·파일 소유권 문제</text>
  <text x="800" y="865" text-anchor="middle" font-size="23" fill="#5D6D7E">메시지가 가리키는 곳과 원인이 있는 곳이 다를 때, 한 계층 아래 도구로 같은 일을 해 본다</text>
</svg>
