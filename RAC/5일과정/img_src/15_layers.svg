<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Pretendard, sans-serif">
  <rect width="1600" height="900" fill="#fff"/>
  <text x="800" y="58" text-anchor="middle" font-size="36" font-weight="700" fill="#212F3D">노드 하나가 기록되는 세 곳</text>
  <rect x="60" y="110" width="460" height="560" rx="12" fill="#D6EAF8" stroke="#2471A3" stroke-width="3"/>
  <text x="290" y="165" text-anchor="middle" font-size="30" font-weight="700" fill="#2471A3">클러스터 구성</text>
  <text x="290" y="210" text-anchor="middle" font-size="24" fill="#212F3D">OCR (공유 디스크 +CRS)</text>
  <text x="290" y="245" text-anchor="middle" font-size="22" fill="#5D6D7E">노드마다 OLR (로컬)</text>
  <line x1="100" y1="280" x2="480" y2="280" stroke="#2471A3" stroke-width="2"/>
  <g font-size="22" fill="#212F3D" font-family="JetBrains Mono, monospace">
    <text x="100" y="330">rootcrs.sh -deconfig</text>
    <text x="100" y="375">crsctl delete node</text>
    <text x="100" y="420">root.sh (그리드 홈)</text>
  </g>
  <text x="290" y="500" text-anchor="middle" font-size="22" fill="#212F3D">클러스터는 이것만 보고 돈다</text>
  <text x="290" y="540" text-anchor="middle" font-size="22" fill="#5D6D7E">확인: olsnodes, ocrcheck</text>
  <rect x="570" y="110" width="460" height="560" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <text x="800" y="165" text-anchor="middle" font-size="30" font-weight="700" fill="#212F3D">소프트웨어 등록</text>
  <text x="800" y="210" text-anchor="middle" font-size="24" fill="#212F3D">중앙 인벤토리 (노드마다)</text>
  <text x="800" y="245" text-anchor="middle" font-size="22" fill="#5D6D7E">inventory.xml 의 NODE_LIST</text>
  <line x1="610" y1="280" x2="990" y2="280" stroke="#34495E" stroke-width="2"/>
  <g font-size="22" fill="#212F3D" font-family="JetBrains Mono, monospace">
    <text x="610" y="330">-updateNodeList</text>
    <text x="610" y="375">deinstall -local</text>
    <text x="610" y="420">addnode.sh</text>
  </g>
  <text x="800" y="500" text-anchor="middle" font-size="22" fill="#212F3D">틀려도 평소엔 증상이 없다</text>
  <text x="800" y="540" text-anchor="middle" font-size="22" fill="#C0392B">deinstall·패치 도구가 이것을 본다</text>
  <rect x="1080" y="110" width="460" height="560" rx="12" fill="#fff" stroke="#34495E" stroke-width="3"/>
  <text x="1310" y="165" text-anchor="middle" font-size="30" font-weight="700" fill="#212F3D">데이터베이스 구성</text>
  <text x="1310" y="210" text-anchor="middle" font-size="24" fill="#212F3D">컨트롤 파일 · SPFILE</text>
  <text x="1310" y="245" text-anchor="middle" font-size="22" fill="#5D6D7E">CRS 의 ora.racdb.db 자원</text>
  <line x1="1120" y1="280" x2="1500" y2="280" stroke="#34495E" stroke-width="2"/>
  <g font-size="22" fill="#212F3D" font-family="JetBrains Mono, monospace">
    <text x="1120" y="330">dbca -deleteInstance</text>
    <text x="1120" y="375">dbca -addInstance</text>
  </g>
  <text x="1310" y="500" text-anchor="middle" font-size="22" fill="#212F3D">스레드 2 · 리두 그룹 3·4</text>
  <text x="1310" y="540" text-anchor="middle" font-size="22" fill="#212F3D">UNDOTBS2 · sid 파라미터</text>
  <rect x="60" y="720" width="1480" height="120" rx="12" fill="#FDEDEC" stroke="#C0392B" stroke-width="3"/>
  <text x="800" y="770" text-anchor="middle" font-size="26" font-weight="700" fill="#C0392B">지울 때도 넣을 때도 세 곳을 모두 맞춘다</text>
  <text x="800" y="810" text-anchor="middle" font-size="22" fill="#212F3D">명령의 성공 메시지가 아니라 olsnodes · inventory.xml · gv$instance 로 확인한다</text>
</svg>
