<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Pretendard, sans-serif">
  <rect width="1600" height="900" fill="#fff"/>
  <text x="800" y="60" text-anchor="middle" font-size="36" font-weight="700" fill="#212F3D">Voting File 과 과반수</text>
  <rect x="60" y="110" width="440" height="150" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <text x="280" y="165" text-anchor="middle" font-size="28" font-weight="700" fill="#212F3D">rac1 ocssd</text>
  <text x="280" y="215" text-anchor="middle" font-size="22" fill="#212F3D">생존 신호를 쓰고 읽는다</text>
  <rect x="1100" y="110" width="440" height="150" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <text x="1320" y="165" text-anchor="middle" font-size="28" font-weight="700" fill="#212F3D">rac2 ocssd</text>
  <text x="1320" y="215" text-anchor="middle" font-size="22" fill="#212F3D">생존 신호를 쓰고 읽는다</text>
  <path d="M500 185 L1100 185" stroke="#B9770E" stroke-width="5"/>
  <text x="800" y="170" text-anchor="middle" font-size="22" fill="#B9770E" font-weight="700">인터커넥트 하트비트 (misscount 30초)</text>
  <rect x="160" y="330" width="1280" height="230" rx="12" fill="#D6EAF8" stroke="#2471A3" stroke-width="3"/>
  <text x="800" y="535" text-anchor="middle" font-size="26" font-weight="700" fill="#2471A3">+CRS Normal — 장애 그룹 3개 · Voting File 3개 · disktimeout 200초</text>
  <g font-size="22" fill="#212F3D" text-anchor="middle">
    <rect x="220" y="355" width="340" height="120" rx="12" fill="#fff" stroke="#2471A3" stroke-width="3"/><text x="390" y="405" font-family="JetBrains Mono, monospace" font-size="21">/dev/asmdisk/crs1</text><text x="390" y="445">CRS_0000 · VF 1</text>
    <rect x="630" y="355" width="340" height="120" rx="12" fill="#fff" stroke="#2471A3" stroke-width="3"/><text x="800" y="405" font-family="JetBrains Mono, monospace" font-size="21">/dev/asmdisk/crs2</text><text x="800" y="445">CRS_0001 · VF 2</text>
    <rect x="1040" y="355" width="340" height="120" rx="12" fill="#fff" stroke="#2471A3" stroke-width="3"/><text x="1210" y="405" font-family="JetBrains Mono, monospace" font-size="21">/dev/asmdisk/crs3</text><text x="1210" y="445">CRS_0002 · VF 3</text>
  </g>
  <path d="M280 260 L390 350" stroke="#34495E" stroke-width="2"/><path d="M280 260 L800 350" stroke="#34495E" stroke-width="2"/><path d="M280 260 L1210 350" stroke="#34495E" stroke-width="2"/>
  <path d="M1320 260 L390 350" stroke="#5D6D7E" stroke-width="2" stroke-dasharray="6 5"/><path d="M1320 260 L800 350" stroke="#5D6D7E" stroke-width="2" stroke-dasharray="6 5"/><path d="M1320 260 L1210 350" stroke="#5D6D7E" stroke-width="2" stroke-dasharray="6 5"/>
  
  <rect x="60" y="610" width="700" height="240" rx="12" fill="#fff" stroke="#34495E" stroke-width="3"/>
  <text x="90" y="655" font-size="26" font-weight="700" fill="#212F3D">개수는 이중화가 정한다</text>
  <text x="90" y="705" font-size="22" fill="#212F3D">External 1개 · 손실 0개 견딤</text>
  <text x="90" y="750" font-size="22" fill="#212F3D">Normal 3개 · 손실 1개 견딤</text>
  <text x="90" y="795" font-size="22" fill="#212F3D">High 5개 · 손실 2개 견딤</text>
  <rect x="840" y="610" width="700" height="240" rx="12" fill="#FDEDEC" stroke="#C0392B" stroke-width="3"/>
  <text x="870" y="655" font-size="26" font-weight="700" fill="#C0392B">과반수 규칙</text>
  <text x="870" y="705" font-size="22" fill="#212F3D">노드는 과반수(3개 중 2개)에 닿아야 남는다</text>
  <text x="870" y="750" font-size="22" fill="#212F3D">홀수라야 반반으로 갈리지 않는다</text>
  <text x="870" y="795" font-size="22" fill="#212F3D">ASM 에 있으면 add · delete 불가 → replace</text>
</svg>
