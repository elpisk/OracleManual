<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Pretendard, sans-serif">
  <defs><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
  <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#34495E"/></marker></defs>
  <rect width="1600" height="900" fill="#fff"/>
  <text x="800" y="60" text-anchor="middle" font-size="36" font-weight="700" fill="#212F3D">디스크 추가 뒤 리밸런스가 진행되는 방식</text>
  <rect x="60" y="120" width="420" height="170" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <text x="270" y="170" text-anchor="middle" font-size="28" font-weight="700" fill="#212F3D">① ADD DISK 명령</text>
  <text x="270" y="215" text-anchor="middle" font-size="20" fill="#212F3D" font-family="JetBrains Mono, monospace">... REBALANCE POWER 1</text>
  <text x="270" y="260" text-anchor="middle" font-size="23" fill="#5D6D7E">1초 안에 돌아온다</text>
  <rect x="590" y="120" width="420" height="170" rx="12" fill="#D6EAF8" stroke="#2471A3" stroke-width="3"/>
  <text x="800" y="170" text-anchor="middle" font-size="28" font-weight="700" fill="#2471A3">② RBAL</text>
  <text x="800" y="215" text-anchor="middle" font-size="23" fill="#212F3D">늘 떠 있다</text>
  <text x="800" y="255" text-anchor="middle" font-size="23" fill="#212F3D">필요 판단 · 계획 수립</text>
  <rect x="1120" y="120" width="420" height="170" rx="12" fill="#D6EAF8" stroke="#2471A3" stroke-width="3"/>
  <text x="1330" y="170" text-anchor="middle" font-size="28" font-weight="700" fill="#2471A3">③ ARBA</text>
  <text x="1330" y="215" text-anchor="middle" font-size="23" fill="#212F3D">작업량 추정</text>
  <text x="1330" y="255" text-anchor="middle" font-size="23" fill="#212F3D">EST_WORK · EST_MINUTES</text>
  <path d="M480 205 L585 205" stroke="#34495E" stroke-width="3" marker-end="url(#g)"/>
  <path d="M1010 205 L1115 205" stroke="#34495E" stroke-width="3" marker-end="url(#g)"/>
  <rect x="590" y="360" width="950" height="180" rx="12" fill="#D6EAF8" stroke="#2471A3" stroke-width="3"/>
  <text x="630" y="410" font-size="28" font-weight="700" fill="#2471A3">④ ARB0 … ARBn 슬레이브 — 익스텐트를 실제로 복사</text>
  <text x="630" y="460" font-size="24" fill="#212F3D">• 슬레이브 수 = 파워 (0~1024, 0 은 중단)</text>
  <text x="630" y="505" font-size="24" fill="#212F3D">• 단계(phase)가 바뀌면 SOFAR 가 다시 0 부터 센다</text>
  <path d="M1330 290 L1330 355" stroke="#34495E" stroke-width="3" marker-end="url(#g)"/>
  <rect x="60" y="360" width="420" height="180" rx="12" fill="#fff" stroke="#5D6D7E" stroke-width="2"/>
  <text x="270" y="410" text-anchor="middle" font-size="26" font-weight="700" fill="#212F3D">데이터베이스</text>
  <text x="270" y="455" text-anchor="middle" font-size="23" fill="#212F3D">같은 파일 이름으로 계속 사용</text>
  <text x="270" y="495" text-anchor="middle" font-size="23" fill="#5D6D7E">익스텐트 층만 움직인다</text>
  <rect x="590" y="610" width="950" height="150" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <text x="630" y="660" font-size="28" font-weight="700" fill="#212F3D">⑤ 완료 — ARB 정지, 모든 ASM 인스턴스 멤버십 갱신</text>
  <text x="630" y="710" font-size="22" fill="#212F3D" font-family="JetBrains Mono, monospace">SUCCESS: rebalance completed for group ... (TESTN)</text>
  <path d="M1065 540 L1065 605" stroke="#34495E" stroke-width="3" marker-end="url(#g)"/>
  <rect x="60" y="610" width="420" height="230" rx="12" fill="#fff" stroke="#C0392B" stroke-width="3"/>
  <text x="270" y="660" text-anchor="middle" font-size="26" font-weight="700" fill="#C0392B">완료 판정</text>
  <text x="270" y="710" text-anchor="middle" font-size="22" fill="#212F3D">V$ASM_OPERATION 에</text>
  <text x="270" y="745" text-anchor="middle" font-size="22" fill="#212F3D">행이 없으면 끝</text>
  <text x="270" y="800" text-anchor="middle" font-size="22" fill="#5D6D7E">SOFAR/EST_WORK 로 판단 X</text>
  <text x="1065" y="820" text-anchor="middle" font-size="23" fill="#5D6D7E">이 랩: test6 추가, 파워 1 → 약 239초 / 파워 8 → 약 68초</text>
</svg>
