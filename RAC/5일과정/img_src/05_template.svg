<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Pretendard, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#34495E"/></marker></defs>
  <rect width="1600" height="900" fill="#fff"/>
  <text x="800" y="60" text-anchor="middle" font-size="36" font-weight="700" fill="#212F3D">템플릿 — 파일을 만들 때 저장 방식을 정한다</text>
  <rect x="60" y="110" width="460" height="200" rx="12" fill="#FDEDEC" stroke="#C0392B" stroke-width="3"/>
  <text x="290" y="160" text-anchor="middle" font-size="26" font-weight="700" fill="#C0392B">racdb1</text>
  <text x="85" y="210" font-size="20" fill="#212F3D" font-family="JetBrains Mono, monospace">datafile '+TEST'</text>
  <text x="85" y="265" font-size="20" fill="#212F3D" font-family="JetBrains Mono, monospace">datafile '+TEST(mytpl)'</text>
  <rect x="600" y="110" width="940" height="200" rx="12" fill="#D6EAF8" stroke="#2471A3" stroke-width="3"/>
  <text x="1070" y="160" text-anchor="middle" font-size="26" font-weight="700" fill="#2471A3">TEST 디스크그룹의 템플릿 (V$ASM_TEMPLATE)</text>
  <text x="630" y="210" font-size="22" fill="#212F3D">DATAFILE (209, 시스템) — UNPROT · COARSE</text>
  <text x="630" y="265" font-size="22" fill="#212F3D">MYTPL (사용자, SYSTEM=N) — UNPROT · FINE</text>
  <path d="M520 205 L595 205" stroke="#34495E" stroke-width="3" marker-end="url(#a)"/>
  <path d="M520 260 L595 260" stroke="#34495E" stroke-width="3" marker-end="url(#a)"/>
  <g font-size="22" fill="#212F3D" text-anchor="middle">
    <rect x="600" y="360" width="440" height="130" rx="12" fill="#fff" stroke="#2471A3" stroke-width="3"/><text x="820" y="410" font-weight="700">파일 256 · ts_alias</text><text x="820" y="455">DATAFILE · COARSE</text>
    <rect x="1100" y="360" width="440" height="130" rx="12" fill="#fff" stroke="#C0392B" stroke-width="3"/><text x="1320" y="410" font-weight="700">파일 257 · ts_tpl</text><text x="1320" y="455">DATAFILE · FINE</text>
  </g>
  <path d="M820 310 L820 355" stroke="#34495E" stroke-width="3" marker-end="url(#a)"/>
  <path d="M1320 310 L1320 355" stroke="#34495E" stroke-width="3" marker-end="url(#a)"/>
  <text x="60" y="400" font-size="22" fill="#212F3D">이름만 보면 차이가 없다</text>
  <text x="60" y="440" font-size="22" fill="#212F3D">저장 방식만 다르다</text>
  <rect x="60" y="540" width="700" height="310" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <text x="90" y="590" font-size="26" font-weight="700" fill="#212F3D">규칙</text>
  <text x="90" y="640" font-size="22" fill="#212F3D">• 디스크그룹마다 시스템 템플릿 22개</text>
  <text x="90" y="685" font-size="22" fill="#212F3D">• REDUNDANCY 는 디스크그룹 이중화를 따름</text>
  <text x="90" y="730" font-size="22" fill="#212F3D">• 변경은 이후 만드는 파일에만 적용</text>
  <text x="90" y="775" font-size="22" fill="#212F3D">• 언제든 되돌릴 수 있다 (compatible 과 다름)</text>
  <rect x="840" y="540" width="700" height="310" rx="12" fill="#FDEDEC" stroke="#C0392B" stroke-width="3"/>
  <text x="870" y="590" font-size="26" font-weight="700" fill="#C0392B">오류</text>
  <text x="870" y="640" font-size="22" fill="#212F3D">+TEST(nosuchtpl) → ORA-01119</text>
  <text x="870" y="685" font-size="22" fill="#212F3D">  → ORA-17502 → ORA-15060 (원인)</text>
  <text x="870" y="730" font-size="22" fill="#212F3D">drop template DATAFILE → ORA-15008</text>
  <text x="870" y="775" font-size="22" fill="#212F3D">스택은 맨 아래부터 읽는다</text>
</svg>
