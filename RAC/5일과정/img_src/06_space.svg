<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Pretendard, sans-serif">
  <rect width="1600" height="900" fill="#fff"/>
  <text x="800" y="60" text-anchor="middle" font-size="36" font-weight="700" fill="#212F3D">Normal 디스크그룹의 세 가지 공간 지표</text>
  <rect x="100" y="100" width="1400" height="110" rx="12" fill="#fff" stroke="#C0392B" stroke-width="3"/>
  <text x="800" y="150" text-anchor="middle" font-size="28" font-weight="700" fill="#C0392B">USABLE_FILE_MB = (FREE_MB − REQUIRED_MIRROR_FREE_MB) ÷ 2</text>
  <text x="800" y="190" text-anchor="middle" font-size="22" fill="#5D6D7E">REQUIRED_MIRROR_FREE_MB = 가장 큰 장애 그룹 크기 (장애 그룹이 둘이면 0)</text>
  <text x="100" y="275" font-size="28" font-weight="700" fill="#212F3D">장애 그룹 2개 — 2500MB 적재 후</text>
  <rect x="100" y="295" width="1400" height="70" rx="8" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <rect x="100" y="295" width="890" height="70" rx="8" fill="#5D6D7E"/>
  <text x="545" y="340" text-anchor="middle" font-size="24" fill="#fff">사용 중 5220</text>
  <rect x="990" y="295" width="510" height="70" rx="8" fill="#D6EAF8" stroke="#2471A3" stroke-width="3"/>
  <text x="1245" y="340" text-anchor="middle" font-size="24" fill="#212F3D">FREE 2972</text>
  <text x="100" y="410" font-size="24" fill="#212F3D">TOTAL 8192 · 예약 0 · USABLE = 2972 ÷ 2 = 1486</text>
  <text x="100" y="448" font-size="22" fill="#C0392B">디스크 한 장을 잃으면 이중화를 복원할 곳이 없다</text>
  <text x="100" y="530" font-size="28" font-weight="700" fill="#212F3D">장애 그룹 3개 — test6 추가 후</text>
  <rect x="100" y="550" width="1400" height="70" rx="8" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <rect x="100" y="550" width="608" height="70" rx="8" fill="#5D6D7E"/>
  <text x="404" y="595" text-anchor="middle" font-size="24" fill="#fff">사용 중 5332</text>
  <rect x="708" y="550" width="466" height="70" rx="8" fill="#FDEDEC" stroke="#C0392B" stroke-width="3"/>
  <text x="941" y="595" text-anchor="middle" font-size="24" fill="#C0392B">예약 4096</text>
  <rect x="1174" y="550" width="326" height="70" rx="8" fill="#D6EAF8" stroke="#2471A3" stroke-width="3"/>
  <text x="1337" y="595" text-anchor="middle" font-size="24" fill="#212F3D">나머지 2860</text>
  <text x="100" y="665" font-size="24" fill="#212F3D">TOTAL 12288 · FREE 6956 · USABLE = (6956 − 4096) ÷ 2 = 1430</text>
  <text x="100" y="703" font-size="22" fill="#27AE60">장애 그룹 하나를 잃어도 남은 둘에 미러를 다시 만든다</text>
  <rect x="100" y="750" width="1400" height="110" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <text x="140" y="797" font-size="24" fill="#212F3D">• 총량은 늘었는데 USABLE 은 1486 → 1430. 줄어든 몫은 복원 보장의 값</text>
  <text x="140" y="837" font-size="24" fill="#212F3D">• 용량 감시는 FREE_MB 가 아니라 USABLE_FILE_MB 에 건다 (음수가 되는 경우는 7장)</text>
</svg>
