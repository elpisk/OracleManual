<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Pretendard, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#34495E"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker></defs>
  <rect width="1600" height="900" fill="#fff"/>
  <text x="800" y="58" text-anchor="middle" font-size="36" font-weight="700" fill="#212F3D">접속 분산의 두 층</text>
  <rect x="80" y="100" width="1440" height="330" rx="12" fill="#fff" stroke="#34495E" stroke-width="3"/>
  <text x="110" y="145" font-size="28" font-weight="700" fill="#212F3D">1층 · 서비스 배치 — 관리자가 정한다 (결정적)</text>
  <rect x="140" y="180" width="560" height="100" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <text x="420" y="240" text-anchor="middle" font-size="26" font-weight="700" fill="#212F3D">racdb1 ← ch15_oltp</text>
  <rect x="900" y="180" width="560" height="100" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <text x="1180" y="240" text-anchor="middle" font-size="26" font-weight="700" fill="#212F3D">racdb2 ← ch15_batch</text>
  <text x="140" y="340" font-size="24" fill="#212F3D">Cardinality 1 → SCAN 이 고를 곳이 하나뿐. ch15_oltp 10번 접속 = 10번 racdb1</text>
  <text x="140" y="385" font-size="24" fill="#5D6D7E">부하를 확실히 나누려면 이 층을 쓴다</text>
  <rect x="80" y="470" width="1440" height="380" rx="12" fill="#fff" stroke="#1E8449" stroke-width="3"/>
  <text x="110" y="515" font-size="28" font-weight="700" fill="#1E8449">2층 · 리스너 선택 — SCAN 이 부하를 보고 정한다</text>
  <rect x="560" y="545" width="480" height="90" rx="12" fill="#E9F7EF" stroke="#1E8449" stroke-width="3"/>
  <text x="800" y="600" text-anchor="middle" font-size="26" font-weight="700" fill="#1E8449">racdb 서비스 · 두 인스턴스</text>
  <rect x="140" y="680" width="560" height="120" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <text x="420" y="728" text-anchor="middle" font-size="24" font-weight="700" fill="#212F3D">부하가 비슷할 때</text>
  <text x="420" y="770" text-anchor="middle" font-size="24" fill="#212F3D">20번 → racdb1 10 · racdb2 10</text>
  <rect x="900" y="680" width="560" height="120" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <text x="1180" y="728" text-anchor="middle" font-size="24" font-weight="700" fill="#212F3D">racdb1 재기동 직후</text>
  <text x="1180" y="770" text-anchor="middle" font-size="24" fill="#212F3D">20번 → racdb1 20 · racdb2 0</text>
  <line x1="700" y1="635" x2="520" y2="676" stroke="#34495E" stroke-width="3" marker-end="url(#a)"/>
  <line x1="900" y1="635" x2="1080" y2="676" stroke="#34495E" stroke-width="3" marker-end="url(#a)"/>
  <text x="1500" y="600" text-anchor="end" font-size="22" fill="#5D6D7E">CLB goal LONG = 세션 수</text>
  <text x="1500" y="635" text-anchor="end" font-size="22" fill="#5D6D7E">SHORT = 응답 시간</text>
</svg>
