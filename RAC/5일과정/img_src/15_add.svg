<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Pretendard, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker></defs>
  <rect width="1600" height="900" fill="#fff"/>
  <text x="800" y="58" text-anchor="middle" font-size="36" font-weight="700" fill="#212F3D">노드 재추가 — 소프트웨어 복사 후 합류, 그다음 인스턴스</text>
  <rect x="60" y="110" width="700" height="80" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <text x="410" y="162" text-anchor="middle" font-size="28" font-weight="700" fill="#212F3D">rac1 (원본 노드)</text>
  <rect x="840" y="110" width="700" height="80" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <text x="1190" y="162" text-anchor="middle" font-size="28" font-weight="700" fill="#212F3D">rac2 (새 노드, root)</text>
  <g font-size="22" fill="#212F3D">
    <rect x="60" y="225" width="700" height="95" rx="12" fill="#fff" stroke="#34495E" stroke-width="3"/>
    <text x="90" y="263" font-size="24" font-weight="700">① 사전 점검 (grid)</text>
    <text x="90" y="300" font-family="JetBrains Mono, monospace">cluvfy stage -pre nodeadd -n rac2</text>
    <rect x="60" y="350" width="700" height="95" rx="12" fill="#D6EAF8" stroke="#2471A3" stroke-width="3"/>
    <text x="90" y="388" font-size="24" font-weight="700">② 그리드 홈 확장 (grid)</text>
    <text x="90" y="425" font-family="JetBrains Mono, monospace">addnode.sh -silent NEW_NODES·VIRTUAL_HOSTNAMES</text>
    <rect x="840" y="475" width="700" height="95" rx="12" fill="#D6EAF8" stroke="#2471A3" stroke-width="3"/>
    <text x="870" y="513" font-size="24" font-weight="700">③ 그리드 root.sh</text>
    <text x="870" y="550">OLR 생성 · ohasd 등록 · CSS 합류 · OCR 등록</text>
    <rect x="60" y="600" width="700" height="95" rx="12" fill="#fff" stroke="#34495E" stroke-width="3"/>
    <text x="90" y="638" font-size="24" font-weight="700">④ DB 홈 확장 (oracle)</text>
    <text x="90" y="675" font-family="JetBrains Mono, monospace">addnode.sh -silent "CLUSTER_NEW_NODES={rac2}"</text>
    <rect x="840" y="600" width="700" height="95" rx="12" fill="#fff" stroke="#34495E" stroke-width="3"/>
    <text x="870" y="638" font-size="24" font-weight="700">⑤ DB 홈 root.sh</text>
    <text x="870" y="675">클러스터 구성은 건드리지 않는다</text>
    <rect x="60" y="750" width="700" height="95" rx="12" fill="#E9F7EF" stroke="#27AE60" stroke-width="3"/>
    <text x="90" y="788" font-size="24" font-weight="700">⑥ 인스턴스 추가 (oracle)</text>
    <text x="90" y="825" font-family="JetBrains Mono, monospace">dbca -silent -addInstance -nodeName rac2</text>
    <rect x="840" y="750" width="700" height="95" rx="12" fill="#FDEDEC" stroke="#C0392B" stroke-width="3"/>
    <text x="870" y="788" font-size="24" font-weight="700" fill="#C0392B">⑦ 인벤토리 확인 (두 노드)</text>
    <text x="870" y="825">NODE_LIST 에 rac1·rac2 가 있는가</text>
  </g>
  <g stroke="#C0392B" stroke-width="4" fill="none">
    <path d="M410 320 L410 345" marker-end="url(#a)"/>
    <path d="M760 400 L1190 400 L1190 470" marker-end="url(#a)"/>
    <path d="M840 540 L410 540 L410 595" marker-end="url(#a)"/>
    <path d="M760 647 L835 647" marker-end="url(#a)"/>
    <path d="M1190 695 L1190 722 L410 722 L410 745" marker-end="url(#a)"/>
    <path d="M760 797 L835 797" marker-end="url(#a)"/>
  </g>
</svg>
