<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Pretendard, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#34495E"/></marker></defs>
  <rect width="1600" height="900" fill="#fff"/>
  <text x="800" y="60" text-anchor="middle" font-size="36" font-weight="700" fill="#212F3D">장애 계층 판별 — 아래층부터 묻는다</text>
  <rect x="80" y="110" width="520" height="130" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <text x="340" y="160" text-anchor="middle" font-size="26" font-weight="700" fill="#212F3D">1. crsctl check has</text>
  <text x="340" y="205" text-anchor="middle" font-size="22" fill="#5D6D7E">ohasd 에게 묻는다</text>
  <rect x="80" y="330" width="520" height="130" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <text x="340" y="380" text-anchor="middle" font-size="26" font-weight="700" fill="#212F3D">2. crsctl check crs</text>
  <text x="340" y="425" text-anchor="middle" font-size="22" fill="#5D6D7E">crsd · cssd · evmd 까지 묻는다</text>
  <rect x="80" y="550" width="520" height="130" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <text x="340" y="600" text-anchor="middle" font-size="26" font-weight="700" fill="#212F3D">3. 다른 노드에서 olsnodes -s</text>
  <text x="340" y="645" text-anchor="middle" font-size="22" fill="#5D6D7E">범위가 노드인가 클러스터인가</text>
  <path d="M340 240 L340 325" stroke="#34495E" stroke-width="3" marker-end="url(#a)"/>
  <text x="360" y="292" font-size="22" fill="#27AE60" font-weight="700">CRS-4638 online</text>
  <path d="M340 460 L340 545" stroke="#34495E" stroke-width="3" marker-end="url(#a)"/>
  <text x="360" y="512" font-size="22" fill="#C0392B" font-weight="700">CRS-4535 · 4530 · 4534</text>
  <path d="M600 175 L795 175" stroke="#C0392B" stroke-width="3" marker-end="url(#a)"/>
  <text x="615" y="160" font-size="22" fill="#C0392B" font-weight="700">CRS-4639</text>
  <rect x="800" y="110" width="720" height="130" rx="12" fill="#FDEDEC" stroke="#C0392B" stroke-width="3"/>
  <text x="830" y="160" font-size="24" font-weight="700" fill="#C0392B">ohasd 까지 내려갔다 (stop crs 상태)</text>
  <text x="830" y="205" font-size="22" fill="#212F3D">-init 조회도 실패. crsctl start crs 로 올린다</text>
  <path d="M600 395 L795 395" stroke="#C0392B" stroke-width="3" marker-end="url(#a)"/>
  <rect x="800" y="330" width="720" height="130" rx="12" fill="#FDEDEC" stroke="#C0392B" stroke-width="3"/>
  <text x="830" y="380" font-size="24" font-weight="700" fill="#C0392B">crsd 이하만 내려갔다 (stop cluster 상태)</text>
  <text x="830" y="425" font-size="22" fill="#212F3D">-init 조회는 된다. srvctl 은 PRKH-1010 · 3003</text>
  <path d="M600 615 L795 615" stroke="#34495E" stroke-width="3" marker-end="url(#a)"/>
  <rect x="800" y="550" width="720" height="130" rx="12" fill="#fff" stroke="#34495E" stroke-width="3"/>
  <text x="830" y="600" font-size="24" font-weight="700" fill="#212F3D">rac2 Inactive → 그 노드만의 문제</text>
  <text x="830" y="645" font-size="22" fill="#212F3D">다른 노드에서도 실패 → 클러스터 전체 문제</text>
  <rect x="80" y="730" width="1440" height="120" rx="12" fill="#fff" stroke="#5D6D7E" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="120" y="780" font-size="24" fill="#212F3D">통신 오류와 이름 오류를 섞지 않는다</text>
  <text x="120" y="822" font-size="22" fill="#5D6D7E">CRS-2613 은 자원 이름이 틀린 것 · CRS-4563 은 root 권한이 필요한 것 · 클러스터 상태와 무관</text>
</svg>
