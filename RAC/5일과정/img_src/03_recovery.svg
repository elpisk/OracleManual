<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Pretendard, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#34495E"/></marker></defs>
  <rect width="1600" height="900" fill="#fff"/>
  <text x="800" y="60" text-anchor="middle" font-size="36" font-weight="700" fill="#212F3D">OCR 전체 복원 — 배타 모드를 거친다</text>
  <rect x="60" y="110" width="1480" height="100" rx="12" fill="#FDEDEC" stroke="#C0392B" stroke-width="3"/>
  <text x="100" y="155" font-size="24" font-weight="700" fill="#C0392B">클러스터가 떠 있으면 PROT-19 — crsd 가 OCR 을 열어 두고 있다</text>
  <text x="100" y="190" font-size="22" fill="#212F3D">-restore · -import · -repair 모두 같은 벽에 막힌다</text>
  <g font-size="22" fill="#212F3D">
    <rect x="60" y="260" width="340" height="300" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
    <text x="230" y="310" text-anchor="middle" font-size="26" font-weight="700">1. 전 노드 정지</text>
    <text x="85" y="365" font-family="JetBrains Mono, monospace" font-size="20">crsctl stop crs</text>
    <text x="85" y="410">rac1, rac2 모두</text>
    <rect x="440" y="260" width="340" height="300" rx="12" fill="#D6EAF8" stroke="#2471A3" stroke-width="3"/>
    <text x="610" y="310" text-anchor="middle" font-size="26" font-weight="700" fill="#2471A3">2. 배타 모드</text>
    <text x="465" y="365" font-family="JetBrains Mono, monospace" font-size="20">crsctl start crs</text>
    <text x="465" y="395" font-family="JetBrains Mono, monospace" font-size="20">  -excl -nocrs</text>
    <text x="465" y="445">한 노드만, ASM 은 뜨고</text>
    <text x="465" y="480">crsd 는 뜨지 않는다</text>
    <rect x="820" y="260" width="340" height="300" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
    <text x="990" y="310" text-anchor="middle" font-size="26" font-weight="700">3. 복원 · 검증</text>
    <text x="845" y="365" font-family="JetBrains Mono, monospace" font-size="20">ocrconfig -restore</text>
    <text x="845" y="395" font-family="JetBrains Mono, monospace" font-size="20">  +CRS:/.../backup_…</text>
    <text x="845" y="445" font-family="JetBrains Mono, monospace" font-size="20">ocrcheck</text>
    <text x="845" y="490">ID 를 기록값과 대조</text>
    <rect x="1200" y="260" width="340" height="300" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
    <text x="1370" y="310" text-anchor="middle" font-size="26" font-weight="700">4. 정상 기동</text>
    <text x="1225" y="365" font-family="JetBrains Mono, monospace" font-size="20">crsctl stop crs -f</text>
    <text x="1225" y="410" font-family="JetBrains Mono, monospace" font-size="20">crsctl start crs</text>
    <text x="1225" y="460">모든 노드에서</text>
  </g>
  <path d="M400 410 L435 410" stroke="#34495E" stroke-width="3" marker-end="url(#a)"/>
  <path d="M780 410 L815 410" stroke="#34495E" stroke-width="3" marker-end="url(#a)"/>
  <path d="M1160 410 L1195 410" stroke="#34495E" stroke-width="3" marker-end="url(#a)"/>
  <rect x="60" y="610" width="1480" height="240" rx="12" fill="#fff" stroke="#5D6D7E" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="100" y="660" font-size="26" font-weight="700" fill="#212F3D">같은 틀의 다른 절차</text>
  <text x="100" y="710" font-size="22" fill="#212F3D">• Voting File 과반수 손실: 배타 모드 → crsctl replace votedisk +CRS</text>
  <text x="100" y="755" font-size="22" fill="#212F3D">• +CRS 소실: 디스크그룹 재생성 → replace votedisk → ocrconfig -restore</text>
  <text x="100" y="800" font-size="22" fill="#212F3D">• 다중화된 OCR 한 위치 손상: 클러스터를 내리지 않고 -delete 후 -add</text>
</svg>
