<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Pretendard, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5D6D7E"/></marker>
  <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker></defs>
  <rect width="1600" height="900" fill="#fff"/>
  <text x="800" y="60" text-anchor="middle" font-size="36" font-weight="700" fill="#212F3D">Clusterware 의 두 스택 — 노드 rac1</text>
  <rect x="80" y="110" width="980" height="300" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <text x="110" y="160" font-size="30" font-weight="700" fill="#34495E">CRS 스택 (위층) — crsd</text>
  <text x="110" y="205" font-size="22" fill="#5D6D7E">조회: crsctl status resource -t · srvctl · olsnodes</text>
  <g font-size="22" fill="#212F3D">
    <rect x="110" y="235" width="290" height="70" rx="12" fill="#fff" stroke="#34495E" stroke-width="3"/><text x="255" y="278" text-anchor="middle">리스너 · SCAN 리스너</text>
    <rect x="420" y="235" width="290" height="70" rx="12" fill="#fff" stroke="#34495E" stroke-width="3"/><text x="565" y="278" text-anchor="middle">VIP · SCAN VIP · ONS</text>
    <rect x="730" y="235" width="300" height="70" rx="12" fill="#fff" stroke="#34495E" stroke-width="3"/><text x="880" y="278" text-anchor="middle">디스크그룹 · racdb</text>
  </g>
  <text x="110" y="370" font-size="22" fill="#212F3D">에이전트: orarootagent(root) · oraagent(grid, oracle)</text>
  <rect x="80" y="480" width="980" height="330" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <text x="110" y="530" font-size="30" font-weight="700" fill="#34495E">OHAS 스택 (아래층) — ohasd</text>
  <text x="110" y="575" font-size="22" fill="#5D6D7E">조회: crsctl check has · crsctl status resource -t -init</text>
  <g font-size="22" fill="#212F3D">
    <rect x="110" y="605" width="200" height="70" rx="12" fill="#fff" stroke="#34495E" stroke-width="3"/><text x="210" y="648" text-anchor="middle">ora.cssd</text>
    <rect x="330" y="605" width="200" height="70" rx="12" fill="#fff" stroke="#34495E" stroke-width="3"/><text x="430" y="648" text-anchor="middle">ora.asm</text>
    <rect x="550" y="605" width="230" height="70" rx="12" fill="#fff" stroke="#34495E" stroke-width="3"/><text x="665" y="648" text-anchor="middle">gpnpd · gipcd · evmd</text>
    <rect x="800" y="605" width="230" height="70" rx="12" fill="#FDEDEC" stroke="#C0392B" stroke-width="3"/><text x="915" y="648" text-anchor="middle" fill="#C0392B" font-weight="700">ora.crsd</text>
  </g>
  <text x="110" y="730" font-size="22" fill="#212F3D">ctssd · haip · diskmon(Exadata 전용, OFFLINE 정상)</text>
  <text x="110" y="775" font-size="22" fill="#5D6D7E">진입점: systemd → oracle-ohasd → init.ohasd</text>
  <path d="M915 605 L915 420" stroke="#C0392B" stroke-width="4" marker-end="url(#r)"/>
  <text x="935" y="455" font-size="22" fill="#C0392B" font-weight="700">위층 전체 = 자원 하나</text>
  <rect x="1130" y="150" width="400" height="230" rx="12" fill="#D6EAF8" stroke="#2471A3" stroke-width="3"/>
  <text x="1330" y="200" text-anchor="middle" font-size="30" font-weight="700" fill="#2471A3">OCR</text>
  <text x="1330" y="245" text-anchor="middle" font-size="22" fill="#212F3D">+CRS 디스크그룹 안</text>
  <text x="1330" y="285" text-anchor="middle" font-size="22" fill="#212F3D">클러스터 공유 1벌</text>
  <text x="1330" y="325" text-anchor="middle" font-size="22" fill="#212F3D">ASM 이 떠야 읽힌다</text>
  <rect x="1130" y="520" width="400" height="230" rx="12" fill="#D6EAF8" stroke="#2471A3" stroke-width="3"/>
  <text x="1330" y="570" text-anchor="middle" font-size="30" font-weight="700" fill="#2471A3">OLR</text>
  <text x="1330" y="615" text-anchor="middle" font-size="22" fill="#212F3D">로컬 파일, 노드마다 1벌</text>
  <text x="1330" y="652" text-anchor="middle" font-size="20" fill="#212F3D" font-family="JetBrains Mono, monospace">crsdata/rac1/olr/</text>
  <text x="1330" y="690" text-anchor="middle" font-size="22" fill="#212F3D">부팅 직후 바로 읽힌다</text>
  <path d="M1060 265 L1125 265" stroke="#5D6D7E" stroke-width="3" marker-end="url(#a)"/>
  <path d="M1060 635 L1125 635" stroke="#5D6D7E" stroke-width="3" marker-end="url(#a)"/>
  <text x="800" y="860" text-anchor="middle" font-size="24" fill="#5D6D7E">아래층 명령이 되고 위층 명령이 안 되면 crsd 이하가, 아래층도 안 되면 ohasd 가 문제다</text>
</svg>
