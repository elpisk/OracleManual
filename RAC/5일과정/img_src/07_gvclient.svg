<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Pretendard, sans-serif">
  <defs><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#34495E"/></marker></defs>
  <rect width="1600" height="900" fill="#fff"/>
  <text x="800" y="60" text-anchor="middle" font-size="36" font-weight="700" fill="#212F3D">V$ASM_CLIENT 는 한 노드, GV$ASM_CLIENT 는 두 노드</text>
  <rect x="80" y="110" width="660" height="470" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <text x="410" y="155" text-anchor="middle" font-size="30" font-weight="700" fill="#212F3D">rac1</text>
  <rect x="860" y="110" width="660" height="470" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <text x="1190" y="155" text-anchor="middle" font-size="30" font-weight="700" fill="#212F3D">rac2</text>
  <g font-size="24" text-anchor="middle">
    <rect x="120" y="180" width="270" height="80" rx="12" fill="#fff" stroke="#34495E" stroke-width="3"/><text x="255" y="230" fill="#212F3D">racdb1</text>
    <rect x="430" y="180" width="270" height="80" rx="12" fill="#fff" stroke="#34495E" stroke-width="3"/><text x="565" y="230" fill="#212F3D">CRS 데몬 (_OCR)</text>
    <rect x="900" y="180" width="270" height="80" rx="12" fill="#fff" stroke="#34495E" stroke-width="3"/><text x="1035" y="230" fill="#212F3D">racdb2</text>
    <rect x="1210" y="180" width="270" height="80" rx="12" fill="#fff" stroke="#34495E" stroke-width="3"/><text x="1345" y="230" fill="#212F3D">CRS 데몬 (_OCR)</text>
  </g>
  <rect x="200" y="350" width="420" height="120" rx="12" fill="#D6EAF8" stroke="#2471A3" stroke-width="3"/>
  <text x="410" y="400" text-anchor="middle" font-size="30" font-weight="700" fill="#2471A3">+ASM1</text>
  <text x="410" y="440" text-anchor="middle" font-size="22" fill="#212F3D">자기 SPFILE·암호 파일도 클라이언트</text>
  <rect x="980" y="350" width="420" height="120" rx="12" fill="#D6EAF8" stroke="#2471A3" stroke-width="3"/>
  <text x="1190" y="400" text-anchor="middle" font-size="30" font-weight="700" fill="#2471A3">+ASM2</text>
  <text x="1190" y="440" text-anchor="middle" font-size="22" fill="#212F3D">자기 SPFILE·암호 파일도 클라이언트</text>
  <path d="M255 260 L330 345" stroke="#34495E" stroke-width="3" marker-end="url(#g)"/>
  <path d="M565 260 L490 345" stroke="#34495E" stroke-width="3" marker-end="url(#g)"/>
  <path d="M1035 260 L1110 345" stroke="#34495E" stroke-width="3" marker-end="url(#g)"/>
  <path d="M1345 260 L1270 345" stroke="#34495E" stroke-width="3" marker-end="url(#g)"/>
  <text x="410" y="540" text-anchor="middle" font-size="23" fill="#5D6D7E">V$ASM_CLIENT @+ASM1 → 5행</text>
  <text x="1190" y="540" text-anchor="middle" font-size="23" fill="#5D6D7E">V$ASM_CLIENT @+ASM2 → 5행</text>
  <rect x="80" y="620" width="1440" height="230" rx="12" fill="#fff" stroke="#C0392B" stroke-width="3"/>
  <text x="120" y="670" font-size="28" font-weight="700" fill="#C0392B">GV$ASM_CLIENT → 10행 (INST_ID 1 과 2 가 대칭)</text>
  <g font-size="24" fill="#212F3D"><text x="120" y="720">• +ASM1 에서 V$ 로 보면 racdb2 가 없다 — 정상. racdb2 는 +ASM2 에 붙어 있다</text><text x="120" y="765">• INST_ID 2 쪽에 racdb2 가 없으면 이상 신호: 인스턴스 정지 또는 다른 ASM 에 접속</text><text x="120" y="810">• 노드가 응답하지 않는 진단 상황에서는 GV$ 조회가 걸릴 수 있다 → 노드별 V$</text></g>
</svg>
