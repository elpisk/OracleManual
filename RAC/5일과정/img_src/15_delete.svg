<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Pretendard, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker></defs>
  <rect width="1600" height="900" fill="#fff"/>
  <text x="800" y="58" text-anchor="middle" font-size="36" font-weight="700" fill="#212F3D">노드 삭제 — 위에 올린 것부터 내린다</text>
  <text x="200" y="120" text-anchor="middle" font-size="26" font-weight="700" fill="#5D6D7E">실행 위치</text>
  <g font-size="24">
    <rect x="80" y="145" width="240" height="100" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/><text x="200" y="205" text-anchor="middle" fill="#212F3D">rac1 · oracle</text>
    <rect x="80" y="275" width="240" height="100" rx="12" fill="#FDEDEC" stroke="#C0392B" stroke-width="3"/><text x="200" y="335" text-anchor="middle" fill="#212F3D">rac2 → rac1</text>
    <rect x="80" y="405" width="240" height="100" rx="12" fill="#FDEDEC" stroke="#C0392B" stroke-width="3"/><text x="200" y="465" text-anchor="middle" fill="#212F3D">rac2 · root</text>
    <rect x="80" y="535" width="240" height="100" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/><text x="200" y="595" text-anchor="middle" fill="#212F3D">rac1 · root</text>
    <rect x="80" y="665" width="240" height="100" rx="12" fill="#FDEDEC" stroke="#C0392B" stroke-width="3"/><text x="200" y="725" text-anchor="middle" fill="#212F3D">rac2 → rac1</text>
  </g>
  <g font-size="24" fill="#212F3D">
    <rect x="360" y="145" width="1160" height="100" rx="12" fill="#fff" stroke="#34495E" stroke-width="3"/>
    <text x="390" y="187" font-weight="700">① DB 인스턴스 삭제</text>
    <text x="390" y="225" font-size="22" font-family="JetBrains Mono, monospace">dbca -silent -deleteInstance -instanceName racdb2</text>
    <text x="1490" y="205" text-anchor="end" font-size="22" fill="#5D6D7E">스레드 2 · UNDOTBS2 제거</text>
    <rect x="360" y="275" width="1160" height="100" rx="12" fill="#fff" stroke="#34495E" stroke-width="3"/>
    <text x="390" y="317" font-weight="700">② DB 홈 삭제</text>
    <text x="390" y="355" font-size="22" font-family="JetBrains Mono, monospace">-updateNodeList -local → deinstall -local</text>
    <text x="1490" y="335" text-anchor="end" font-size="22" fill="#5D6D7E">남는 노드 목록 축소</text>
    <rect x="360" y="405" width="1160" height="100" rx="12" fill="#D6EAF8" stroke="#2471A3" stroke-width="3"/>
    <text x="390" y="447" font-weight="700">③ Clusterware 해제</text>
    <text x="390" y="485" font-size="22" font-family="JetBrains Mono, monospace">rootcrs.sh -deconfig -force</text>
    <text x="1490" y="465" text-anchor="end" font-size="22" fill="#C0392B">-lastnode 는 붙이지 않는다</text>
    <rect x="360" y="535" width="1160" height="100" rx="12" fill="#D6EAF8" stroke="#2471A3" stroke-width="3"/>
    <text x="390" y="577" font-weight="700">④ OCR 에서 노드 삭제</text>
    <text x="390" y="615" font-size="22" font-family="JetBrains Mono, monospace">crsctl delete node -n rac2</text>
    <text x="1490" y="595" text-anchor="end" font-size="22" fill="#5D6D7E">CRS-4661</text>
    <rect x="360" y="665" width="1160" height="100" rx="12" fill="#fff" stroke="#34495E" stroke-width="3"/>
    <text x="390" y="707" font-weight="700">⑤ 그리드 홈 삭제</text>
    <text x="390" y="745" font-size="22" font-family="JetBrains Mono, monospace">-updateNodeList -local → deinstall → rootdeinstall.sh</text>
    <text x="1490" y="725" text-anchor="end" font-size="22" fill="#5D6D7E">남는 노드 목록 축소</text>
  </g>
  <text x="800" y="830" text-anchor="middle" font-size="24" fill="#212F3D">삭제 내내 racdb1 은 Open — 단계마다 srvctl status database 로 확인</text>
  <text x="800" y="870" text-anchor="middle" font-size="22" fill="#5D6D7E">사후 점검: cluvfy stage -post nodedel -n rac2 (삭제 사전 점검은 없다)</text>
</svg>
