<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Pretendard, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5D6D7E"/></marker></defs>
  <rect width="1600" height="900" fill="#fff"/>
  <text x="800" y="58" text-anchor="middle" font-size="36" font-weight="700" fill="#212F3D">인스턴스 이름은 이렇게 바뀌었다</text>
  <g font-size="22" fill="#212F3D">
    <text x="300" y="120" text-anchor="middle" font-weight="700" fill="#5D6D7E">시점</text>
    <text x="760" y="120" text-anchor="middle" font-weight="700" fill="#5D6D7E">구성(srvctl config)</text>
    <text x="1180" y="120" text-anchor="middle" font-weight="700" fill="#5D6D7E">실제(pmon)</text>
    <text x="1440" y="120" text-anchor="middle" font-weight="700" fill="#5D6D7E">노드</text>
  </g>
  <g font-size="22" fill="#212F3D">
    <rect x="60" y="140" width="1480" height="70" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="2"/>
    <text x="90" y="183">변환 전 (RAC)</text><text x="760" y="183" text-anchor="middle">racdb1, racdb2</text><text x="1180" y="183" text-anchor="middle">racdb1, racdb2</text><text x="1440" y="183" text-anchor="middle">rac1, rac2</text>
    <rect x="60" y="225" width="1480" height="70" rx="12" fill="#FDEDEC" stroke="#C0392B" stroke-width="3"/>
    <text x="90" y="268">RAC One Node 변환 직후</text><text x="760" y="268" text-anchor="middle" fill="#C0392B">racdb_1</text><text x="1180" y="268" text-anchor="middle" fill="#C0392B">racdb1</text><text x="1440" y="268" text-anchor="middle">rac1</text>
    <rect x="60" y="310" width="1480" height="70" rx="12" fill="#fff" stroke="#34495E" stroke-width="2"/>
    <text x="90" y="353">rac2 로 재배치 후</text><text x="760" y="353" text-anchor="middle">racdb_2</text><text x="1180" y="353" text-anchor="middle">racdb_2</text><text x="1440" y="353" text-anchor="middle">rac2</text>
    <rect x="60" y="395" width="1480" height="70" rx="12" fill="#fff" stroke="#34495E" stroke-width="2"/>
    <text x="90" y="438">rac1 로 재배치 후</text><text x="760" y="438" text-anchor="middle">racdb_1</text><text x="1180" y="438" text-anchor="middle">racdb_1</text><text x="1440" y="438" text-anchor="middle">rac1</text>
    <rect x="60" y="480" width="1480" height="70" rx="12" fill="#fff" stroke="#34495E" stroke-width="2"/>
    <text x="90" y="523">RAC 로 변환 직후</text><text x="760" y="523" text-anchor="middle">racdb_1</text><text x="1180" y="523" text-anchor="middle">racdb_1</text><text x="1440" y="523" text-anchor="middle">rac1</text>
    <rect x="60" y="565" width="1480" height="70" rx="12" fill="#FDEDEC" stroke="#C0392B" stroke-width="3"/>
    <text x="90" y="608">racdb2 만 추가</text><text x="760" y="608" text-anchor="middle" fill="#C0392B">racdb2, racdb_1 (섞임)</text><text x="1180" y="608" text-anchor="middle">racdb_1</text><text x="1440" y="608" text-anchor="middle">rac1</text>
    <rect x="60" y="650" width="1480" height="70" rx="12" fill="#E9F7EF" stroke="#27AE60" stroke-width="3"/>
    <text x="90" y="693">이름 원복 후</text><text x="760" y="693" text-anchor="middle">racdb1, racdb2</text><text x="1180" y="693" text-anchor="middle">racdb1, racdb2</text><text x="1440" y="693" text-anchor="middle">rac1, rac2</text>
  </g>
  <text x="80" y="780" font-size="24" fill="#212F3D">• 빨간 두 줄은 오류 없이 지나갔다 — srvctl config 와 status 를 함께 봐야 드러난다</text>
  <text x="80" y="830" font-size="24" fill="#212F3D">• SPFILE 의 racdb1. · racdb2. 항목은 이름에 묶여 있어 racdb_N 에는 적용되지 않는다</text>
</svg>
