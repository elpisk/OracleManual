<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Pretendard, sans-serif">
  <rect width="1600" height="900" fill="#fff"/>
  <text x="800" y="60" text-anchor="middle" font-size="36" font-weight="700" fill="#212F3D">두 홈과 두 ORACLE_BASE — rac1</text>
  <rect x="60" y="110" width="720" height="620" rx="12" fill="#D6EAF8" stroke="#2471A3" stroke-width="3"/>
  <text x="420" y="160" text-anchor="middle" font-size="30" font-weight="700" fill="#2471A3">grid 계정 — Clusterware · ASM</text>
  <g font-size="22" fill="#212F3D">
    <text x="95" y="215">ORACLE_HOME</text>
    <text x="95" y="295">ORACLE_BASE</text>
    <text x="95" y="375">ORACLE_SID</text>
    <text x="95" y="455">진단 로그</text>
  </g>
  <g font-family="JetBrains Mono, monospace" font-size="21" fill="#212F3D">
    <text x="115" y="250">/u01/app/19.3.0/grid</text>
    <text x="115" y="330">/u01/app/grid</text>
    <text x="115" y="410">+ASM1</text>
    <text x="115" y="490">/u01/app/grid/diag/</text>
    <text x="135" y="525">crs/rac1/crs</text>
    <text x="135" y="560">asm/+asm/+ASM1</text>
    <text x="135" y="595">tnslsnr/rac1/listener_scan1</text>
  </g>
  <text x="95" y="660" font-size="22" fill="#5D6D7E">Grid 홈은 ORACLE_BASE 의 하위가 아니다</text>
  <text x="95" y="700" font-size="22" fill="#5D6D7E">bin: crsctl · srvctl · oifcfg · asmcmd</text>
  <rect x="820" y="110" width="720" height="620" rx="12" fill="#FDEDEC" stroke="#C0392B" stroke-width="3"/>
  <text x="1180" y="160" text-anchor="middle" font-size="30" font-weight="700" fill="#C0392B">oracle 계정 — 데이터베이스</text>
  <g font-size="22" fill="#212F3D">
    <text x="855" y="215">ORACLE_HOME</text>
    <text x="855" y="330">ORACLE_BASE</text>
    <text x="855" y="410">ORACLE_SID</text>
    <text x="855" y="490">진단 로그</text>
  </g>
  <g font-family="JetBrains Mono, monospace" font-size="21" fill="#212F3D">
    <text x="875" y="250">/u01/app/oracle/product/</text>
    <text x="875" y="282">  19.3.0/dbhome_rac</text>
    <text x="875" y="365">/u01/app/oracle</text>
    <text x="875" y="445">racdb1</text>
    <text x="875" y="525">/u01/app/oracle/diag/</text>
    <text x="895" y="560">rdbms/racdb/racdb1</text>
  </g>
  <text x="855" y="660" font-size="22" fill="#5D6D7E">DB 홈은 ORACLE_BASE 아래에 있다</text>
  <text x="855" y="700" font-size="22" fill="#5D6D7E">bin: sqlplus · srvctl · rman</text>
  <rect x="60" y="760" width="1480" height="100" rx="12" fill="#fff" stroke="#5D6D7E" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="800" y="805" text-anchor="middle" font-size="24" fill="#212F3D">adrci 는 실행 계정의 ORACLE_BASE 아래만 보여 준다 — Clusterware 진단은 grid 로</text>
  <text x="800" y="842" text-anchor="middle" font-size="22" fill="#5D6D7E">rac2 에서는 SID 가 +ASM2, racdb2 · 노드 이름이 경로에 들어간다</text>
</svg>
