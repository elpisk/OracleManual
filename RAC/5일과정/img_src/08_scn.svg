  <path d="M540 600 L575 600" stroke="#34495E" stroke-width="3" marker-end="url(#g)"/>
  <path d="M1020 600 L1055 600" stroke="#34495E" stroke-width="3" marker-end="url(#g)"/>
  <rect x="100" y="740" width="1400" height="120" rx="12" fill="#FDEDEC" stroke="#C0392B" stroke-width="3"/>
  <text x="140" y="787" font-size="24" fill="#212F3D">• NOARCHIVELOG: 필요한 리두가 온라인 로그에 남아 있을 때만 복구된다</text>
  <text x="140" y="830" font-size="24" fill="#212F3D">• 예방: 복사부터 SWITCH 까지 OFFLINE 을 유지하면 SCN 이 벌어지지 않는다</text>
