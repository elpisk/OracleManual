<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Pretendard, sans-serif">
  <defs><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#34495E"/></marker>
  <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker></defs>
  <rect width="1600" height="900" fill="#fff"/>
  <text x="800" y="60" text-anchor="middle" font-size="36" font-weight="700" fill="#212F3D">순서를 어겼을 때 — 사본이 뒤처진다</text>
  <line x1="100" y1="300" x2="1500" y2="300" stroke="#34495E" stroke-width="4" marker-end="url(#g)"/>
  <text x="1500" y="345" text-anchor="end" font-size="22" fill="#5D6D7E">SCN 증가 →</text>
  <circle cx="300" cy="300" r="14" fill="#2471A3"/>
