    <text x="320" y="600" text-anchor="middle" font-size="22" fill="#C0392B">RMAN-06572</text>
    <text x="320" y="645" text-anchor="middle" font-size="21" fill="#212F3D">OFFLINE 후 다시 SWITCH</text>
    <rect x="580" y="500" width="440" height="200" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
    <text x="800" y="550" text-anchor="middle" font-weight="700" fill="#212F3D">② ONLINE 시도</text>
    <text x="800" y="600" text-anchor="middle" font-size="22" fill="#C0392B">ORA-01113 needs media recovery</text>
    <text x="800" y="645" text-anchor="middle" font-size="21" fill="#212F3D">조회는 ORA-00376</text>
    <rect x="1060" y="500" width="440" height="200" rx="12" fill="#ECF0F1" stroke="#27AE60" stroke-width="3"/>
    <text x="1280" y="550" text-anchor="middle" font-weight="700" fill="#27AE60">③ RECOVER DATAFILE 23</text>
