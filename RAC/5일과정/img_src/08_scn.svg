  <text x="300" y="360" text-anchor="middle" font-size="22" fill="#212F3D">Ckp SCN 3993926</text>
  <rect x="380" y="200" width="760" height="70" rx="12" fill="#FDEDEC" stroke="#C0392B" stroke-width="3"/>
  <text x="760" y="245" text-anchor="middle" font-size="24" fill="#C0392B" font-weight="700">실수: SWITCH 전에 ONLINE → 변경이 계속 쌓인다</text>
  <circle cx="1200" cy="300" r="14" fill="#C0392B"/>
  <text x="1200" y="250" text-anchor="middle" font-size="24" font-weight="700" fill="#C0392B">DB 현재</text>
  <text x="1200" y="360" text-anchor="middle" font-size="22" fill="#212F3D">CURRENT_SCN 3994002</text>
  <path d="M310 400 L1190 400" stroke="#C0392B" stroke-width="3" marker-end="url(#r)"/>
  <text x="750" y="440" text-anchor="middle" font-size="24" fill="#C0392B">차이 76 — 사본에 없는 변경</text>
  <g font-size="24">
    <rect x="100" y="500" width="440" height="200" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
