<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Pretendard, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#34495E"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#fff"/>
  <text x="800" y="58" text-anchor="middle" font-size="36" font-weight="700" fill="#212F3D">공유하는 것과 인스턴스별로 나누는 것</text>
  <rect x="120" y="100" width="440" height="110" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <text x="340" y="148" text-anchor="middle" font-size="30" font-weight="700" fill="#212F3D">racdb1</text>
  <text x="340" y="186" text-anchor="middle" font-size="22" fill="#5D6D7E">rac1 · thread 1</text>
  <rect x="1040" y="100" width="440" height="110" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <text x="1260" y="148" text-anchor="middle" font-size="30" font-weight="700" fill="#212F3D">racdb2</text>
  <text x="1260" y="186" text-anchor="middle" font-size="22" fill="#5D6D7E">rac2 · thread 2</text>
  <rect x="80" y="280" width="1440" height="450" rx="12" fill="#D6EAF8" stroke="#2471A3" stroke-width="3"/>
  <text x="1490" y="712" text-anchor="end" font-size="24" font-weight="700" fill="#2471A3">+DATA · +FRA 공유 디스크그룹</text>
  <rect x="120" y="345" width="400" height="230" rx="12" fill="#fff" stroke="#2471A3" stroke-width="3"/>
  <text x="320" y="390" text-anchor="middle" font-size="26" font-weight="700" fill="#212F3D">racdb1 전용</text>
  <text x="320" y="440" text-anchor="middle" font-size="24" fill="#212F3D">리두 thread 1</text>
  <text x="320" y="475" text-anchor="middle" font-size="22" fill="#5D6D7E">그룹 1 · 2</text>
  <text x="320" y="525" text-anchor="middle" font-size="24" fill="#212F3D">UNDOTBS1</text>
  <rect x="600" y="345" width="400" height="230" rx="12" fill="#fff" stroke="#2471A3" stroke-width="3"/>
  <text x="800" y="390" text-anchor="middle" font-size="26" font-weight="700" fill="#212F3D">모두 공유</text>
  <text x="800" y="435" text-anchor="middle" font-size="24" fill="#212F3D">데이터 파일 · 데이터 사전</text>
  <text x="800" y="472" text-anchor="middle" font-size="24" fill="#212F3D">컨트롤 파일 · SPFILE</text>
  <text x="800" y="509" text-anchor="middle" font-size="24" fill="#212F3D">TEMP</text>
  <text x="800" y="546" text-anchor="middle" font-size="22" fill="#5D6D7E">(익스텐트는 인스턴스별 확보)</text>
  <rect x="1080" y="345" width="400" height="230" rx="12" fill="#fff" stroke="#2471A3" stroke-width="3"/>
  <text x="1280" y="390" text-anchor="middle" font-size="26" font-weight="700" fill="#212F3D">racdb2 전용</text>
  <text x="1280" y="440" text-anchor="middle" font-size="24" fill="#212F3D">리두 thread 2</text>
  <text x="1280" y="475" text-anchor="middle" font-size="22" fill="#5D6D7E">그룹 3 · 4</text>
  <text x="1280" y="525" text-anchor="middle" font-size="24" fill="#212F3D">UNDOTBS2</text>
  <line x1="320" y1="210" x2="320" y2="340" stroke="#34495E" stroke-width="3" marker-end="url(#a)"/>
  <line x1="460" y1="210" x2="700" y2="340" stroke="#34495E" stroke-width="3" marker-end="url(#a)"/>
  <line x1="1280" y1="210" x2="1280" y2="340" stroke="#34495E" stroke-width="3" marker-end="url(#a)"/>
  <line x1="1140" y1="210" x2="900" y2="340" stroke="#34495E" stroke-width="3" marker-end="url(#a)"/>
  <path d="M320 578 C320 680, 1280 680, 1280 582" fill="none" stroke="#C0392B" stroke-width="3" stroke-dasharray="10 6" marker-end="url(#r)"/>
  <text x="120" y="712" font-size="22" fill="#C0392B" font-weight="700">장애 때 살아 있는 인스턴스가 상대 스레드를 읽어 인스턴스 복구</text>
  <text x="120" y="795" font-size="26" fill="#212F3D"><tspan font-weight="700">나눈다</tspan> — 순차 쓰기(리두), 배타적 배정(UNDO)</text>
  <text x="120" y="845" font-size="26" fill="#212F3D"><tspan font-weight="700">공유한다</tspan> — 구조 정보, 데이터, 익스텐트 단위로 할당하는 TEMP</text>
</svg>
