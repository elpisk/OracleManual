<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Pretendard, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5D6D7E"/></marker></defs>
  <rect width="1600" height="900" fill="#fff"/>
  <text x="800" y="58" text-anchor="middle" font-size="36" font-weight="700" fill="#212F3D">잔재가 남은 노드에 다시 넣을 수 있는가</text>
  <rect x="500" y="100" width="600" height="90" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <text x="800" y="155" text-anchor="middle" font-size="26" font-weight="700" fill="#212F3D">rac2 에 Clusterware 구성이 남았는가?</text>
  <rect x="80" y="260" width="620" height="150" rx="12" fill="#fff" stroke="#34495E" stroke-width="3"/>
  <text x="390" y="310" text-anchor="middle" font-size="24" font-weight="700" fill="#212F3D">rac1 의 olsnodes 에 rac2 가 있다</text>
  <text x="390" y="355" text-anchor="middle" font-size="22" fill="#5D6D7E">OCR 에 항목이 남음</text>
  <text x="390" y="390" text-anchor="middle" font-size="22" fill="#C0392B" font-family="JetBrains Mono, monospace">crsctl delete node -n rac2</text>
  <rect x="900" y="260" width="620" height="150" rx="12" fill="#fff" stroke="#34495E" stroke-width="3"/>
  <text x="1210" y="310" text-anchor="middle" font-size="24" font-weight="700" fill="#212F3D">rac2 에 /etc/init.d/ohasd 가 있다</text>
  <text x="1210" y="355" text-anchor="middle" font-size="22" fill="#5D6D7E">root.sh 가 중간까지 진행됨</text>
  <text x="1210" y="390" text-anchor="middle" font-size="22" fill="#C0392B" font-family="JetBrains Mono, monospace">rootcrs.sh -deconfig -force</text>
  <path d="M650 190 L420 255" stroke="#5D6D7E" stroke-width="3" marker-end="url(#a)"/>
  <path d="M950 190 L1180 255" stroke="#5D6D7E" stroke-width="3" marker-end="url(#a)"/>
  <rect x="80" y="480" width="1440" height="130" rx="12" fill="#E9F7EF" stroke="#27AE60" stroke-width="3"/>
  <text x="800" y="530" text-anchor="middle" font-size="26" font-weight="700" fill="#27AE60">둘 다 아니면 파일만 남은 것 — addnode.sh 를 다시 돌려 덮어쓴다</text>
  <text x="800" y="575" text-anchor="middle" font-size="22" fill="#212F3D">INS-40111(ORACLE_BASE 비어 있지 않음) · INS-43055(홈 자리 미등록·비어 있지 않음) 는 WARNING</text>
  <path d="M800 190 L800 475" stroke="#5D6D7E" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#a)"/>
  <rect x="80" y="660" width="700" height="180" rx="12" fill="#FDEDEC" stroke="#C0392B" stroke-width="3"/>
  <text x="430" y="710" text-anchor="middle" font-size="24" font-weight="700" fill="#C0392B">반쪽 홈 (복사 20% 에서 중단)</text>
  <text x="430" y="755" text-anchor="middle" font-size="22" fill="#212F3D">3.1GB / 정상 6.4GB, root.sh 는 있고 crsctl 은 없음</text>
  <text x="430" y="795" text-anchor="middle" font-size="22" fill="#212F3D">root.sh 안내가 없었으면 실행하지 않는다</text>
  <rect x="820" y="660" width="700" height="180" rx="12" fill="#fff" stroke="#B9770E" stroke-width="3"/>
  <text x="1170" y="710" text-anchor="middle" font-size="24" font-weight="700" fill="#B9770E">cvuqdisk RPM 없음</text>
  <text x="1170" y="755" text-anchor="middle" font-size="22" fill="#212F3D">PRVG-11550 — Device Checks for ASM 실패</text>
  <text x="1170" y="795" text-anchor="middle" font-size="22" fill="#212F3D">rac1 의 grid/cv/rpm 에서 다시 설치</text>
</svg>
