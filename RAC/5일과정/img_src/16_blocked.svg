<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Pretendard, sans-serif">
  <rect width="1600" height="900" fill="#fff"/>
  <text x="800" y="58" text-anchor="middle" font-size="36" font-weight="700" fill="#212F3D">재배치 중(Online relocation: ACTIVE)에 다른 명령을 내면</text>
  <rect x="500" y="100" width="600" height="90" rx="12" fill="#D6EAF8" stroke="#2471A3" stroke-width="3"/>
  <text x="800" y="140" text-anchor="middle" font-size="24" font-weight="700" fill="#2471A3">세션 A: relocate -node rac1 진행 중</text>
  <text x="800" y="175" text-anchor="middle" font-size="22" fill="#212F3D">Source racdb_2 on rac2 → Destination racdb_1 on rac1</text>
  <g font-size="22" fill="#212F3D">
    <rect x="60" y="240" width="720" height="140" rx="12" fill="#E9F7EF" stroke="#27AE60" stroke-width="3"/>
    <text x="90" y="285" font-size="24" font-weight="700" fill="#27AE60">가능 · srvctl status database -v</text>
    <text x="90" y="330">진행 상태와 출발·목적지 인스턴스를 본다</text>
    <rect x="820" y="240" width="720" height="140" rx="12" fill="#FDEDEC" stroke="#C0392B" stroke-width="3"/>
    <text x="850" y="285" font-size="24" font-weight="700" fill="#C0392B">거부 · srvctl relocate database</text>
    <text x="850" y="330">PRCD-1161 (겉) + PRCD-1164 (원인: 이미 진행 중)</text>
    <text x="850" y="362" fill="#5D6D7E">세션 A 의 재배치가 실패한 것이 아니다</text>
    <rect x="60" y="410" width="720" height="140" rx="12" fill="#FDEDEC" stroke="#C0392B" stroke-width="3"/>
    <text x="90" y="455" font-size="24" font-weight="700" fill="#C0392B">거부 · srvctl stop database</text>
    <text x="90" y="500">PRKO-2143 — 재배치를 마치거나 -abort 후 정지</text>
    <rect x="820" y="410" width="720" height="140" rx="12" fill="#fff" stroke="#B9770E" stroke-width="3"/>
    <text x="850" y="455" font-size="24" font-weight="700" fill="#B9770E">가능 · srvctl modify database -timeout 10</text>
    <text x="850" y="500">진행 중인 재배치에 바로 반영된다</text>
    <text x="850" y="532" fill="#5D6D7E">대기 문구 30 minutes → 10 minutes</text>
  </g>
  <rect x="60" y="600" width="1480" height="240" rx="12" fill="#fff" stroke="#5D6D7E" stroke-width="2"/>
  <text x="100" y="650" font-size="26" font-weight="700" fill="#212F3D">운영 규칙</text>
  <g font-size="24" fill="#212F3D">
    <text x="100" y="700">• 재배치는 데이터베이스당 하나. 오류 묶음은 아래 줄이 원인이다</text>
    <text x="100" y="745">• 재배치 중에는 그 데이터베이스의 srvctl modify 도 하지 않는다 — 남의 작업 값이 바뀐다</text>
    <text x="100" y="790">• 실패해 FAILED 로 남으면 relocate -abort (관리자 관리형은 -revert 도 함께)</text>
  </g>
</svg>
