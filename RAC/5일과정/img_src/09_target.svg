<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Pretendard, sans-serif">
  <rect width="1600" height="900" fill="#fff"/>
  <text x="800" y="60" text-anchor="middle" font-size="36" font-weight="700" fill="#212F3D">Clusterware 는 도구가 아니라 종료 방식을 본다</text>
  <g font-size="22" fill="#5D6D7E" font-weight="700" text-anchor="middle"><text x="250" y="125">종료 방식</text><text x="680" y="125">TARGET</text><text x="960" y="125">STATE</text><text x="1310" y="125">Clusterware</text></g>
  <rect x="60" y="145" width="1480" height="150" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <text x="250" y="210" text-anchor="middle" font-size="26" font-weight="700" fill="#212F3D">srvctl stop instance</text>
  <text x="250" y="250" text-anchor="middle" font-size="21" fill="#5D6D7E">정상 종료</text>
  <text x="680" y="230" text-anchor="middle" font-size="26" font-weight="700" fill="#5D6D7E">OFFLINE</text>
  <text x="960" y="230" text-anchor="middle" font-size="26" font-weight="700" fill="#5D6D7E">OFFLINE</text>
  <text x="1310" y="220" text-anchor="middle" font-size="24" fill="#212F3D">일치 → 그대로 둔다</text>
  <text x="1310" y="258" text-anchor="middle" font-size="20" fill="#5D6D7E">재부팅해도 안 올라옴</text>
  <rect x="60" y="315" width="1480" height="150" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <text x="250" y="380" text-anchor="middle" font-size="23" font-weight="700" fill="#212F3D">SQL*Plus shutdown immediate</text>
  <text x="250" y="420" text-anchor="middle" font-size="21" fill="#5D6D7E">정상 종료 — 에이전트가 감지</text>
  <text x="680" y="400" text-anchor="middle" font-size="26" font-weight="700" fill="#5D6D7E">OFFLINE</text>
  <text x="960" y="400" text-anchor="middle" font-size="26" font-weight="700" fill="#5D6D7E">OFFLINE</text>
  <text x="1310" y="390" text-anchor="middle" font-size="24" fill="#212F3D">일치 → 그대로 둔다</text>
  <text x="1310" y="428" text-anchor="middle" font-size="20" fill="#5D6D7E">100초 관찰, pmon 0개</text>
  <rect x="60" y="485" width="1480" height="170" rx="12" fill="#FDEDEC" stroke="#C0392B" stroke-width="3"/>
  <text x="250" y="555" text-anchor="middle" font-size="26" font-weight="700" fill="#C0392B">kill -9 pmon</text>
  <text x="250" y="595" text-anchor="middle" font-size="21" fill="#5D6D7E">비정상 종료</text>
  <text x="680" y="575" text-anchor="middle" font-size="26" font-weight="700" fill="#27AE60">ONLINE</text>
  <text x="960" y="555" text-anchor="middle" font-size="22" fill="#C0392B">OFFLINE</text>
  <text x="960" y="590" text-anchor="middle" font-size="22" fill="#212F3D">→ STARTING (20초)</text>
  <text x="960" y="625" text-anchor="middle" font-size="22" fill="#27AE60">→ ONLINE (61초)</text>
  <text x="1310" y="560" text-anchor="middle" font-size="24" fill="#C0392B" font-weight="700">어긋남 → 다시 올린다</text>
  <text x="1310" y="600" text-anchor="middle" font-size="20" fill="#212F3D">RESTART_ATTEMPTS=2</text>
  <text x="1310" y="630" text-anchor="middle" font-size="20" fill="#212F3D">UPTIME_THRESHOLD=1h</text>
  <rect x="60" y="690" width="1480" height="170" rx="12" fill="#fff" stroke="#5D6D7E" stroke-width="2"/>
  <text x="100" y="738" font-size="24" fill="#212F3D">• TARGET = Clusterware 가 유지하려는 상태, STATE = 지금 실제 상태</text>
  <text x="100" y="783" font-size="24" fill="#212F3D">• 그래도 srvctl: 의존 자원(서비스) 처리 · 어느 노드에서나 실행 · -drain_timeout</text>
  <text x="100" y="828" font-size="24" fill="#212F3D">• srvctl 로 내린 것은 srvctl 로 올려야 TARGET 이 ONLINE 으로 돌아온다</text>
</svg>
