<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Pretendard, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2471A3"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#fff"/>
  <text x="800" y="58" text-anchor="middle" font-size="36" font-weight="700" fill="#212F3D">노드 분산 백업 — 채널마다 노드 VIP 로 접속한다</text>
  <rect x="520" y="100" width="560" height="150" rx="12" fill="#fff" stroke="#5D6D7E" stroke-width="3"/>
  <text x="800" y="145" text-anchor="middle" font-size="28" font-weight="700" fill="#212F3D">RMAN (rac1 에서 실행)</text>
  <text x="800" y="185" text-anchor="middle" font-size="22" fill="#212F3D" font-family="JetBrains Mono, monospace">allocate channel ch1 ... @rac1-vip</text>
  <text x="800" y="220" text-anchor="middle" font-size="22" fill="#212F3D" font-family="JetBrains Mono, monospace">allocate channel ch2 ... @rac2-vip</text>
  <rect x="100" y="330" width="560" height="230" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <text x="380" y="380" text-anchor="middle" font-size="30" font-weight="700" fill="#212F3D">rac1</text>
  <text x="380" y="420" text-anchor="middle" font-size="22" fill="#5D6D7E">로컬 리스너 · rac1-vip .111</text>
  <text x="380" y="470" text-anchor="middle" font-size="24" fill="#212F3D">racdb1 서버 프로세스</text>
  <text x="380" y="515" text-anchor="middle" font-size="22" fill="#C0392B" font-family="JetBrains Mono, monospace">ch1: instance=racdb1</text>
  <rect x="940" y="330" width="560" height="230" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <text x="1220" y="380" text-anchor="middle" font-size="30" font-weight="700" fill="#212F3D">rac2</text>
  <text x="1220" y="420" text-anchor="middle" font-size="22" fill="#5D6D7E">로컬 리스너 · rac2-vip .112</text>
  <text x="1220" y="470" text-anchor="middle" font-size="24" fill="#212F3D">racdb2 서버 프로세스</text>
  <text x="1220" y="515" text-anchor="middle" font-size="22" fill="#C0392B" font-family="JetBrains Mono, monospace">ch2: instance=racdb2</text>
  <path d="M640 250 L460 325" stroke="#C0392B" stroke-width="4" marker-end="url(#a)"/>
  <path d="M960 250 L1140 325" stroke="#C0392B" stroke-width="4" marker-end="url(#a)"/>
  <rect x="100" y="650" width="560" height="190" rx="12" fill="#D6EAF8" stroke="#2471A3" stroke-width="3"/>
  <text x="380" y="700" text-anchor="middle" font-size="28" font-weight="700" fill="#2471A3">+DATA 데이터 파일</text>
  <text x="380" y="745" text-anchor="middle" font-size="22" fill="#212F3D">RMAN 이 파일을 두 채널에 나눠 준다</text>
  <text x="380" y="785" text-anchor="middle" font-size="22" fill="#5D6D7E">어느 채널이든 모든 파일을 읽을 수 있다</text>
  <rect x="940" y="650" width="560" height="190" rx="12" fill="#D6EAF8" stroke="#2471A3" stroke-width="3"/>
  <text x="1220" y="700" text-anchor="middle" font-size="28" font-weight="700" fill="#2471A3">+FRA 백업셋</text>
  <text x="1220" y="745" text-anchor="middle" font-size="22" fill="#212F3D">두 채널의 백업 조각이 한곳에 모인다</text>
  <text x="1220" y="785" text-anchor="middle" font-size="22" fill="#5D6D7E">자동 백업(컨트롤 파일·SPFILE)도 여기</text>
  <line x1="380" y1="645" x2="380" y2="565" stroke="#2471A3" stroke-width="4" marker-end="url(#b)"/>
  <line x1="1220" y1="565" x2="1220" y2="645" stroke="#2471A3" stroke-width="4" marker-end="url(#b)"/>
  <line x1="660" y1="500" x2="935" y2="700" stroke="#2471A3" stroke-width="4" marker-end="url(#b)"/>
  <rect x="690" y="420" width="220" height="70" rx="12" fill="#fff" stroke="#5D6D7E" stroke-width="2"/>
  <text x="800" y="465" text-anchor="middle" font-size="22" fill="#212F3D">SCAN 은 쓰지 않는다</text>
</svg>
