<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Pretendard, sans-serif">
  <defs><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker>
  <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5D6D7E"/></marker></defs>
  <rect width="1600" height="900" fill="#fff"/>
  <text x="800" y="60" text-anchor="middle" font-size="36" font-weight="700" fill="#212F3D">Cache Fusion — 블록이 디스크를 거치지 않고 노드를 건넌다</text>
  <rect x="80" y="130" width="560" height="420" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <text x="360" y="180" text-anchor="middle" font-size="30" font-weight="700" fill="#212F3D">racdb1 (rac1)</text>
  <rect x="140" y="220" width="440" height="110" rx="10" fill="#FDEDEC" stroke="#C0392B" stroke-width="3"/>
  <text x="360" y="265" text-anchor="middle" font-size="26" font-weight="700" fill="#C0392B">블록 #120 (current)</text>
  <text x="360" y="305" text-anchor="middle" font-size="22" fill="#212F3D">UPDATE 후 커밋 · 아직 디스크에 안 씀</text>
  <rect x="140" y="370" width="440" height="140" rx="10" fill="#fff" stroke="#34495E" stroke-width="2"/>
  <text x="360" y="415" text-anchor="middle" font-size="24" font-weight="700" fill="#212F3D">LMS 프로세스</text>
  <text x="360" y="455" text-anchor="middle" font-size="22" fill="#5D6D7E">요청을 받아 블록을 보낸다</text>
  <text x="360" y="488" text-anchor="middle" font-size="22" fill="#5D6D7E">gc cr/current blocks served</text>
  <rect x="960" y="130" width="560" height="420" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <text x="1240" y="180" text-anchor="middle" font-size="30" font-weight="700" fill="#212F3D">racdb2 (rac2)</text>
  <rect x="1020" y="220" width="440" height="110" rx="10" fill="#fff" stroke="#34495E" stroke-width="2"/>
  <text x="1240" y="265" text-anchor="middle" font-size="26" font-weight="700" fill="#212F3D">SELECT … 블록 #120</text>
  <text x="1240" y="305" text-anchor="middle" font-size="22" fill="#5D6D7E">버퍼 캐시에 없다</text>
  <rect x="1020" y="370" width="440" height="140" rx="10" fill="#E9F7EF" stroke="#27AE60" stroke-width="3"/>
  <text x="1240" y="415" text-anchor="middle" font-size="24" font-weight="700" fill="#1E8449">블록 #120 (CR 사본)</text>
  <text x="1240" y="455" text-anchor="middle" font-size="22" fill="#5D6D7E">대기 이벤트</text>
  <text x="1240" y="488" text-anchor="middle" font-size="22" fill="#5D6D7E">gc cr block 2-way</text>
  <path d="M1020 270 C 850 270, 780 240, 640 260" fill="none" stroke="#5D6D7E" stroke-width="4" marker-end="url(#g)"/>
  <text x="800" y="225" text-anchor="middle" font-size="22" fill="#5D6D7E">① GRD 마스터에 요청</text>
  <path d="M580 440 C 760 440, 840 440, 1020 440" fill="none" stroke="#C0392B" stroke-width="6" marker-end="url(#r)"/>
  <text x="800" y="420" text-anchor="middle" font-size="22" fill="#C0392B" font-weight="700">② 인터커넥트로 블록 전송</text>
  <rect x="80" y="610" width="1440" height="230" rx="12" fill="#fff" stroke="#5D6D7E" stroke-width="2"/>
  <g font-size="24" fill="#212F3D">
    <text x="120" y="665">• 2-way: 요청 노드 → 마스터 = 보유 노드 → 요청 노드 (메시지 2번)</text>
    <text x="120" y="715">• 3-way: 요청 노드 → 마스터 → 보유 노드 → 요청 노드 (2노드에서는 드물다)</text>
    <text x="120" y="765">• current 블록은 갱신용, CR 블록은 읽기 일관성용 사본</text>
    <text x="120" y="815">• 디스크 I/O 대신 네트워크 왕복 — 인터커넥트 지연이 곧 DB 지연</text>
  </g>
</svg>
