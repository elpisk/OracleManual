<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Pretendard, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#34495E"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#27AE60"/></marker></defs>
  <rect width="1600" height="900" fill="#fff"/>
  <text x="800" y="58" text-anchor="middle" font-size="36" font-weight="700" fill="#212F3D">Connect-Time Failover — 접속 시도 단계의 전환</text>
  <rect x="40" y="290" width="330" height="220" rx="12" fill="#fff" stroke="#5D6D7E" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="205" y="340" text-anchor="middle" font-size="28" font-weight="700" fill="#212F3D">클라이언트</text>
  <text x="205" y="385" text-anchor="middle" font-size="22" fill="#212F3D" font-family="JetBrains Mono, monospace">ADDRESS_LIST</text>
  <text x="205" y="420" text-anchor="middle" font-size="22" fill="#212F3D" font-family="JetBrains Mono, monospace">FAILOVER=on</text>
  <text x="205" y="455" text-anchor="middle" font-size="22" fill="#212F3D" font-family="JetBrains Mono, monospace">LOAD_BALANCE=on</text>
  <rect x="470" y="100" width="420" height="120" rx="12" fill="#E9F7EF" stroke="#1E8449" stroke-width="3"/>
  <text x="680" y="150" text-anchor="middle" font-size="26" font-weight="700" fill="#1E8449">이름 해석 rac-scan</text>
  <text x="680" y="192" text-anchor="middle" font-size="22" fill="#212F3D">운영: IP 3개 · 실습: IP 1개</text>
  <rect x="470" y="290" width="420" height="100" rx="12" fill="#fff" stroke="#C0392B" stroke-width="3" stroke-dasharray="10 6"/>
  <text x="680" y="333" text-anchor="middle" font-size="24" font-weight="700" fill="#C0392B">SCAN IP 1 — 응답 없음</text>
  <text x="680" y="368" text-anchor="middle" font-size="22" fill="#212F3D">타임아웃 뒤 다음 주소로</text>
  <rect x="470" y="430" width="420" height="100" rx="12" fill="#E9F7EF" stroke="#1E8449" stroke-width="3"/>
  <text x="680" y="473" text-anchor="middle" font-size="24" font-weight="700" fill="#1E8449">SCAN IP 2 — SCAN 리스너</text>
  <text x="680" y="508" text-anchor="middle" font-size="22" fill="#212F3D">서비스가 있는 인스턴스로 넘김</text>
  <rect x="1010" y="380" width="540" height="200" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <text x="1280" y="430" text-anchor="middle" font-size="26" font-weight="700" fill="#212F3D">노드 리스너 (VIP)</text>
  <text x="1280" y="475" text-anchor="middle" font-size="22" fill="#212F3D">rac2-vip 172.16.225.112</text>
  <text x="1280" y="520" text-anchor="middle" font-size="22" fill="#27AE60" font-weight="700">racdb2 세션 생성</text>
  <rect x="1010" y="130" width="540" height="160" rx="12" fill="#fff" stroke="#C0392B" stroke-width="3"/>
  <text x="1280" y="180" text-anchor="middle" font-size="24" font-weight="700" fill="#C0392B">죽은 노드의 VIP</text>
  <text x="1280" y="220" text-anchor="middle" font-size="22" fill="#212F3D">다른 노드로 옮겨 가 리스너 없음</text>
  <text x="1280" y="255" text-anchor="middle" font-size="22" fill="#212F3D">→ 즉시 거절, TCP 타임아웃 없음</text>
  <line x1="370" y1="330" x2="465" y2="190" stroke="#34495E" stroke-width="3" marker-end="url(#a)"/>
  <text x="380" y="235" font-size="22" fill="#5D6D7E">①</text>
  <line x1="370" y1="380" x2="465" y2="345" stroke="#C0392B" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#r)"/>
  <text x="400" y="342" font-size="22" fill="#C0392B">②</text>
  <line x1="370" y1="450" x2="465" y2="475" stroke="#27AE60" stroke-width="4" marker-end="url(#g)"/>
  <text x="400" y="490" font-size="22" fill="#27AE60">③</text>
  <line x1="890" y1="440" x2="1005" y2="295" stroke="#C0392B" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#r)"/>
  <text x="1015" y="340" font-size="22" fill="#C0392B">노드 장애 때</text>
  <line x1="890" y1="480" x2="1005" y2="480" stroke="#27AE60" stroke-width="4" marker-end="url(#g)"/>
  <rect x="40" y="640" width="1510" height="220" rx="12" fill="#fff" stroke="#34495E" stroke-width="3"/>
  <text x="70" y="690" font-size="24" fill="#212F3D"><tspan font-family="JetBrains Mono, monospace" font-weight="700">TRANSPORT_CONNECT_TIMEOUT</tspan>  주소 하나에 TCP 연결을 기다리는 시간</text>
  <text x="70" y="740" font-size="24" fill="#212F3D"><tspan font-family="JetBrains Mono, monospace" font-weight="700">CONNECT_TIMEOUT</tspan>  인증 전까지 Oracle Net 연결 전체에 허용하는 시간</text>
  <text x="70" y="790" font-size="24" fill="#212F3D"><tspan font-family="JetBrains Mono, monospace" font-weight="700">RETRY_COUNT · RETRY_DELAY</tspan>  주소 목록 전체를 다시 도는 횟수와 간격</text>
  <text x="70" y="838" font-size="22" fill="#5D6D7E">이미 맺어진 세션에는 아무 일도 하지 않는다 — 새 접속 전용</text>
</svg>
