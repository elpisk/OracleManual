<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Pretendard, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#34495E"/></marker>
  <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker></defs>
  <rect width="1600" height="900" fill="#fff"/>
  <text x="800" y="60" text-anchor="middle" font-size="36" font-weight="700" fill="#212F3D">노드 rac1 — ASM 인스턴스와 데이터베이스 인스턴스</text>
  <rect x="60" y="100" width="1480" height="400" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <rect x="100" y="140" width="620" height="320" rx="12" fill="#D6EAF8" stroke="#2471A3" stroke-width="3"/>
  <text x="410" y="190" text-anchor="middle" font-size="30" font-weight="700" fill="#2471A3">+ASM1 (grid · SYSASM)</text>
  <g font-size="22" fill="#212F3D">
    <text x="130" y="240">INSTANCE_TYPE=ASM · STATUS STARTED</text>
    <text x="130" y="280">디스크그룹 메타데이터만 관리</text>
    <text x="130" y="320">RBAL · GMON · ASMB (ASM 고유)</text>
    <text x="130" y="360">LMON · LMD0 · LMS0 (메타데이터 조정)</text>
    <text x="130" y="400">SPFILE: +CRS/…/ASMPARAMETERFILE</text>
  </g>
  <rect x="880" y="140" width="620" height="320" rx="12" fill="#FDEDEC" stroke="#C0392B" stroke-width="3"/>
  <text x="1190" y="190" text-anchor="middle" font-size="30" font-weight="700" fill="#C0392B">racdb1 (oracle · SYSDBA)</text>
  <g font-size="22" fill="#212F3D">
    <text x="910" y="240">INSTANCE_TYPE=RDBMS · STATUS OPEN</text>
    <text x="910" y="280">데이터 파일 · 리두 · 컨트롤 파일</text>
    <text x="910" y="320">ora_asmb_racdb1 이 ASM 에 접속</text>
    <text x="910" y="360">파일의 익스텐트 위치를 받아 온다</text>
    <text x="910" y="400">프로세스 수가 ASM 보다 훨씬 많다</text>
  </g>
  <path d="M875 300 L725 300" stroke="#34495E" stroke-width="3" marker-end="url(#a)"/>
  <path d="M725 340 L875 340" stroke="#34495E" stroke-width="3" marker-end="url(#a)"/>
  <text x="800" y="285" text-anchor="middle" font-size="20" fill="#5D6D7E">ASMB</text>
  <text x="800" y="375" text-anchor="middle" font-size="20" fill="#5D6D7E">익스텐트 맵</text>
  <rect x="60" y="600" width="1480" height="250" rx="12" fill="#D6EAF8" stroke="#2471A3" stroke-width="3"/>
  <text x="800" y="645" text-anchor="middle" font-size="28" font-weight="700" fill="#2471A3">공유 디스크 /dev/asmdisk/* (ASM_DISKSTRING)</text>
  <g font-size="22" fill="#212F3D" text-anchor="middle">
    <rect x="100" y="680" width="320" height="130" rx="12" fill="#fff" stroke="#2471A3" stroke-width="3"/><text x="260" y="735">+CRS crs1~3</text><text x="260" y="775" fill="#5D6D7E">Clusterware 가 마운트</text>
    <rect x="460" y="680" width="320" height="130" rx="12" fill="#fff" stroke="#2471A3" stroke-width="3"/><text x="620" y="735">+DATA · +FRA</text><text x="620" y="775" fill="#5D6D7E">ASM_DISKGROUPS</text>
    <rect x="820" y="680" width="680" height="130" rx="12" fill="#fff" stroke="#2471A3" stroke-width="3" stroke-dasharray="8 6"/><text x="1160" y="735">test1~6 (4GB × 6) — 실습용 후보</text><text x="1160" y="775" fill="#5D6D7E">CANDIDATE · 이 장에서 디스크그룹을 만든다</text>
  </g>
  <path d="M410 460 L410 595" stroke="#34495E" stroke-width="3" marker-end="url(#a)"/>
  <text x="430" y="540" font-size="22" fill="#34495E">메타데이터 갱신</text>
  <path d="M1190 460 L1190 595" stroke="#C0392B" stroke-width="5" marker-end="url(#r)"/>
  <text x="1210" y="540" font-size="22" fill="#C0392B" font-weight="700">데이터 I/O 는 직접</text>
</svg>
