<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Pretendard, sans-serif">
  <defs><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker></defs>
  <rect width="1600" height="900" fill="#fff"/>
  <text x="800" y="60" text-anchor="middle" font-size="36" font-weight="700" fill="#212F3D">익스텐트 단위 미러링 — 디스크그룹 TESTN (Normal)</text>
  <g font-size="28" font-weight="700" fill="#2471A3" text-anchor="middle">
    <text x="300" y="140">장애 그룹 fgA</text><text x="800" y="140">장애 그룹 fgB</text><text x="1300" y="140">장애 그룹 fgC</text>
  </g>
  <rect x="110" y="160" width="380" height="430" rx="12" fill="#D6EAF8" stroke="#2471A3" stroke-width="3"/>
  <rect x="610" y="160" width="380" height="430" rx="12" fill="#D6EAF8" stroke="#2471A3" stroke-width="3"/>
  <rect x="1110" y="160" width="380" height="430" rx="12" fill="#D6EAF8" stroke="#2471A3" stroke-width="3"/>
  <g font-size="22" fill="#5D6D7E" text-anchor="middle" font-family="JetBrains Mono, monospace">
    <text x="300" y="200">D_A  test2</text><text x="800" y="200">D_B  test3</text><text x="1300" y="200">D_C  test6</text>
  </g>
  <g font-size="24" font-weight="700" text-anchor="middle">
    <rect x="150" y="230" width="300" height="60" rx="8" fill="#212F3D"/><text x="300" y="270" fill="#fff">E1 원본</text>
    <rect x="150" y="310" width="300" height="60" rx="8" fill="#fff" stroke="#212F3D" stroke-width="3"/><text x="300" y="350" fill="#212F3D">E2 미러</text>
    <rect x="150" y="390" width="300" height="60" rx="8" fill="#212F3D"/><text x="300" y="430" fill="#fff">E3 원본</text>
    <rect x="650" y="230" width="300" height="60" rx="8" fill="#fff" stroke="#212F3D" stroke-width="3"/><text x="800" y="270" fill="#212F3D">E1 미러</text>
    <rect x="650" y="310" width="300" height="60" rx="8" fill="#212F3D"/><text x="800" y="350" fill="#fff">E4 원본</text>
    <rect x="650" y="390" width="300" height="60" rx="8" fill="#fff" stroke="#212F3D" stroke-width="3"/><text x="800" y="430" fill="#212F3D">E3 미러</text>
    <rect x="1150" y="230" width="300" height="60" rx="8" fill="#212F3D"/><text x="1300" y="270" fill="#fff">E2 원본</text>
    <rect x="1150" y="310" width="300" height="60" rx="8" fill="#fff" stroke="#212F3D" stroke-width="3"/><text x="1300" y="350" fill="#212F3D">E4 미러</text>
  </g>
  <path d="M450 260 L645 260" stroke="#C0392B" stroke-width="4" marker-end="url(#r)"/>
  <text x="300" y="510" text-anchor="middle" font-size="22" fill="#212F3D">원본·미러가 섞여 있다</text>
  <text x="800" y="510" text-anchor="middle" font-size="22" fill="#212F3D">모든 디스크가 읽기를 나눔</text>
  <text x="1300" y="510" text-anchor="middle" font-size="22" fill="#212F3D">추가되면 리밸런스로 채움</text>
  <text x="300" y="550" text-anchor="middle" font-size="22" fill="#5D6D7E">SIDE 0 ≈ SIDE 1</text>
  <rect x="110" y="640" width="1380" height="200" rx="12" fill="#fff" stroke="#C0392B" stroke-width="3"/>
  <text x="150" y="690" font-size="28" font-weight="700" fill="#C0392B">규칙: 같은 익스텐트의 두 사본은 서로 다른 장애 그룹에 놓인다</text>
  <g font-size="24" fill="#212F3D">
    <text x="150" y="740">• 장애 그룹 하나가 통째로 사라져도 모든 익스텐트의 사본이 남는다</text>
    <text x="150" y="785">• 장애 그룹 = 함께 죽는 단위 (컨트롤러·선반·사이트). 이름을 빼면 디스크마다 하나씩 생긴다</text>
    <text x="150" y="825">• 검증: x$kffxp 에서 원본(LXN 0)과 미러(LXN 1)를 짝지어 같은 디스크 조합이 0 인지 본다</text>
  </g>
</svg>
