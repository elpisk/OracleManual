<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Pretendard, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#34495E"/></marker></defs>
  <rect width="1600" height="900" fill="#fff"/>
  <text x="800" y="60" text-anchor="middle" font-size="36" font-weight="700" fill="#212F3D">언마운트와 삭제의 순서 — 디스크그룹 TEST</text>
  <g font-size="22" fill="#212F3D">
    <rect x="60" y="110" width="440" height="280" rx="12" fill="#FDEDEC" stroke="#C0392B" stroke-width="3"/>
    <text x="280" y="160" text-anchor="middle" font-size="26" font-weight="700" fill="#C0392B">1. 데이터베이스 (racdb1)</text>
    <text x="85" y="215" font-family="JetBrains Mono, monospace" font-size="20">drop tablespace ts_test</text>
    <text x="85" y="245" font-family="JetBrains Mono, monospace" font-size="20">  including contents</text>
    <text x="85" y="275" font-family="JetBrains Mono, monospace" font-size="20">  and datafiles;</text>
    <text x="85" y="335">건너뛰면 ORA-15053</text>
    <rect x="580" y="110" width="440" height="280" rx="12" fill="#D6EAF8" stroke="#2471A3" stroke-width="3"/>
    <text x="800" y="160" text-anchor="middle" font-size="26" font-weight="700" fill="#2471A3">2. 다른 노드 (+ASM2)</text>
    <text x="605" y="215" font-family="JetBrains Mono, monospace" font-size="20">alter diskgroup TEST</text>
    <text x="605" y="245" font-family="JetBrains Mono, monospace" font-size="20">  dismount;</text>
    <text x="605" y="335">건너뛰면 ORA-15073</text>
    <rect x="1100" y="110" width="440" height="280" rx="12" fill="#D6EAF8" stroke="#2471A3" stroke-width="3"/>
    <text x="1320" y="160" text-anchor="middle" font-size="26" font-weight="700" fill="#2471A3">3. 남은 노드 (+ASM1)</text>
    <text x="1125" y="215" font-family="JetBrains Mono, monospace" font-size="20">drop diskgroup TEST;</text>
    <text x="1125" y="290">디스크 → FORMER</text>
    <text x="1125" y="335">ora.TEST.dg 도 삭제</text>
  </g>
  <path d="M500 250 L575 250" stroke="#34495E" stroke-width="3" marker-end="url(#a)"/>
  <path d="M1020 250 L1095 250" stroke="#34495E" stroke-width="3" marker-end="url(#a)"/>
  <rect x="60" y="450" width="1480" height="190" rx="12" fill="#FDEDEC" stroke="#C0392B" stroke-width="3" stroke-dasharray="10 6"/>
  <text x="100" y="500" font-size="26" font-weight="700" fill="#C0392B">사용 중일 때: dismount → ORA-15027, dismount force → 성공하지만</text>
  <text x="100" y="550" font-size="22" fill="#212F3D">데이터베이스는 ts_test 의 파일을 여전히 ONLINE 으로 알고 있다 — 첫 접근부터 오류</text>
  <text x="100" y="595" font-size="22" fill="#212F3D">AMB1 이 다른 노드의 +ASM2 로 옮겨 붙어 상태를 재구성한다 (Flex ASM)</text>
  <rect x="60" y="690" width="1480" height="160" rx="12" fill="#fff" stroke="#5D6D7E" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="100" y="740" font-size="24" fill="#212F3D">ASM 오류는 둘째 줄부터 읽는다</text>
  <text x="100" y="785" font-size="22" fill="#5D6D7E">ORA-15018(생성) · ORA-15032(변경) · ORA-15039(삭제) 는 결과, 그 아래 줄이 원인</text>
  <text x="100" y="825" font-size="22" fill="#5D6D7E">강제 삭제 뒤 자원만 남으면 srvctl remove diskgroup -g 이름</text>
</svg>
