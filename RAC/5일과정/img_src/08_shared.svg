<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Pretendard, sans-serif">
  <defs><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#27AE60"/></marker>
  <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker></defs>
  <rect width="1600" height="900" fill="#fff"/>
  <text x="800" y="60" text-anchor="middle" font-size="36" font-weight="700" fill="#212F3D">데이터 파일 23 이 어디에 있느냐에 따라</text>
  <rect x="80" y="110" width="560" height="300" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <text x="360" y="155" text-anchor="middle" font-size="30" font-weight="700" fill="#212F3D">rac1 — racdb1</text>
  <text x="360" y="200" text-anchor="middle" font-size="24" fill="#27AE60">select count(*) → 20000</text>
  <rect x="120" y="240" width="480" height="140" rx="12" fill="#FDEDEC" stroke="#C0392B" stroke-width="3"/>
  <text x="360" y="285" text-anchor="middle" font-size="24" font-weight="700" fill="#C0392B">로컬 디스크</text>
  <text x="360" y="325" text-anchor="middle" font-size="20" fill="#212F3D" font-family="JetBrains Mono, monospace">/u01/app/oracle/oradata/</text>
  <text x="360" y="358" text-anchor="middle" font-size="20" fill="#212F3D" font-family="JetBrains Mono, monospace">ts_mig01.dbf</text>
  <rect x="960" y="110" width="560" height="300" rx="12" fill="#ECF0F1" stroke="#34495E" stroke-width="3"/>
  <text x="1240" y="155" text-anchor="middle" font-size="30" font-weight="700" fill="#212F3D">rac2 — racdb2</text>
  <text x="1240" y="200" text-anchor="middle" font-size="24" font-weight="700" fill="#C0392B">ORA-01157 / ORA-01110</text>
  <g font-size="22" fill="#212F3D"><text x="1000" y="260">• V$DATAFILE: 파일 23 ONLINE</text><text x="1000" y="300">• V$RECOVER_FILE: 0행</text><text x="1000" y="340">• ls 경로 → No such file or directory</text></g>
  <path d="M955 300 L700 300" stroke="#C0392B" stroke-width="4" stroke-dasharray="12 8" marker-end="url(#r)"/>
  <text x="828" y="285" text-anchor="middle" font-size="22" fill="#C0392B" font-weight="700">볼 수 없다</text>
  <rect x="80" y="470" width="1440" height="200" rx="12" fill="#D6EAF8" stroke="#2471A3" stroke-width="3"/>
  <text x="800" y="520" text-anchor="middle" font-size="30" font-weight="700" fill="#2471A3">공유 스토리지 — ASM 디스크그룹 +DATA · +FRA</text>
  <text x="800" y="570" text-anchor="middle" font-size="22" fill="#212F3D" font-family="JetBrains Mono, monospace">+DATA/RACDB/DATAFILE/ts_mig.279.1243020779</text>
  <text x="800" y="625" text-anchor="middle" font-size="24" fill="#27AE60">BACKUP AS COPY + SWITCH 뒤 → 두 노드 모두 20000</text>
  <path d="M360 410 L360 465" stroke="#27AE60" stroke-width="4" marker-end="url(#g)"/>
  <path d="M1240 410 L1240 465" stroke="#27AE60" stroke-width="4" marker-end="url(#g)"/>
  <rect x="80" y="720" width="1440" height="130" rx="12" fill="#fff" stroke="#5D6D7E" stroke-width="2"/>
  <text x="120" y="770" font-size="25" fill="#212F3D">점검 한 줄 — 결과가 0행이어야 RAC 에서 쓸 수 있다</text>
  <text x="120" y="815" font-size="23" fill="#212F3D" font-family="JetBrains Mono, monospace">select name from v$datafile where name not like '+%';</text>
</svg>
